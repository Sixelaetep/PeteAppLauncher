<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>PT Companion v2.14</title>
<!-- PT Companion — version 2.14 — bump this comment + <title> + loginVersion + topBarVersion + VERSION const together on every release -->

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2128">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PT Companion">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
/* ============ DESIGN TOKENS ============
   Palette: Charcoal ink / Chalk white / Slate / Amber highlighter accent
   Signature: amber "marker" underline on headline stats (progression/PBs) —
   evokes a coach circling a number on a whiteboard.
*/
:root{
  --ink:#1C2128;
  --ink-soft:#262C35;
  --slate:#3A4552;
  --chalk:#F5F3EE;
  --chalk-dim:#D8D4C9;
  --amber:#E8A33D;
  --amber-dim:#F0C079;
  --good:#4C8C6B;
  --bad:#C1554A;
  --line:rgba(245,243,238,0.12);
  --shadow:0 8px 24px rgba(0,0,0,0.28);
  --radius:14px;
  --display:'Barlow Condensed', sans-serif;
  --body:'Inter', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--ink);
  color:var(--chalk);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:0.01em;margin:0;}
button{font-family:var(--body);cursor:pointer;}
input,select,textarea{font-family:var(--body);}
a{color:var(--amber);}
::selection{background:var(--amber);color:var(--ink);}

/* focus visibility */
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:2px solid var(--amber); outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

.hidden{display:none !important;}

/* ---------- Login ---------- */
#loginScreen{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 20px; text-align:center;
}
.brandmark{
  width:64px;height:64px;border-radius:16px;background:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;margin-bottom:18px;
  border:1px solid var(--line);
}
.brandmark svg{width:34px;height:34px;}
#loginScreen h1{font-size:30px;margin-bottom:4px;}
.tagline{color:var(--chalk-dim);font-size:14px;margin-bottom:28px;}
.loginCard{
  width:100%;max-width:340px;background:var(--ink-soft);border:1px solid var(--line);
  border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);text-align:left;
}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--chalk-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;}
.field input{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--ink);color:var(--chalk);font-size:16px;
}
.btnPrimary{
  width:100%;padding:12px;border:none;border-radius:10px;background:var(--amber);
  color:var(--ink);font-weight:700;font-size:15px;margin-top:6px;
}
.btnPrimary:disabled{opacity:0.55;cursor:not-allowed;}
.loginError{color:var(--bad);font-size:13px;margin-top:10px;min-height:16px;}
.linkBtn{
  display:block;width:100%;background:none;border:none;color:var(--amber);
  font-size:13px;font-weight:600;text-align:center;padding:10px 0 2px;
}
.loginHint{color:var(--chalk-dim);font-size:12px;margin-top:18px;max-width:320px;line-height:1.5;}
.loginVersion{color:var(--chalk-dim);opacity:0.55;font-size:11px;margin-top:14px;font-family:var(--mono);}

/* ---------- App shell ---------- */
#appShell{min-height:100vh;display:flex;flex-direction:column;}
#topBar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
  background:var(--ink-soft);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:10;
}
#topBar h1{font-size:22px;}
.topBarVersion{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--chalk-dim);opacity:0.6;vertical-align:middle;margin-left:2px;}
.syncDot{width:9px;height:9px;border-radius:50%;background:var(--chalk-dim);display:inline-block;margin-right:7px;}
.syncDot.ok{background:var(--good);}
.syncDot.err{background:var(--bad);}
.syncDot.pending{background:var(--amber);}
#syncBtn{
  display:flex;align-items:center;background:transparent;border:1px solid var(--line);
  color:var(--chalk-dim);font-size:12px;border-radius:20px;padding:6px 12px;
}
#trainerBtn{
  display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line);
  color:var(--chalk-dim);font-size:15px;border-radius:20px;width:32px;height:32px;padding:0;
}

#mainArea{flex:1;padding:16px;padding-bottom:calc(150px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto;}

.searchRow{display:flex;gap:8px;margin-bottom:14px;}
.searchRow input{
  flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--ink-soft);color:var(--chalk);font-size:16px;
}

.clientCard{
  background:var(--ink-soft);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;
  transition:border-color .15s;
}
.clientCard:active{border-color:var(--amber);}
.clientCard .cName{font-size:17px;font-weight:600;}
.clientCard .cMeta{color:var(--chalk-dim);font-size:12.5px;margin-top:3px;}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;letter-spacing:.02em;}
.tagChip{
  display:inline-block;margin:0 6px 6px 0;padding:7px 12px;border-radius:20px;
  border:1px solid var(--line);background:var(--ink);color:var(--chalk-dim);
  font-size:13px;font-weight:600;
}
.tagChip.on{background:var(--amber);color:var(--ink);border-color:var(--amber);}

.pillResult{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  width:100%;text-align:left;padding:10px 14px;margin-bottom:6px;border-radius:12px;
  border:1px solid var(--line);background:var(--ink-soft);color:var(--chalk);
}
.pillResult .prName{font-weight:600;font-size:14.5px;}
.pillResult .prMeta{font-size:11.5px;color:var(--chalk-dim);}
.pillResult.pillCreate{color:var(--amber);font-weight:600;border-style:dashed;}

.setRow{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.setRow .setIdx{font-size:11px;color:var(--chalk-dim);width:16px;flex-shrink:0;}
.setRow input{
  flex:1;min-width:0;padding:9px 8px;border-radius:8px;border:1px solid var(--line);
  background:var(--ink);color:var(--chalk);font-size:15px;
}
.li-tagpill{
  display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:10px;
  background:var(--ink);border:1px solid var(--line);color:var(--chalk-dim);margin:0 4px 4px 0;
}

.calDayChip{
  background:var(--ink-soft);border:1px solid var(--line);border-radius:10px;
  padding:8px 2px;color:var(--chalk);position:relative;text-align:center;
}
.calDayChip .cdLabel{font-size:10px;color:var(--chalk-dim);text-transform:uppercase;}
.calDayChip .cdNum{font-size:17px;font-weight:700;margin-top:2px;}
.calDayChip.today .cdNum{color:var(--amber);}
.calDayChip.selected{border-color:var(--amber);background:rgba(232,163,61,0.1);}
.calDayChip .cdDot{width:5px;height:5px;border-radius:50%;background:var(--amber);margin:4px auto 0;}

.badge.active{background:rgba(76,140,107,0.18);color:var(--good);}
.badge.archived{background:rgba(255,255,255,0.08);color:var(--chalk-dim);}

.emptyState{
  text-align:center;padding:60px 20px;color:var(--chalk-dim);
}
.emptyState .glyph{font-size:40px;margin-bottom:10px;}

.fab{
  position:fixed;right:20px;bottom:calc(78px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;background:var(--amber);color:var(--ink);
  border:none;font-size:28px;font-weight:700;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;line-height:0;
  z-index:20;
}

#bottomNav{
  position:fixed;left:0;right:0;bottom:0;display:flex;
  background:var(--ink-soft);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:15;
}
.navTab{
  flex:1;background:none;border:none;color:var(--chalk-dim);font-size:11px;font-weight:600;
  padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
}
.navTab .navIcon{font-size:19px;line-height:1;}
.navTab.active{color:var(--amber);}

/* ---------- Sheet / modal ---------- */
.sheetBackdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:30;
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:var(--ink-soft);width:100%;max-width:640px;border-radius:18px 18px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);
  border-top:1px solid var(--line);
}
.sheetHandle{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px;}
.sheetHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.sheetHeader h2{font-size:22px;}
.iconBtn{background:none;border:none;color:var(--chalk-dim);font-size:20px;padding:4px 8px;}

.tabRow{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
.tabBtn{
  background:none;border:none;color:var(--chalk-dim);font-size:14px;font-weight:600;
  padding:9px 4px;border-bottom:2px solid transparent;margin-right:16px;
}
.tabBtn.active{color:var(--amber);border-bottom-color:var(--amber);}

.statRow{display:flex;gap:18px;margin-bottom:18px;flex-wrap:wrap;}
.stat{}
.stat .num{
  font-family:var(--mono);font-size:26px;font-weight:600;position:relative;display:inline-block;
}
.stat .num.highlight::after{
  content:'';position:absolute;left:-2px;right:-2px;bottom:1px;height:9px;
  background:var(--amber);opacity:0.35;transform:rotate(-1deg);z-index:-1;border-radius:2px;
}
.stat .lbl{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

textarea.notesArea{
  width:100%;min-height:80px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--ink);color:var(--chalk);font-size:16px;resize:vertical;
}

.rowActions{display:flex;gap:10px;margin-top:18px;}
.btnGhost{
  flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;
  color:var(--chalk);font-weight:600;font-size:14px;
}
.btnDanger{color:var(--bad);border-color:rgba(193,85,74,0.4);}
.btnAmber{
  flex:1;padding:11px;border-radius:10px;border:none;background:var(--amber);color:var(--ink);
  font-weight:700;font-size:14px;
}

.phasePlaceholder{
  text-align:center;color:var(--chalk-dim);padding:36px 10px;font-size:13.5px;line-height:1.6;
}

/* ---------- Sync drawer ---------- */
.drawerRow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.drawerRow span:first-child{color:var(--chalk-dim);}
.drawerRow span:last-child{font-family:var(--mono);}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));
  background:var(--chalk);color:var(--ink);padding:10px 18px;border-radius:20px;font-size:13.5px;
  font-weight:600;box-shadow:var(--shadow);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1;}

/* PT-004: programme PDF export (Phase 3, delivered v2.13). #pdfPrintArea is
   filled and printed on demand by exportProgrammePDF(), then cleared —
   normally empty and hidden. body.printing isolates it as the only visible
   content so window.print() produces a clean single-column summary. */
#pdfPrintArea{display:none;}
@media print{
  #topBar,.fab,#bottomNav,.sheetBackdrop .iconBtn{display:none !important;}
  body.printing > *:not(#pdfPrintArea){display:none !important;}
  body.printing #pdfPrintArea{display:block !important;color:#000;background:#fff;padding:20px;}
}
</style>
</head>
<body>
<div id="pdfPrintArea"></div>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="brandmark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="10.5" width="20" height="3" rx="1.5" fill="#E8A33D"/>
      <rect x="0" y="7" width="4" height="10" rx="2" fill="#E8A33D"/>
      <rect x="20" y="7" width="4" height="10" rx="2" fill="#E8A33D"/>
      <rect x="1" y="9" width="2" height="6" rx="1" fill="#F5F3EE"/>
      <rect x="21" y="9" width="2" height="6" rx="1" fill="#F5F3EE"/>
    </svg>
  </div>
  <h1>PT Companion</h1>
  <div class="tagline">Programmes, sessions and progress — all in one place</div>
  <div class="loginCard">
    <div class="field">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="username" inputmode="email">
    </div>
    <div class="field">
      <label for="loginPass">Password</label>
      <input id="loginPass" type="password" autocomplete="current-password">
    </div>
    <button class="btnPrimary" id="loginBtn">Log in</button>
    <button class="linkBtn" id="forgotPassBtn" type="button">Forgot password?</button>
    <div class="loginError" id="loginError"></div>
  </div>
  <div class="loginHint">Accounts are created by your admin in Supabase, but you set and reset your own password — there's no sign-up screen, just "Forgot password?" above.</div>
  <div class="loginVersion" id="loginVersion">v2.14</div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell" class="hidden">
  <div id="topBar">
    <h1>PT Companion <span class="topBarVersion" id="topBarVersion">v2.14</span></h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <button id="trainerBtn" title="Your trainer details">🧑‍🏫</button>
      <button id="syncBtn"><span class="syncDot" id="syncDot"></span><span id="syncLabel">Sync</span></button>
    </div>
  </div>

  <div id="mainArea">
    <div class="searchRow">
      <input id="mainSearch" type="text" placeholder="Search…">
    </div>
    <div id="mainList"></div>
  </div>

  <button class="fab" id="mainFab" title="Add">+</button>

  <div id="bottomNav">
    <button class="navTab active" data-tab="clients"><span class="navIcon">👤</span>Clients</button>
    <button class="navTab" data-tab="calendar"><span class="navIcon">📅</span>Calendar</button>
    <button class="navTab" data-tab="templates"><span class="navIcon">📋</span>Plans</button>
    <button class="navTab" data-tab="exercises"><span class="navIcon">🏋️</span>Exercises</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================================
   PT COMPANION — index.html
   Phase 1: auth, client roster, robust sync engine, PWA shell.
   Phase 2+: programmes, PDF export, session logging, insights.
   ========================================================================= */
const VERSION = '2.14';
// v2.14 (PT-006, PT-005): Programme tab is list-first now — every
// programme for a client shows up front (active first, then most recent),
// each with an explicit "Set active" toggle and an Open into the same
// detail/edit view regardless of active/archived status. That detail view
// is the old active-only editor, generalised (renderProgrammeDetail()) so
// any programme can be edited, have plans added/removed, or be exported —
// not just the active one. Creating a programme still auto-archives
// whatever was previously active (unchanged), but now that can also be
// done manually from any programme via "Set as active", which archives
// whichever other programme currently holds that status for the client.
// Also adds a "Your details" sheet (🧑‍🏫 in the top bar) for the trainer's
// own name/business/contact — stored as a single _env.data.trainerProfile
// object (not a per-record synced array, so it isn't yet pushed to its own
// Supabase table, but it does round-trip in full JSON backups). Trainer
// details and programme notes now appear on PDF exports (redesigned with
// a header banner using the app's own icon), and are passed through as
// extra, harmless fields on Gym Tracker JSON exports.
// v2.13 (PT-004): Programme PDF export and Gym Tracker JSON export, both
// available from the active programme card and from every entry in a
// client's archived-programme history (trainer picks any programme, not
// just the active one). PDF uses window.print() against the #pdfPrintArea
// reserved since Phase 3 — no PDF library. Gym Tracker export writes the
// exact programImport schema (schemaVersion:1, type:"programImport",
// programName, exercises[], plans[]) already used by the manual bulk
// import template, renaming exercise `trackType`→`type` (the one real
// shape difference) so a client's own Gym Tracker can import it with zero
// changes on its side beyond the new Program-grouping work landing there
// in the same release (see Gym Tracker v2.58 changelog).
// v2.12: Self-service password reset/set, so this no longer has to go
// through Pete. Uses Supabase Auth's built-in recovery flow — works with
// the anon key only, no admin/service-role access needed:
//  - "Forgot password?" on the login screen emails a reset link (calls
//    /auth/v1/recover with a dynamically-built redirect_to, so it works
//    on whatever URL this is actually deployed at).
//  - The link brings the trainer back to this same app with a recovery
//    token in the URL hash fragment; initAuth() detects this before any
//    normal session-restore logic runs, and shows a "set new password"
//    screen instead of the login form. Setting the password signs them
//    straight in — no need to type the new password again immediately.
//  - Logged-in trainers can also proactively change their password any
//    time from the Data & Backup modal's Account section.
// Onboarding a brand-new trainer: Pete can now set any throwaway initial
// password in Supabase (or none, if using Supabase's own invite-email
// flow) — the trainer's first action is simply "Forgot password?" to set
// their own real one. Pete never needs to know or type anyone's password.
// v2.11: SECURITY FIX — full multi-trainer isolation audit ahead of sharing
// this app with a second trainer. Found and fixed two real issues:
// (1) Local storage (the offline cache of clients/exercises/programmes/
// sessions/appointments) used ONE shared key regardless of who was logged
// in. If a second trainer logged into the same browser after a first one,
// the app loaded straight into the first trainer's cached data — pullTable
// only ever adds/updates from the cloud, it never removes local-only
// records, so the first trainer's clients would stay visible indefinitely.
// Fixed: every local storage key is now namespaced by the logged-in
// user's id (lsKeyFor/retryKeyFor), and onAuthed() reloads the envelope
// fresh for whichever user just authenticated rather than trusting
// whatever was already in memory. A one-time, lossless migration moves
// any existing device's old shared-key data into the first post-upgrade
// login's namespaced key, so nobody's existing data is lost.
// (2) There was no way to sign out — onSignedOut() existed in code but no
// button called it, so a session on a shared/borrowed device had no way
// to be ended short of clearing browser data manually. Added a working
// "Sign out" control in the Data & Backup modal.
// Server-side: confirmed every push explicitly stamps trainer_id from the
// current session, and Supabase RLS (auth.uid() = trainer_id, checked on
// both read and write) is the backstop that makes cross-account writes
// impossible even if client code were compromised — this release fixes
// the client-side display/cache gap RLS alone doesn't cover.
// v2.10: Real root-cause fix for the calendar showing an odd date range
// (not just a labeling issue, as v2.9 assumed). addDaysIso() and
// todayISO() built a Date at local midnight, then read it back via
// .toISOString() — which is always UTC. In any timezone AHEAD of UTC
// (UK during BST = UTC+1, for example), local midnight is still the
// previous day in UTC, so every date computed this way silently shifted
// backwards by a day, compounding on every addDaysIso call — this is why
// whole weeks could drift off Monday-Sunday rather than just being
// mislabelled. Fixed by extracting date components locally throughout
// (toISODateLocal helper) instead of round-tripping through UTC.
// Verified against a simulated Europe/London (BST) environment: the old
// code shifted a full week by 2+ days; the fix produces the exact
// Monday-Sunday range expected.
// v2.9: Calendar had no indication of which week/month it was showing
// beyond the individual day numbers, so paging back or forward a few
// weeks left you guessing. Added a date-range label ("28 Jul – 3 Aug
// 2026") above the week navigation, built explicitly in day-before-month
// order rather than relying on locale defaults (which produced awkward
// "3 – Aug 9" phrasing in testing).
// v2.8: Data & Backup modal, opened from the sync pill (replaces the old
// immediate-sync-on-tap behaviour — sync now happens via a "Sync now"
// button inside the modal). Full JSON export/import for manual backups:
// export downloads the complete envelope; import replaces all local data
// with the file's contents (confirmed first — irreversible), bumps every
// record's updatedAt to import time so the restore wins the next sync
// regardless of what's in the cloud, re-runs all migrations in case the
// backup predates this version, and pushes everything to the cloud.
// Also: a templated bulk importer for exercises, plans, and client
// programmes from one JSON file (download the template to see the shape).
// Exercises are matched by name and skipped if they already exist rather
// than duplicated; missing exercises referenced by a plan/programme item
// are auto-created; programmes match clients by name, skipping and
// reporting any that don't match rather than silently dropping them.
const LS_KEY  = 'pt_companion_v1';
const RETRY_KEY_BASE = 'pt_companion_retry_v1';
// SECURITY FIX (v2.11): LS_KEY and the retry queue key used to be single,
// unscoped localStorage keys shared by whoever happened to be logged in on
// this device. If a second trainer logged in on the same browser after a
// first one, the app loaded straight into the FIRST trainer's cached
// clients/programmes/sessions — pullTable's merge only ever adds/updates
// records from the cloud, it never removes local-only ones, so the first
// trainer's data would sit there, visible, indefinitely. Every local key is

// device can never show one trainer's data to another. See lsKeyFor/
// retryKeyFor below, and how onAuthed() now reloads _env fresh per user
// rather than relying on whatever was in memory at page load.

function retryKeyFor(userId){ return RETRY_KEY_BASE + '_' + (userId || 'anon'); }

// proven pattern exactly (direct fetch() to Supabase's own REST API rather
// than a third-party JS library). This was the actual root cause of every
// prior login failure: the app depended on loading @supabase/supabase-js
// from a public CDN, and that CDN load was evidently being blocked. fetch()

async function sbSignIn(email, password){

    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();

  return data;
}
async function sbRefreshSession(refreshToken){

    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ refresh_token: refreshToken })
    });
    if (!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }

async function sbSignOut(accessToken){

    await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
      method: 'POST',

// Self-service password reset — works entirely with the anon key, no admin
// access needed. sbRecoverPassword() asks Supabase to email a recovery
// link; the link redirects back to this same app URL with a recovery
// token in the URL fragment (#access_token=...&type=recovery), which
// parseRecoveryHash() picks up at boot. sbSetPassword() then uses that
// token (or a normal logged-in session's token) to actually set the new
// password via GoTrue's own /auth/v1/user endpoint.
async function sbRecoverPassword(email, redirectTo){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/recover?redirect_to=${encodeURIComponent(redirectTo)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
    body: JSON.stringify({ email })
  });
  if (!res.ok){
    const data = await res.json().catch(()=>({}));
    throw new Error(data.error_description || data.msg || 'Could not send reset email');
  }
}
async function sbSetPassword(accessToken, newPassword){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + accessToken },
    body: JSON.stringify({ password: newPassword })
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error_description || data.msg || 'Could not set password');
  return data; // updated user object
}
// Supabase's recovery-link redirect appends tokens as a URL hash fragment,
// never a query string, and never touches the server — safe to parse
// client-side. Returns null if this isn't a recovery redirect.
function parseRecoveryHash(){
  const hash = window.location.hash || '';
  if (!hash.includes('type=recovery')) return null;
  const params = new URLSearchParams(hash.replace(/^#/, ''));
  const accessToken = params.get('access_token');
  const refreshToken = params.get('refresh_token');
  if (!accessToken) return null;
  return { access_token: accessToken, refresh_token: refreshToken, token_type: params.get('token_type') || 'bearer', expires_in: Number(params.get('expires_in'))||3600 };
}
// Raw REST wrapper for pt_* tables (PostgREST). RLS on the tables still
// enforces auth.uid() = trainer_id — that's derived from the JWT in the
// Authorization header, identically whether sent via the SDK or via fetch.
async function sbFetch(path, options={}){
  const headers = Object.assign({
    'Content-Type': 'application/json',
    'apikey': SUPABASE_ANON_KEY
  }, options.headers || {});
  if (_session && _session.access_token) headers['Authorization'] = 'Bearer ' + _session.access_token;
  return fetch(SUPABASE_URL + path, Object.assign({}, options, { headers }));
}

// ---- Local envelope -------------------------------------------------------
// {version, lastUpdated, lastExported, data:{clients:[...], exercises:[...], programs:[...]}}
// Backwards-compatible: a v1.6 backup with only `clients` still loads fine —
// exercises/programs default to empty arrays rather than failing.
function defaultEnv(){
  return { version: 1, lastUpdated: new Date().toISOString(), lastExported: null, data: { clients: [], exercises: [], programs: [], tags: [], sessions: [], appointments: [], trainerProfile: { name:'', businessName:'', email:'', phone:'' } } };
}
// No user is known yet at page load — start empty. loadEnvForUser() runs
// once a login succeeds (see onAuthed), replacing this with that user's
// own namespaced data (or migrating the old shared key the first time, if
// this device was used before the per-user storage fix).
let _env = defaultEnv();
let _envGeneration = 0; // guards against a stale in-flight pull overwriting a fresher import/replace

function normalizeEnvShape(parsed){
  parsed.data = parsed.data || {};
  parsed.data.clients   = Array.isArray(parsed.data.clients)   ? parsed.data.clients   : [];
  parsed.data.exercises = Array.isArray(parsed.data.exercises) ? parsed.data.exercises : [];
  parsed.data.programs  = Array.isArray(parsed.data.programs)  ? parsed.data.programs  : [];
  parsed.data.tags      = Array.isArray(parsed.data.tags)      ? parsed.data.tags      : [];
  parsed.data.sessions  = Array.isArray(parsed.data.sessions)  ? parsed.data.sessions  : [];
  parsed.data.appointments = Array.isArray(parsed.data.appointments) ? parsed.data.appointments : [];
  // PT-005: single settings object, not a per-record array — absent in any
  // pre-v2.14 backup, so default it rather than fail.
  parsed.data.trainerProfile = (parsed.data.trainerProfile && typeof parsed.data.trainerProfile === 'object')
    ? { name: parsed.data.trainerProfile.name||'', businessName: parsed.data.trainerProfile.businessName||'', email: parsed.data.trainerProfile.email||'', phone: parsed.data.trainerProfile.phone||'' }
    : { name:'', businessName:'', email:'', phone:'' };
  migrateLegacySessions(parsed.data.sessions);
  migrateLegacyClients(parsed.data.clients);
  migrateLegacyExercises(parsed.data.exercises);
  migrateProgramKinds(parsed.data.programs);
  migrateLegacyProgramItems(parsed.data.programs);
  return parsed;
}

function loadEnvForUser(userId){
  const scopedKey = lsKeyFor(userId);
  try{
    let raw = localStorage.getItem(scopedKey);
    if (!raw){
      // One-time, lossless migration: before v2.11 all trainers on a device
      // shared one unscoped key. If that legacy data exists and this user
      // has no scoped copy yet, claim it as theirs (device previously had
      // at most one trainer using it) rather than silently discarding it.
      const legacy = localStorage.getItem(LS_KEY);
      if (legacy){
        localStorage.setItem(scopedKey, legacy);
        localStorage.removeItem(LS_KEY);
        raw = legacy;
      }
    }
    if (!raw) return defaultEnv();
    const parsed = JSON.parse(raw);
    if (typeof parsed.version !== 'number') throw new Error('Missing version field');
    return normalizeEnvShape(parsed);
  }catch(e){
    console.error('Local envelope load failed, starting fresh:', e);
    return defaultEnv();
  }
}
function save(env){
  env.lastUpdated = new Date().toISOString();
  localStorage.setItem(lsKeyFor(getUserId()), JSON.stringify(env));
}
function uuid(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}

// ---- Retry queue (persisted — survives reload/offline blips) -------------
function loadRetryQueueForUser(userId){
  try{
    let raw = localStorage.getItem(retryKeyFor(userId));
    if (!raw){
      const legacy = localStorage.getItem(RETRY_KEY_BASE);
      if (legacy){ localStorage.setItem(retryKeyFor(userId), legacy); localStorage.removeItem(RETRY_KEY_BASE); raw = legacy; }
    }
    return raw ? (JSON.parse(raw) || []) : [];
  }catch(e){ return []; }
}
function saveRetryQueue(q){ localStorage.setItem(retryKeyFor(getUserId()), JSON.stringify(q)); }
let _retryQueue = [];

function queueRetry(table, record){
  _retryQueue = _retryQueue.filter(r => !(r.table===table && r.record.id===record.id)); // dedupe, latest wins
  _retryQueue.push({ table, record, queuedAt: new Date().toISOString() });
  saveRetryQueue(_retryQueue);
  renderSyncStatus();
}
async function flushRetryQueue(){
  if (!_retryQueue.length || !getUserId()) return;
  const remaining = [];
  for (const item of _retryQueue){
    const ok = await pushRecord(item.table, item.record, true);
    if (!ok) remaining.push(item);
  }
  _retryQueue = remaining;
  saveRetryQueue(_retryQueue);
  renderSyncStatus();
}

async function initAuth(){
  const recovery = parseRecoveryHash();
  if (recovery){
    history.replaceState(null, '', window.location.pathname + window.location.search); // scrub the token out of the visible URL/history
    showSetNewPasswordScreen(recovery);
    return;
  }
  const stored = localStorage.getItem(SESSION_KEY);
  if (stored){
    try{
      const parsed = JSON.parse(stored);
      const refreshed = await sbRefreshSession(parsed.refresh_token);
      if (refreshed){
        localStorage.setItem(SESSION_KEY, JSON.stringify(refreshed));
        onAuthed(refreshed);
        return;
      }
    }catch(e){ console.error('Session restore failed:', e); }
    localStorage.removeItem(SESSION_KEY);
  }
  // No valid session — login screen is already showing by default.
}

function onSignedOut(){
  if (_session && _session.access_token) sbSignOut(_session.access_token);
  _session = null;

  // user's own cache stays on disk for next time), but clearing memory too

// ---- Sync engine -------------------------------------------------------
// Pattern (matches Gym Tracker / pal-sync semantics):
//  - every record carries updatedAt + optional _deleted:true tombstone
//  - push = upsert to cloud, keyed by record id, scoped by trainer_id (RLS)
//  - pull = merge cloud rows into local by id; cloud wins on conflict
//  - a tombstone is only dropped locally once the cloud copy of that id is
//    ALSO a confirmed tombstone — an unconfirmed local delete keeps retrying
//    rather than silently vanishing if the push hasn't landed yet
//  - failed pushes go to a persisted retry queue, flushed on reconnect
let _syncState = 'idle'; // idle | syncing | ok | error

async function pushRecord(table, record, isRetry){
  if (!getUserId()) { queueRetry(table, record); return false; }
  const payload = { id: record.id, trainer_id: getUserId(), data: record, updated_at: record.updatedAt || new Date().toISOString() };
  try{
    const res = await sbFetch(`/rest/v1/${table}`, {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([payload])
    });
    if (!res.ok){
      console.error('push failed', table, record.id, res.status, await res.text().catch(()=>''));
      if (!isRetry) queueRetry(table, record);
      _syncState = 'error'; renderSyncStatus();
      return false;
    }
    return true;
  }catch(err){
    console.error('push threw', table, record.id, err);
    if (!isRetry) queueRetry(table, record);
    _syncState = 'error'; renderSyncStatus();
    return false;
  }
}

async function pullTable(table, localArrKey){
  if (!getUserId()) return;
  let rows;
  try{
    const res = await sbFetch(`/rest/v1/${table}?select=id,data,updated_at`);
    if (!res.ok){
      console.error('pull failed', table, res.status, await res.text().catch(()=>''));
      _syncState='error'; renderSyncStatus(); return;
    }
    rows = await res.json();
  }catch(err){
    console.error('pull threw', table, err);
    _syncState='error'; renderSyncStatus(); return;
  }
  const myGen = ++_envGeneration;
  const localArr = _env.data[localArrKey] || [];
  const byId = new Map(localArr.map(r => [r.id, r]));
  (rows || []).forEach(row => {
    const cloudRec = row.data;
    cloudRec.id = row.id;
    const localRec = byId.get(row.id);
    if (!localRec){
      byId.set(row.id, cloudRec); // new from cloud
      return;
    }
    const cloudTime = new Date(row.updated_at).getTime();
    const localTime = new Date(localRec.updatedAt || 0).getTime();
    if (localRec._deleted && !cloudRec._deleted){
      // unconfirmed local tombstone — keep it, re-push so cloud catches up
      queueRetry(table, localRec);
      return;
    }
    if (cloudTime >= localTime){
      byId.set(row.id, cloudRec); // cloud preferred in conflicts
    }
  });
  if (myGen !== _envGeneration) return; // a newer pull/import superseded this one mid-flight
  _env.data[localArrKey] = Array.from(byId.values());
  save(_env);
}

async function pullAll(){
  _syncState = 'syncing'; renderSyncStatus();
  await pullTable('pt_clients', 'clients');
  await pullTable('pt_exercises', 'exercises');
  await pullTable('pt_programs', 'programs');
  await pullTable('pt_tags', 'tags');
  await pullTable('pt_sessions', 'sessions');
  await pullTable('pt_appointments', 'appointments');
  migrateLegacySessions(_env.data.sessions);
  migrateLegacyClients(_env.data.clients);
  migrateLegacyExercises(_env.data.exercises);
  migrateProgramKinds(_env.data.programs);
  migrateLegacyProgramItems(_env.data.programs);
  save(_env);
  _syncState = 'ok'; renderSyncStatus();
}

function persistAndSync(table, localArrKey, record){
  save(_env);
  pushRecord(table, record, false);
}

function downloadJSON(filename, dataObj){
  const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Notes for anyone editing this file by hand:
// - All three top-level keys (exercises/plans/programs) are optional — include only what you're importing.
// - trackType is one of "reps" | "time" | "distance". For "time" sets use {"seconds": N}. For "distance" use {"metres": N, "seconds": N, "weight": N (optional)}.
// - exerciseName is matched case-insensitively against your existing library; if not found, a new exercise is created automatically using the trackType given (defaults to "reps").
// - clientName is matched case-insensitively against your existing clients; programmes for unmatched names are skipped and reported, not silently dropped.
// - Importing a programme archives that client's current active programme, same as creating one normally.

function findOrCreateExercise(name, trackType){
  name = (name||'').trim();
  if (!name) return null;
  const existing = (_env.data.exercises||[]).find(e => !e._deleted && e.name.toLowerCase() === name.toLowerCase());
  if (existing) return existing;
  const now = new Date().toISOString();
  const ex = { id: uuid(), name, trackType: trackType || 'reps', tags: [], notes: '', status: 'active', createdAt: now, updatedAt: now };
  _env.data.exercises = _env.data.exercises || [];
  _env.data.exercises.push(ex);
  persistAndSync('pt_exercises', 'exercises', ex);
  return ex;
}

function buildImportedItem(rawItem){
  const trackType = rawItem.trackType || 'reps';
  const ex = findOrCreateExercise(rawItem.exerciseName, trackType);
  if (!ex) return null;
  const targetSets = Array.isArray(rawItem.targetSets) && rawItem.targetSets.length
    ? rawItem.targetSets.map(s => Object.assign({}, s))
    : [defaultSetForType(trackType)];
  return { itemId: uuid(), exerciseId: ex.id, exerciseName: ex.name, trackType, targetSets, notes: rawItem.notes || '' };
}

function runBulkImport(parsed){
  const result = { exercisesAdded:0, exercisesSkipped:0, plansAdded:0, programsAdded:0, programsSkipped:0, warnings:[] };

  (parsed.exercises||[]).forEach(item => {
    if (!item.name){ result.warnings.push('Skipped an exercise with no name'); return; }
    const existing = (_env.data.exercises||[]).find(e => !e._deleted && e.name.toLowerCase() === item.name.toLowerCase());
    if (existing){ result.exercisesSkipped++; return; }
    const now = new Date().toISOString();
    const ex = { id: uuid(), name: item.name, trackType: item.trackType || 'reps', tags: Array.isArray(item.tags) ? item.tags.slice() : [], notes: item.notes || '', status: 'active', createdAt: now, updatedAt: now };
    _env.data.exercises = _env.data.exercises || [];
    _env.data.exercises.push(ex);
    persistAndSync('pt_exercises', 'exercises', ex);
    result.exercisesAdded++;
  });

  (parsed.plans||[]).forEach(planDef => {
    if (!planDef.name){ result.warnings.push('Skipped a plan with no name'); return; }
    const items = (planDef.items||[]).map(buildImportedItem).filter(Boolean);
    const now = new Date().toISOString();
    const plan = { id: uuid(), kind:'plan', clientId:null, name: planDef.name, notes: planDef.notes || '', items, createdAt: now, updatedAt: now };
    _env.data.programs = _env.data.programs || [];
    _env.data.programs.push(plan);
    persistAndSync('pt_programs', 'programs', plan);
    result.plansAdded++;
  });

  (parsed.programs||[]).forEach(progDef => {
    if (!progDef.clientName){ result.warnings.push(`Skipped programme "${progDef.name||'(unnamed)'}" — no clientName given`); return; }
    const client = (_env.data.clients||[]).find(c => !c._deleted && c.name.toLowerCase() === progDef.clientName.toLowerCase());
    if (!client){ result.warnings.push(`Skipped programme "${progDef.name||'(unnamed)'}" — no client named "${progDef.clientName}"`); result.programsSkipped++; return; }
    const existingActive = activeProgrammeFor(client.id);
    if (existingActive){
      existingActive.status = 'archived'; existingActive.updatedAt = new Date().toISOString();
      persistAndSync('pt_programs', 'programs', existingActive);
    }
    const now = new Date().toISOString();
    const plans = (progDef.plans||[]).map(pl => ({
      id: uuid(), name: pl.name || 'Plan',
      items: (pl.items||[]).map(buildImportedItem).filter(Boolean)
    }));
    const prog = {
      id: uuid(), kind:'programme', clientId: client.id, name: progDef.name || 'Imported programme',
      startDate: progDef.startDate || todayISO(), durationWeeks: progDef.durationWeeks != null ? progDef.durationWeeks : null,
      notes: progDef.notes || '', status:'active', plans, createdAt: now, updatedAt: now
    };
    _env.data.programs = _env.data.programs || [];
    _env.data.programs.push(prog);
    persistAndSync('pt_programs', 'programs', prog);
    result.programsAdded++;
  });

  save(_env);
  return result;
}

// Restoring a full backup replaces local data wholesale. Per the suite's
// established pattern: imported records' updatedAt is bumped to import
// time so the restore wins the next sync/pull regardless of what's
// already in the cloud — restoring a backup is a deliberate "this is the
// truth now" action. All migrations re-run in case the backup predates
// the current version.
function restoreFullBackup(parsed){
  const now = new Date().toISOString();
  const data = parsed.data || {};
  const bump = (arr) => (Array.isArray(arr)?arr:[]).map(r => Object.assign({}, r, { updatedAt: now }));

  _env.data.clients = bump(data.clients);
  _env.data.exercises = bump(data.exercises);
  _env.data.programs = bump(data.programs);
  _env.data.tags = bump(data.tags);
  _env.data.sessions = bump(data.sessions);
  _env.data.appointments = bump(data.appointments);
  _env.data.trainerProfile = (data.trainerProfile && typeof data.trainerProfile === 'object')
    ? { name: data.trainerProfile.name||'', businessName: data.trainerProfile.businessName||'', email: data.trainerProfile.email||'', phone: data.trainerProfile.phone||'' }
    : { name:'', businessName:'', email:'', phone:'' };

  migrateLegacyClients(_env.data.clients);
  migrateLegacyExercises(_env.data.exercises);
  migrateProgramKinds(_env.data.programs);
  migrateLegacyProgramItems(_env.data.programs);
  migrateLegacySessions(_env.data.sessions);

  _envGeneration++; // invalidate any in-flight pull so it can't clobber this restore
  save(_env);

  // Push everything to cloud so the restore actually propagates, not just
  // sits locally until the next unrelated edit happens to sync it.
  ['clients','exercises','programs','tags','sessions','appointments'].forEach(key => {
    const table = { clients:'pt_clients', exercises:'pt_exercises', programs:'pt_programs', tags:'pt_tags', sessions:'pt_sessions', appointments:'pt_appointments' }[key];
    (_env.data[key]||[]).forEach(record => pushRecord(table, record, false));
  });
}

function openChangePasswordSheet(){
  const backdrop = document.createElement('div');
  backdrop.className = 'sheetBackdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheetHandle"></div>
      <div class="sheetHeader"><h2>Change password</h2><button class="iconBtn" data-close>✕</button></div>

      <div class="loginError" id="cpError"></div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', e => { if (e.target===backdrop) backdrop.remove(); });
  backdrop.querySelector('[data-close]').addEventListener('click', () => backdrop.remove());
  backdrop.querySelector('#cpSave').addEventListener('click', async () => {
    const p1 = backdrop.querySelector('#cpPass1').value;

    const btn = backdrop.querySelector('#cpSave');
    errEl.textContent = '';

    btn.disabled = true; btn.textContent = 'Updating…';
    try{
      await sbSetPassword(_session.access_token, p1);
      backdrop.remove();
      toast('Password updated ✓');
    }catch(err){
      errEl.textContent = err && err.message ? err.message : 'Could not update password.';
      btn.disabled = false; btn.textContent = 'Update password';
    }
  });
}

function renderMainArea(){
  const search = document.getElementById('mainSearch');
  const searchRow = document.querySelector('.searchRow');
  searchRow.classList.toggle('hidden', _currentTab === 'calendar');
  if (_currentTab === 'clients'){ search.placeholder = 'Search clients…'; renderClientList(); }
  else if (_currentTab === 'calendar'){ renderCalendarTab(); }
  else if (_currentTab === 'templates'){ search.placeholder = 'Search plans…'; renderTemplateList(); }
  else { search.placeholder = 'Search exercises…'; renderExerciseList(); }
}
document.querySelectorAll('.navTab').forEach(btn => {
  btn.addEventListener('click', () => {
    _currentTab = btn.dataset.tab;
    document.querySelectorAll('.navTab').forEach(b => b.classList.toggle('active', b===btn));
    document.getElementById('mainSearch').value = '';
    renderMainArea();
  });
});
document.getElementById('mainSearch').addEventListener('input', renderMainArea);
document.getElementById('mainFab').addEventListener('click', () => {
  if (_currentTab === 'clients') openClientSheet(null);
  else if (_currentTab === 'calendar') openAppointmentSheet(_calSelectedDate || todayISO());

  else openExerciseSheet(null);
});

function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---- Clients CRUD --------------------------------------------------------
function activeClients(){
  return (_env.data.clients || []).filter(c => !c._deleted);
}
function renderClientList(){
  const q = (document.getElementById('mainSearch').value || '').toLowerCase();
  const list = document.getElementById('mainList');
  const clients = activeClients()
    .filter(c => !q || (c.name||'').toLowerCase().includes(q))
    .sort((a,b) => (a.name||'').localeCompare(b.name||''));
  if (!clients.length){
    list.innerHTML = '<div class="emptyState"><div class="glyph">🗒️</div>Add your first client to get started.</div>';
    return;
  }
  list.innerHTML = clients.map(c => `
    <div class="clientCard" data-id="${escHtml(c.id)}">
      <div>
        <div class="cName">${escHtml(c.name || 'Unnamed client')}${c.injuryNotes ? ' <span title="Has injury/issue notes">⚠️</span>' : ''}</div>
        <div class="cMeta">${escHtml(c.goals || 'No goals set')}</div>
      </div>
      <span class="badge ${c.status==='archived'?'archived':'active'}">${c.status==='archived'?'Archived':'Active'}</span>
    </div>
  `).join('');
  list.querySelectorAll('.clientCard').forEach(el => {
    el.addEventListener('click', () => openClientSheet(el.dataset.id));
  });
}

function renderClientSheetBody(backdrop, client, isNew, tab, highlightSessionId){
  const body = backdrop.querySelector('#clientSheetBody');
  if (tab === 'overview'){
    body.innerHTML = `
      <div class="field"><label>Name</label><input id="cfName" type="text" value="${escHtml(client.name)}"></div>
      <div class="field"><label>Goals</label><input id="cfGoals" type="text" value="${escHtml(client.goals)}" placeholder="e.g. Fat loss, 5k under 25min"></div>

      <div class="field"><label>Notes</label><textarea id="cfNotes" class="notesArea">${escHtml(client.notes)}</textarea></div>
      ${!isNew ? `<div class="field"><label>Status</label>
        <select id="cfStatus" style="width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--chalk);font-size:16px;">

          <option value="archived" ${client.status==='archived'?'selected':''}>Archived</option>
        </select></div>` : ''}
      ${!isNew ? `<div class="phasePlaceholder">Session logging and progress insights arrive in upcoming releases.</div>` : ''}

        ${!isNew ? '<button class="btnGhost btnDanger" id="cfDelete">Delete</button>' : ''}

      const name = body.querySelector('#cfName').value.trim();

      client.goals = body.querySelector('#cfGoals').value.trim();
      client.injuryNotes = body.querySelector('#cfInjuries').value;
      client.notes = body.querySelector('#cfNotes').value;
      const statusEl = body.querySelector('#cfStatus');
      if (statusEl) client.status = statusEl.value;
      client.updatedAt = new Date().toISOString();
      if (isNew){
        _env.data.clients = _env.data.clients || [];
        _env.data.clients.push(client);
      }
      persistAndSync('pt_clients', 'clients', client);
      renderClientList();
      backdrop.remove();
      toast(isNew ? 'Client added' : 'Saved');
    });
    const delBtn = body.querySelector('#cfDelete');
    if (delBtn){

        backdrop.remove();
        toast('Client deleted');
      });
    }
  } else if (tab === 'programme'){
    renderClientProgrammeTab(body, client);
  } else if (tab === 'sessions'){
    renderClientSessionsTab(body, client, highlightSessionId);
  } else if (tab === 'insights'){
    renderClientInsightsTab(body, client);
  }
}

// ---- Programme helpers (shared by client programmes & templates) --------
function activeExercises(){
  return (_env.data.exercises || []).filter(e => !e._deleted && e.status !== 'archived');
}
function allPrograms(){ return _env.data.programs || []; }
function templates(){ return allPrograms().filter(p => !p._deleted && p.kind === 'plan'); }
function clientProgrammes(clientId){ return allPrograms().filter(p => !p._deleted && p.kind==='programme' && p.clientId===clientId); }
function activeProgrammeFor(clientId){ return clientProgrammes(clientId).find(p => p.status === 'active'); }
// PT-006: explicit toggle, usable from the programme list or from inside a
// programme's own detail view — archives whatever else is currently active
// for this client (there's still only ever one active programme at a time;
// that invariant is unchanged, just user-driven now instead of only
// happening automatically on creation).
function setActiveProgramme(client, programmeId){
  const now = new Date().toISOString();
  clientProgrammes(client.id).forEach(p => {
    if (p.id === programmeId && p.status !== 'active'){
      p.status = 'active'; p.updatedAt = now; persistAndSync('pt_programs','programs',p);
    } else if (p.id !== programmeId && p.status === 'active'){
      p.status = 'archived'; p.updatedAt = now; persistAndSync('pt_programs','programs',p);
    }
  });
}

function fmtMinSec(seconds){
  seconds = Number(seconds)||0;
  const m = Math.floor(seconds/60), s = seconds%60;
  return m>0 ? `${m}:${String(s).padStart(2,'0')}` : `${s}s`;
}
function itemSummary(item, setsKey){
  setsKey = setsKey || 'targetSets';
  const sets = item[setsKey] || [];
  if (!sets.length) return item.notes || 'No target set';
  const n = sets.length;
  if (item.trackType === 'time'){
    return `${n} set${n===1?'':'s'} · ${sets.map(s=>fmtMinSec(s.seconds)).join(', ')}`;
  }
  if (item.trackType === 'distance'){
    return `${n} set${n===1?'':'s'} · ${sets.map(s=>`${s.metres||0}m in ${fmtMinSec(s.seconds)}`).join(', ')}`;
  }
  return `${n} set${n===1?'':'s'} · ${sets.map(s=>`${s.reps||0}${s.weight?'×'+s.weight+'kg':''}`).join(', ')}`;
}

function renderItemList(container, items, onEdit, onRemove, setsKey){
  if (!items.length){
    container.innerHTML = '<div class="emptyState" style="padding:24px 10px;">No exercises added yet.</div>';
    return;
  }
  container.innerHTML = items.map((it,idx) => `
    <div class="clientCard" data-idx="${idx}" style="margin-bottom:8px;">
      <div>
        <div class="cName">${escHtml(it.exerciseName)}</div>
        <div class="cMeta">${escHtml(itemSummary(it, setsKey))}</div>
      </div>
      <button class="iconBtn" data-remove="${idx}" title="Remove">✕</button>
    </div>
  `).join('');
  container.querySelectorAll('.clientCard').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-remove]')) return;
      onEdit(Number(el.dataset.idx));
    });
  });
  container.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); onRemove(Number(btn.dataset.remove)); });
  });
}

function defaultSetForType(type){
  return type==='distance' ? {metres:1000, seconds:300, weight:0} : type==='time' ? {seconds:30} : {reps:10, weight:0};
}

// Shared exercise search+pick UI (search box, tappable pill results, quick-
// create). Used by both the programme/template item editor and session
// logging — identical interaction, different things happen after picking.
function renderExerciseSearchPicker(zone, onPick){
  zone.innerHTML = `
    <div class="field"><label>Find exercise</label><input id="epSearch" type="text" placeholder="Search by name or tag…" autocomplete="off"></div>
    <div id="epResults"></div>
  `;
  const searchEl = zone.querySelector('#epSearch');
  const resultsEl = zone.querySelector('#epResults');
  function renderResults(){
    const q = searchEl.value.trim().toLowerCase();
    if (!q){ resultsEl.innerHTML = '<div class="cMeta" style="padding:6px 2px;">Type to search your exercise library…</div>'; return; }
    const matches = activeExercises()
      .filter(e => e.name.toLowerCase().includes(q) || (e.tags||[]).some(t=>t.toLowerCase().includes(q)))
      .slice(0, 8);
    const exactMatch = activeExercises().some(e => e.name.toLowerCase() === q);
    let html = matches.map(e => `
      <button type="button" class="pillResult" data-id="${escHtml(e.id)}">
        <span class="prName">${escHtml(e.name)}</span>

      </button>
    `).join('');
    if (!matches.length) html += '<div class="cMeta" style="padding:6px 2px;">No matches.</div>';

// Shared per-set-type builder (reps: reps+weight; time: min:sec;
// distance: metres+min:sec+optional weight), add/remove per set. Used for
// both a programme's target sets and a session's actual sets — `setsLabel`
// distinguishes them in the UI; `sets` is mutated in place.
function renderSetBuilder(zone, sets, trackType, setsLabel){
  const rows = sets.map((s, si) => {
    if (trackType === 'distance'){
      return `<div class="setRow" data-si="${si}">
        <span class="setIdx">${si+1}</span>
        <input type="number" min="0" placeholder="metres" value="${s.metres||''}" data-f="metres">
        <input type="number" min="0" placeholder="min" style="max-width:64px" value="${Math.floor((s.seconds||0)/60)}" data-f="min">
        <input type="number" min="0" max="59" placeholder="sec" style="max-width:64px" value="${(s.seconds||0)%60}" data-f="sec">
        <input type="number" min="0" step="0.5" placeholder="kg (opt)" value="${s.weight||''}" data-f="weight">
        <button type="button" class="iconBtn" data-remove="${si}">✕</button>
      </div>`;
    }
    if (trackType === 'time'){
      return `<div class="setRow" data-si="${si}">
        <span class="setIdx">${si+1}</span>
        <input type="number" min="0" placeholder="min" value="${Math.floor((s.seconds||0)/60)}" data-f="min">
        <input type="number" min="0" max="59" placeholder="sec" value="${(s.seconds||0)%60}" data-f="sec">
        <button type="button" class="iconBtn" data-remove="${si}">✕</button>
      </div>`;
    }
    return `<div class="setRow" data-si="${si}">
      <span class="setIdx">${si+1}</span>
      <input type="number" min="0" placeholder="reps" value="${s.reps||''}" data-f="reps">
      <input type="number" min="0" step="0.5" placeholder="kg" value="${s.weight||''}" data-f="weight">
      <button type="button" class="iconBtn" data-remove="${si}">✕</button>
    </div>`;
  }).join('');
  zone.innerHTML = `
    <div class="field"><label>${escHtml(setsLabel)}</label><div id="sbRows">${rows}</div>
      <div class="rowActions"><button type="button" class="btnGhost" id="sbAddSet">+ Add set</button></div>
    </div>
  `;
  zone.querySelectorAll('.setRow input').forEach(inp => {
    inp.addEventListener('input', () => {
      const si = Number(inp.closest('.setRow').dataset.si);
      const field = inp.dataset.f;
      const set = sets[si];
      if (field === 'min'){ const sec=(set.seconds||0)%60; set.seconds = (Number(inp.value)||0)*60 + sec; }
      else if (field === 'sec'){ const min=Math.floor((set.seconds||0)/60); set.seconds = min*60 + (Number(inp.value)||0); }
      else { set[field] = inp.type==='number' ? (inp.value===''?0:Number(inp.value)) : inp.value; }
    });
  });
  zone.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => { sets.splice(Number(btn.dataset.remove),1); renderSetBuilder(zone, sets, trackType, setsLabel); });
  });
  zone.querySelector('#sbAddSet').addEventListener('click', () => {
    const last = sets[sets.length-1];
    sets.push(last ? Object.assign({}, last) : defaultSetForType(trackType));
    renderSetBuilder(zone, sets, trackType, setsLabel);
  });
}

// Opens a stacked sheet to add/edit one exercise-assignment within a
// programme or template. `onSave` receives the finished item.
function openItemSheet(existingItem, onSave){
  const item = existingItem ? JSON.parse(JSON.stringify(existingItem)) : { itemId: uuid(), exerciseId:'', exerciseName:'', trackType:'reps', targetSets:[], notes:'' };
  const backdrop = document.createElement('div');
  backdrop.className = 'sheetBackdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheetHandle"></div>
      <div class="sheetHeader"><h2>${existingItem ? 'Edit exercise' : 'Add exercise'}</h2><button class="iconBtn" data-close>✕</button></div>
      <div id="ifPickerZone"></div>
      <div id="ifSetsZone"></div>
      <div class="field" id="ifNotesField"></div>
      <div class="rowActions"><button class="btnAmber" id="ifSave" disabled>${existingItem ? 'Save' : 'Add to programme'}</button></div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', e => { if (e.target===backdrop) backdrop.remove(); });
  backdrop.querySelector('[data-close]').addEventListener('click', () => backdrop.remove());

  const pickerZone = backdrop.querySelector('#ifPickerZone');
  const setsZone = backdrop.querySelector('#ifSetsZone');
  const notesField = backdrop.querySelector('#ifNotesField');
  const saveBtn = backdrop.querySelector('#ifSave');

  function renderNotes(){
    notesField.innerHTML = `<label>Coaching notes for this exercise (optional)</label><input id="ifNotes" type="text" value="${escHtml(item.notes)}" placeholder="e.g. 3 sec eccentric, wide grip">`;
    notesField.querySelector('#ifNotes').addEventListener('input', e => { item.notes = e.target.value; });
  }

  function renderPicked(){
    saveBtn.disabled = !item.exerciseId;
    pickerZone.innerHTML = `
      <div class="field"><label>Exercise</label>
        <div class="clientCard" style="margin-bottom:4px;">
          <div><div class="cName">${escHtml(item.exerciseName)}</div><div class="cMeta">Tracked as ${escHtml(item.trackType)}</div></div>
          <button class="iconBtn" id="ifChangeEx" title="Change exercise">✎</button>
        </div>
      </div>
    `;
    pickerZone.querySelector('#ifChangeEx').addEventListener('click', renderSearch);
    renderSetBuilder(setsZone, item.targetSets, item.trackType, 'Target sets');
    renderNotes();
  }

  function renderSearch(){
    saveBtn.disabled = true;
    setsZone.innerHTML = '';
    notesField.innerHTML = '';
    renderExerciseSearchPicker(pickerZone, (ex) => {
      if (!ex) return;
      const typeChanged = item.exerciseId && item.trackType !== ex.trackType;
      item.exerciseId = ex.id;
      item.exerciseName = ex.name;
      if (typeChanged || !item.targetSets.length){
        item.trackType = ex.trackType;
        item.targetSets = [defaultSetForType(ex.trackType)];
      }
      renderPicked();
    });
  }

  if (item.exerciseId) renderPicked(); else renderSearch();

  saveBtn.addEventListener('click', () => {
    if (!item.exerciseId){ toast('Choose an exercise'); return; }
    onSave(item);
    backdrop.remove();
  });
}

function planItemCount(programme){ return (programme.plans||[]).reduce((n,pl) => n + (pl.items||[]).length, 0); }

// PT-004: export a programme in the exact schema Gym Tracker's
// importProgramFileHandler() expects (schemaVersion:1, type:"programImport",
// programName, exercises[], plans[]). Gym Tracker's exercise import reads
// `type`, not `trackType` — the only real field rename needed, since item-
// level shape (exerciseName/trackType/targetSets) already matches, right
// down to distance sets using {metres, seconds, weight}.
function exportProgrammeForGymTracker(programme, client){
  const usedNames = new Set();
  (programme.plans||[]).forEach(pl => (pl.items||[]).forEach(it => { if (it.exerciseName) usedNames.add(it.exerciseName.toLowerCase()); }));
  const exercises = (_env.data.exercises||[]).filter(e => !e._deleted && usedNames.has(e.name.toLowerCase()))
    .map(e => ({ name: e.name, type: e.trackType || 'reps', tags: e.tags||[], notes: e.notes||'' }));
  const plans = (programme.plans||[]).map(pl => ({
    name: pl.name,
    notes: pl.notes||'',
    items: (pl.items||[]).map(it => ({ exerciseName: it.exerciseName, trackType: it.trackType, targetSets: (it.targetSets||[]).map(s=>Object.assign({},s)) }))
  }));
  // PT-005: trainer details and programme notes are extra fields Gym
  // Tracker's importProgramFileHandler() simply ignores (it only reads
  // schemaVersion/type/programName/exercises/plans) — harmless to include,
  // useful for anyone reading the raw file, and free if Gym Tracker ever
  // wants to surface them later.
  const tp = _env.data.trainerProfile || {};
  const bundle = {
    schemaVersion: 1, type: "programImport", programName: programme.name,
    programNotes: programme.notes || '',
    trainerName: tp.name || '', trainerBusiness: tp.businessName || '',
    exercises, plans
  };
  const safeName = (n) => (n||'export').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  downloadJSON(`gym-tracker-import-${safeName(client && client.name)}-${safeName(programme.name)}.json`, bundle);
  toast('Gym Tracker import file downloaded');
}

// ---- Calendar (appointment booking) ------------------------------------
// Date-only helpers work entirely in LOCAL date-space. The previous
// version built a Date at local midnight then read it back via
// toISOString() (which is always UTC) — in any timezone ahead of UTC
// (e.g. UK during BST, UTC+1), local midnight is still the previous day
// in UTC, so every date computed this way silently shifted back by one
// day. That's why the calendar's week could drift off Monday–Sunday.
function toISODateLocal(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return toISODateLocal(new Date()); }
function addDaysIso(iso, days){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return toISODateLocal(d);
}
function mondayOf(iso){
  const d = new Date(iso + 'T00:00:00');
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diff = dow === 0 ? -6 : 1 - dow;
  return addDaysIso(iso, diff);
}
let _calWeekStart = mondayOf(todayISO());
let _calSelectedDate = todayISO();

function activeAppointments(){ return (_env.data.appointments||[]).filter(a => !a._deleted); }
function appointmentsOnDate(iso){
  return activeAppointments().filter(a => a.date === iso).sort((a,b) => (a.time||'').localeCompare(b.time||''));
}

function formatWeekRange(weekStart){
  const start = new Date(weekStart + 'T00:00:00');
  const end = new Date(addDaysIso(weekStart, 6) + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const sameMonth = start.getFullYear() === end.getFullYear() && start.getMonth() === end.getMonth();
  const startFmt = sameMonth ? `${start.getDate()}` : `${start.getDate()} ${months[start.getMonth()]}`;
  const endFmt = `${end.getDate()} ${months[end.getMonth()]} ${end.getFullYear()}`;
  return `${startFmt} – ${endFmt}`;
}

function renderCalendarTab(){
  const list = document.getElementById('mainList');
  const days = [0,1,2,3,4,5,6].map(i => addDaysIso(_calWeekStart, i));
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  list.innerHTML = `
    <div style="text-align:center;font-size:13px;font-weight:600;color:var(--chalk-dim);margin-bottom:8px;">${escHtml(formatWeekRange(_calWeekStart))}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <button class="iconBtn" id="calPrevWeek">◀</button>
      <button class="btnGhost" id="calToday" style="padding:6px 14px;">This week</button>
      <button class="iconBtn" id="calNextWeek">▶</button>
    </div>
    <div id="calWeekStrip" style="display:flex;gap:6px;margin-bottom:16px;"></div>
    <div id="calDayList"></div>
  `;
  const stripEl = list.querySelector('#calWeekStrip');
  stripEl.innerHTML = days.map((iso, i) => {
    const count = appointmentsOnDate(iso).length;
    const isToday = iso === todayISO();
    const isSelected = iso === _calSelectedDate;
    return `
      <button type="button" class="calDayChip ${isSelected?'selected':''} ${isToday?'today':''}" data-date="${iso}" style="flex:1;">
        <div class="cdLabel">${dayNames[i]}</div>
        <div class="cdNum">${Number(iso.slice(8,10))}</div>
        ${count ? `<div class="cdDot"></div>` : ''}
      </button>
    `;
  }).join('');
  stripEl.querySelectorAll('.calDayChip').forEach(el => {
    el.addEventListener('click', () => { _calSelectedDate = el.dataset.date; renderCalendarTab(); });
  });
  list.querySelector('#calPrevWeek').addEventListener('click', () => { _calWeekStart = addDaysIso(_calWeekStart, -7); renderCalendarTab(); });
  list.querySelector('#calNextWeek').addEventListener('click', () => { _calWeekStart = addDaysIso(_calWeekStart, 7); renderCalendarTab(); });
  list.querySelector('#calToday').addEventListener('click', () => { _calWeekStart = mondayOf(todayISO()); _calSelectedDate = todayISO(); renderCalendarTab(); });

  const dayListEl = list.querySelector('#calDayList');
  const appts = appointmentsOnDate(_calSelectedDate);
  const dateLabel = new Date(_calSelectedDate+'T00:00:00').toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });
  dayListEl.innerHTML = `
    <div style="font-size:15px;font-weight:600;margin-bottom:10px;">${escHtml(dateLabel)}</div>
    ${!appts.length ? '<div class="emptyState" style="padding:30px 10px;"><div class="glyph">📅</div>No appointments this day.</div>' : appts.map(a => {
      const client = (_env.data.clients||[]).find(c=>c.id===a.clientId);
      return `
        <div class="clientCard" data-id="${escHtml(a.id)}" style="margin-bottom:8px;">
          <div><div class="cName">${escHtml(a.time||'')} — ${escHtml(client?client.name:'Unknown client')}</div><div class="cMeta">${a.durationMinutes||30} min${a.notes?' · '+escHtml(a.notes):''}</div></div>
        </div>
      `;
    }).join('')}
  `;
  dayListEl.querySelectorAll('.clientCard').forEach(el => {
    el.addEventListener('click', () => openAppointmentDetail(appts.find(a=>a.id===el.dataset.id)));
  });
}

function buildReviewDraft(sourceProg){
  if (!sourceProg) return [];
  return (sourceProg.plans||[]).map(pl => ({
    id: uuid(), name: pl.name,
    items: (pl.items||[]).map(it => Object.assign({}, it, {
      itemId: uuid(),
      targetSets: (it.targetSets||[]).map(s => Object.assign({}, s)),
      reviewNote: '' // working note while deciding progression — not carried into the saved programme
    }))
  }));
}

function openSessionSheet(client, existingSession, parentBody){
  const isNew = !existingSession;
  const activeProg = activeProgrammeFor(client.id);
  const session = existingSession ? JSON.parse(JSON.stringify(existingSession)) : {

  document.body.appendChild(backdrop);

  // ---- Review draft: collapsible plans, editable per-exercise ----

      : '';

    if (btn) btn.addEventListener('click', onCreateNextProgramme);

  function renderDraft(){
    if (!session.programmeId || !_reviewDraft.length){
      draftZone.innerHTML = session.programmeId
        ? '<div class="phasePlaceholder">This programme has no plans to review.</div>'
        : '';
      return;
    }
    draftZone.innerHTML = `
      <div class="field"><label>Review last programme's plans</label></div>
      <div id="ssDraftPlans"></div>
      <div class="rowActions"><button type="button" class="btnGhost" id="ssAddDraftPlan">+ Add another plan</button></div>
    `;
    const plansEl = draftZone.querySelector('#ssDraftPlans');
    plansEl.innerHTML = _reviewDraft.map((pl, pi) => `
      <details class="reviewPlanBlock" data-pi="${pi}" style="margin-bottom:10px;background:var(--ink-soft);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;">
        <summary style="cursor:pointer;font-weight:600;font-size:14.5px;">${escHtml(pl.name)} <span style="color:var(--chalk-dim);font-weight:400;font-size:12px;">(${pl.items.length} exercises)</span></summary>
        <div class="rowActions" style="margin-top:10px;">
          <button type="button" class="btnGhost" data-replaceplan="${pi}">🔁 Replace plan</button>
          <button type="button" class="btnGhost btnDanger" data-removeplan="${pi}">Remove plan</button>
        </div>
        <div id="ssDraftItems-${pi}" style="margin-top:8px;"></div>
        <div class="rowActions"><button type="button" class="btnGhost" data-addex="${pi}">+ Add exercise</button></div>

    _reviewDraft.forEach((pl, pi) => {

    plansEl.querySelectorAll('[data-replaceplan]').forEach(btn => {

          _reviewDraft[pi] = { id: uuid(), name, items: (items||[]).map(it => Object.assign({}, it, { itemId: uuid(), targetSets: (it.targetSets||[]).map(s=>Object.assign({},s)), reviewNote:'' })) };
          renderDraft();
        });
      });
    });
    plansEl.querySelectorAll('[data-removeplan]').forEach(btn => {
      btn.addEventListener('click', () => {
        const pi = Number(btn.dataset.removeplan);

      });

    plansEl.querySelectorAll('[data-addex]').forEach(btn => {
      btn.addEventListener('click', () => {

          item.reviewNote = '';

        });

  function renderDraftItems(pi){
    const container = draftZone.querySelector(`#ssDraftItems-${pi}`);
    if (!container) return;
    const items = _reviewDraft[pi].items;
    if (!items.length){
      container.innerHTML = '<div class="cMeta">No exercises in this plan.</div>';

    }
    container.innerHTML = items.map((it, ii) => `

            <button type="button" class="iconBtn" data-edittarget="${ii}" title="Adjust target">✎</button>
            <button type="button" class="iconBtn" data-removeex="${ii}" title="Remove">✕</button>
          </div>
        </div>
        <input type="text" data-notefor="${ii}" value="${escHtml(it.reviewNote)}" placeholder="Note any changes or issues for this exercise…" style="width:100%;margin-top:6px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ink);color:var(--chalk);font-size:14px;">

      inp.addEventListener('input', () => { items[Number(inp.dataset.notefor)].reviewNote = inp.value; });
    });
    container.querySelectorAll('[data-edittarget]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ii = Number(btn.dataset.edittarget);
        openItemSheet(items[ii], (updated) => {
          updated.reviewNote = items[ii].reviewNote; // preserve the note through the edit
          items[ii] = updated;
          renderDraftItems(pi);
        });
      });
    });
    container.querySelectorAll('[data-removeex]').forEach(btn => {
      btn.addEventListener('click', () => {
        items.splice(Number(btn.dataset.removeex), 1);
        renderDraftItems(pi);
      });
    });
  }

  renderDraft();
  renderNewProgRow();

  backdrop.querySelector('#ssProg').addEventListener('change', (e) => {
    session.programmeId = e.target.value || null;
    _reviewDraft = buildReviewDraft(allPrograms().find(p => p.id === session.programmeId));
    renderDraft();
    renderNewProgRow();
  });

  const itemListEl = backdrop.querySelector('#ssItemList');
  const refreshItems = () => renderItemList(itemListEl, session.items,
    (idx) => openSessionItemSheet(session.items[idx], client, (updated) => { session.items[idx]=updated; refreshItems(); }),
    (idx) => { session.items.splice(idx,1); refreshItems(); },
    'actualSets'
  );
  refreshItems();
  backdrop.querySelector('#ssAddItem').addEventListener('click', () => {
    openSessionItemSheet(null, client, (item) => { session.items.push(item); refreshItems(); });
  });

  function persist(){
    const date = backdrop.querySelector('#ssDate').value;
    if (!date){ toast('Pick a date'); return false; }
    session.date = date;
    session.reviewNotes = backdrop.querySelector('#ssReview').value;
    session.progressionNotes = backdrop.querySelector('#ssProgression').value;
    session.updatedAt = new Date().toISOString();
    if (isNew){
      _env.data.sessions = _env.data.sessions || [];
      _env.data.sessions.push(session);
    }
    persistAndSync('pt_sessions', 'sessions', session);
    return true;
  }

  backdrop.querySelector('#ssSave').addEventListener('click', () => {
    if (!persist()) return;
    backdrop.remove();

    toast(isNew ? 'Session saved' : 'Saved');
  });
  const delBtn = backdrop.querySelector('#ssDelete');
  if (delBtn) delBtn.addEventListener('click', () => {
    if (!confirm('Delete this session? This can\'t be undone.')) return;
    session._deleted = true; session.updatedAt = new Date().toISOString();
    persistAndSync('pt_sessions', 'sessions', session);
    backdrop.remove();
    renderClientSessionsTab(parentBody, client);
    toast('Session deleted');
  });

  // Builds the next programme from the (possibly edited) review draft —
  // adjusted targets, added exercises, and replaced/removed/added plans
  // all carry through, rather than a blind duplicate of the old programme.
  function onCreateNextProgramme(){
    const sourceProg = allPrograms().find(p => p.id === session.programmeId);
    if (!sourceProg){ toast('Programme not found'); return; }
    if (!persist()) return;
    if (sourceProg.status === 'active'){
      sourceProg.status = 'archived'; sourceProg.updatedAt = new Date().toISOString();
      persistAndSync('pt_programs', 'programs', sourceProg);
    }
    const nextProg = {
      id: uuid(), kind:'programme', clientId: client.id, name: sourceProg.name, notes: sourceProg.notes||'',
      startDate: todayISO(), durationWeeks: sourceProg.durationWeeks || null,
      status:'active',
      plans: _reviewDraft.map(pl => ({
        id: uuid(), name: pl.name,
        items: pl.items.map(it => {
          const clean = Object.assign({}, it, { itemId: uuid(), targetSets: (it.targetSets||[]).map(s=>Object.assign({},s)) });
          delete clean.reviewNote; // was working notes for this review only, not a programme field
          return clean;
        })
      })),
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
    };
    _env.data.programs = _env.data.programs || [];
    _env.data.programs.push(nextProg);
    persistAndSync('pt_programs', 'programs', nextProg);
    backdrop.remove();
    toast('New programme created from this review — edit it in the Programme tab');
    renderClientSessionsTab(parentBody, client);
  }
}
