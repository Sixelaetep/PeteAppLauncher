// Best single number per session for a given exercise, used to plot a
// simple progression trend: reps -> heaviest weight logged (falls back to
// most reps if no weight used); time -> longest duration; distance ->
// furthest distance covered.
function bestSetValue(item){
  const sets = item.actualSets || [];
  if (!sets.length) return null;
  if (item.trackType === 'time') return Math.max(...sets.map(s=>s.seconds||0));
  if (item.trackType === 'distance') return Math.max(...sets.map(s=>s.metres||0));
  const withWeight = sets.filter(s=>s.weight);
  if (withWeight.length) return Math.max(...withWeight.map(s=>s.weight));
  return Math.max(...sets.map(s=>s.reps||0));
}
function formatBestValue(trackType, value){
  if (trackType === 'time') return fmtMinSec(value);
  if (trackType === 'distance') return `${value}m`;
  return value % 1 === 0 ? `${value}kg` : `${value}`;
}

function computeExerciseProgress(clientId){
  const sessions = sessionsFor(clientId).slice().sort((a,b)=>new Date(a.date)-new Date(b.date)); // chronological
  const byExercise = {};
  sessions.forEach(s => {
    s.items.forEach(it => {
      const val = bestSetValue(it);
      if (val===null || isNaN(val)) return;
      const key = it.exerciseId;
      byExercise[key] = byExercise[key] || { exerciseName: it.exerciseName, trackType: it.trackType, points: [] };
      byExercise[key].points.push({ date: s.date, value: val });
    });
  });
  return Object.values(byExercise).filter(e => e.points.length >= 2);
}

function sparklineSvg(points){
  const w = 220, h = 44, pad = 4;
  const values = points.map(p=>p.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const stepX = (w - pad*2) / (points.length - 1 || 1);
  const coords = points.map((p,i) => {
    const x = pad + i*stepX;
    const y = h - pad - ((p.value - min) / range) * (h - pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const dotsColor = 'var(--amber)';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;overflow:visible;">
    <polyline points="${coords.join(' ')}" fill="none" stroke="${dotsColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${coords.map(c => `<circle cx="${c.split(',')[0]}" cy="${c.split(',')[1]}" r="2.5" fill="${dotsColor}"/>`).join('')}
  </svg>`;
}

function renderClientInsightsTab(body, client){
  const sessions = sessionsFor(client.id);
  const now = Date.now();
  const last30 = sessions.filter(s => (now - new Date(s.date).getTime()) <= 30*24*60*60*1000);
  const lastSession = sessions[0]; // already sorted desc
  const daysSince = lastSession ? Math.floor((now - new Date(lastSession.date).getTime())/(24*60*60*1000)) : null;

  const progress = computeExerciseProgress(client.id);

  body.innerHTML = `
    <div class="statRow">
      <div class="stat"><div class="num highlight">${sessions.length}</div><div class="lbl">Total sessions</div></div>
      <div class="stat"><div class="num">${last30.length}</div><div class="lbl">Last 30 days</div></div>
      <div class="stat"><div class="num">${daysSince===null?'—':daysSince}</div><div class="lbl">${daysSince===null?'No sessions yet':'Days since last'}</div></div>
    </div>
    <div id="ciProgress"></div>
  `;
  const progEl = body.querySelector('#ciProgress');
  if (!sessions.length){
    progEl.innerHTML = '<div class="phasePlaceholder">Log a couple of sessions to start seeing progression here.</div>';
    return;
  }
  if (!progress.length){
    progEl.innerHTML = '<div class="phasePlaceholder">No exercise appears in 2+ sessions yet — progression needs at least two data points per exercise.</div>';
    return;
  }
  progEl.innerHTML = '<h3 style="font-size:15px;margin:6px 0 10px;">Progression</h3>' + progress.map(e => {
    const latest = e.points[e.points.length-1];
    const prev = e.points[e.points.length-2];
    const delta = latest.value - prev.value;
    const arrow = delta > 0 ? '▲' : delta < 0 ? '▼' : '–';
    const arrowColor = delta > 0 ? 'var(--good)' : delta < 0 ? 'var(--bad)' : 'var(--chalk-dim)';
    return `
      <div style="background:var(--ink-soft);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <div class="cName">${escHtml(e.exerciseName)}</div>
          <div style="font-family:var(--mono);font-size:14px;color:${arrowColor};">${arrow} ${escHtml(formatBestValue(e.trackType, latest.value))}</div>
        </div>
        <div style="margin-top:8px;">${sparklineSvg(e.points)}</div>
      </div>
    `;
  }).join('');
}

// One-time, non-destructive migration for exercises created in v2.0, which
// had a single `type` field (strength/cardio/mobility/other) and no tags.
// Maps the old field to the new trackType vocabulary (reps/distance/time)
// used for session logging in a later phase, and ensures `tags` exists.
// One-time, non-destructive migration for clients created before v2.6,
// which had no separate injury/issues field.
function migrateLegacyClients(clients){
  (clients||[]).forEach(c => { if (typeof c.injuryNotes !== 'string') c.injuryNotes = ''; });
}

function migrateLegacyExercises(exercises){
  const legacyMap = { strength:'reps', cardio:'distance', mobility:'time', other:'reps' };
  (exercises||[]).forEach(e => {
    if (!e.trackType){
      e.trackType = (e.type && legacyMap[e.type]) || 'reps';
    }
    if (!Array.isArray(e.tags)) e.tags = [];
  });
}

// One-time, non-destructive migration for programme/template items created
// in v2.0/v2.1, which stored a single free-text sets/reps/weight per item
// instead of an array of individual target sets. Best-effort numeric parse;
// anything that can't be cleanly parsed is preserved in the item's notes
// rather than silently dropped.
// One-time, non-destructive migration for pt_programs records created
// before v2.6, when a "programme" was a flat list of items rather than a
// time-bound container holding multiple named Plans. "template" kind
// records rename to "plan" (same shape, just clearer terminology). "client"
// kind records (the old single-list client programme) become "programme"
// records: their flat items become one Plan named "Main plan" inside the
// new `plans` array, and startDate/durationWeeks are added (startDate
// backfilled from the record's original creation date since that's the
// closest available approximation).
function migrateProgramKinds(programs){
  (programs||[]).forEach(p => {
    if (p.kind === 'template'){ p.kind = 'plan'; return; }
    if (p.kind === 'client' && !Array.isArray(p.plans)){
      p.plans = [{ id: uuid(), name: 'Main plan', items: p.items || [] }];
      delete p.items;
      p.startDate = p.startDate || (p.createdAt ? p.createdAt.slice(0,10) : todayISO());
      p.durationWeeks = (p.durationWeeks != null) ? p.durationWeeks : null;
      p.kind = 'programme';
    }
  });
}

function migrateLegacyProgramItems(programs){
  function migrateItemsArray(items){
    (items||[]).forEach(item => {
      if (Array.isArray(item.targetSets)) return; // already v2.2+
      if (!item.trackType) item.trackType = 'reps';
      const setCount = parseInt(item.sets, 10) || 1;
      const repsNum = parseInt(item.reps, 10);
      const weightNum = parseFloat(item.weight);
      const built = [];
      for (let i=0; i<setCount; i++){
        if (item.trackType === 'time') built.push({ seconds: 0 });
        else if (item.trackType === 'distance') built.push({ metres:0, seconds:0, weight: isNaN(weightNum)?0:weightNum });
        else built.push({ reps: isNaN(repsNum)?0:repsNum, weight: isNaN(weightNum)?0:weightNum });
      }
      item.targetSets = built;
      const legacyBits = [item.sets && `${item.sets} sets`, item.reps && `${item.reps} reps`, item.weight].filter(Boolean).join(', ');
      if (legacyBits && (isNaN(repsNum) || isNaN(weightNum))){
        item.notes = (item.notes ? item.notes + ' — ' : '') + `(was: ${legacyBits})`;
      }
      delete item.sets; delete item.reps; delete item.weight;
    });
  }
  (programs||[]).forEach(p => {
    if (Array.isArray(p.items)) migrateItemsArray(p.items); // Plan records
    if (Array.isArray(p.plans)) p.plans.forEach(plan => migrateItemsArray(plan.items)); // Programme records
  });
}

// One-time, non-destructive migration for sessions created in v2.4, which
// were a freeform workout log (date, single notes field, items) rather
// than a PT review (reviewNotes, progressionNotes, linked programme).
// The old free-text `notes` maps to reviewNotes as the closest match;
// nothing is discarded.
function migrateLegacySessions(sessions){
  (sessions||[]).forEach(s => {
    if ('reviewNotes' in s) return; // already v2.5+
    s.reviewNotes = s.notes || '';
    s.progressionNotes = '';
    s.programmeId = s.programmeId || null;
    s.appointmentId = s.appointmentId || null;
    delete s.notes;
  });
}

function openTagManagerSheet(){

  backdrop.innerHTML = `

      </div>
    </div>
  `;
  document.body.appendChild(backdrop);

  backdrop.querySelector('[data-close]').addEventListener('click', () => backdrop.remove());
  const listEl = backdrop.querySelector('#tmList');
  const searchEl = backdrop.querySelector('#tmSearch');

  function render(){
    const q = searchEl.value.trim().toLowerCase();

      listEl.innerHTML = '<div class="emptyState" style="padding:24px 10px;"><div class="glyph">🏷️</div>No tags yet.</div>';

        </div>
      `).join('')}
    `).join('');
    listEl.querySelectorAll('.clientCard').forEach(el => el.addEventListener('click', () => openTagSheet(el.dataset.id, render)));
  }
  searchEl.addEventListener('input', render);
  render();

  backdrop.querySelector('#tmAdd').addEventListener('click', () => openTagSheet(null, render));
  backdrop.querySelector('#tmSeed').addEventListener('click', () => loadStarterTags(render));

function openTagSheet(id, onDone){
  const tag = id ? (_env.data.tags||[]).find(t=>t.id===id) : { id: uuid(), name:'', bodyArea:'Other', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
  const isNew = !id;
  const backdrop = document.createElement('div');
  backdrop.className = 'sheetBackdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheetHandle"></div>
      <div class="sheetHeader"><h2>${isNew ? 'Add tag' : 'Edit tag'}</h2><button class="iconBtn" data-close>✕</button></div>
      <div class="field"><label>Tag name</label><input id="tgName" type="text" value="${escHtml(tag.name)}" placeholder="e.g. Glutes"></div>
      <div class="field"><label>Body area</label>
        <select id="tgArea" style="width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--chalk);font-size:16px;">
          ${BODY_AREAS.map(a => `<option value="${a}" ${tag.bodyArea===a?'selected':''}>${a}</option>`).join('')}
        </select>
      </div>
      <div class="rowActions">
        ${!isNew ? '<button class="btnGhost btnDanger" id="tgDelete">Delete</button>' : ''}
        <button class="btnAmber" id="tgSave">${isNew ? 'Add tag' : 'Save'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', e => { if (e.target===backdrop) backdrop.remove(); });
  backdrop.querySelector('[data-close]').addEventListener('click', () => backdrop.remove());
  backdrop.querySelector('#tgSave').addEventListener('click', () => {
    const name = backdrop.querySelector('#tgName').value.trim();
    if (!name){ toast('Name is required'); return; }
    const dupe = activeTags().find(t => t.id!==tag.id && t.name.toLowerCase()===name.toLowerCase());
    if (dupe){ toast('A tag with that name already exists'); return; }
    tag.name = name;
    tag.bodyArea = backdrop.querySelector('#tgArea').value;
    tag.updatedAt = new Date().toISOString();
    if (isNew){
      _env.data.tags = _env.data.tags || [];
      _env.data.tags.push(tag);
    }
    persistAndSync('pt_tags', 'tags', tag);
    if (onDone) onDone(tag);
    backdrop.remove();
    toast(isNew ? 'Tag added' : 'Saved');
  });
  const delBtn = backdrop.querySelector('#tgDelete');
  if (delBtn) delBtn.addEventListener('click', () => {
    if (!confirm(`Delete tag "${tag.name}"? This can't be undone.`)) return;
    tag._deleted = true; tag.updatedAt = new Date().toISOString();
    persistAndSync('pt_tags', 'tags', tag);
    if (onDone) onDone(null);
    backdrop.remove();
    toast('Tag deleted');
  });
}

function loadStarterTags(onDone){
  const existingNames = new Set(activeTags().map(t => t.name.toLowerCase()));
  const now = new Date().toISOString();
  let added = 0;
  _env.data.tags = _env.data.tags || [];
  TAG_STARTER_LIBRARY.forEach(item => {
    if (existingNames.has(item.name.toLowerCase())) return;
    const record = { id: uuid(), name: item.name, bodyArea: item.bodyArea, createdAt: now, updatedAt: now };
    _env.data.tags.push(record);
    persistAndSync('pt_tags', 'tags', record);
    existingNames.add(item.name.toLowerCase());
    added++;
  });
  if (onDone) onDone();
  toast(added ? `Added ${added} tag${added===1?'':'s'} ✓` : 'All starter tags already in your library');
}

let _exAreaFilter = 'All';
function exerciseMatchesArea(e, area){
  if (area === 'All') return true;
  const tagObjs = (e.tags||[]).map(name => activeTags().find(t=>t.name===name)).filter(Boolean);
  if (area === 'Other') return !e.tags.length || tagObjs.some(t => t.bodyArea==='Other') || e.tags.some(name => !activeTags().some(t=>t.name===name));
  return tagObjs.some(t => t.bodyArea === area);
}
function renderAreaChips(container){
  const all = ['All', ...BODY_AREAS, 'Other'];
  container.innerHTML = all.map(a => `<button type="button" class="tagChip ${_exAreaFilter===a?'on':''}" data-area="${escHtml(a)}" style="margin-bottom:8px;">${escHtml(a)}</button>`).join('');
  container.querySelectorAll('[data-area]').forEach(btn => {
    btn.addEventListener('click', () => { _exAreaFilter = btn.dataset.area; renderExerciseList(); });
  });
}

function renderExerciseList(){
  const q = (document.getElementById('mainSearch').value || '').toLowerCase();
  const list = document.getElementById('mainList');

    && (!q || (e.name||'').toLowerCase().includes(q) || (e.tags||[]).some(t=>t.toLowerCase().includes(q)))
    && exerciseMatchesArea(e, _exAreaFilter))
    .sort((a,b) => (a.name||'').localeCompare(b.name||''));
  const topBar = `
    <div id="exAreaChips" style="margin-bottom:10px;"></div>

    list.innerHTML = topBar + '<div class="emptyState"><div class="glyph">🏋️</div>Add exercises to build programmes from.</div>';
  } else {
    list.innerHTML = topBar + exercises.map(e => `
      <div class="clientCard" data-id="${escHtml(e.id)}" style="align-items:flex-start;">
        <div>
          <div class="cName">${escHtml(e.name)} <span class="badge active" style="margin-left:4px;">${escHtml(e.trackType||'reps')}</span></div>
          <div class="cMeta" style="margin-top:5px;">${(e.tags&&e.tags.length) ? e.tags.map(t=>`<span class="li-tagpill">${escHtml(t)}</span>`).join(' ') : '<span style="opacity:0.6;">No tags</span>'}</div>
        </div>
        <span class="badge ${e.status==='archived'?'archived':'active'}">${e.status==='archived'?'Archived':'Active'}</span>
      </div>

  }
  renderAreaChips(list.querySelector('#exAreaChips'));
  list.querySelectorAll('.clientCard').forEach(el => el.addEventListener('click', () => openExerciseSheet(el.dataset.id)));
  const seed = list.querySelector('#seedExBtn');

}

function loadStarterExercises(){
  const existingNames = new Set((_env.data.exercises||[]).filter(e=>!e._deleted).map(e => e.name.toLowerCase()));
  const now = new Date().toISOString();
  let added = 0;
  _env.data.exercises = _env.data.exercises || [];
  EXERCISE_STARTER_LIBRARY.forEach(item => {
    if (existingNames.has(item.name.toLowerCase())) return;
    const record = { id: uuid(), name:item.name, trackType:item.trackType, tags:item.tags.slice(), notes:'', status:'active', createdAt:now, updatedAt:now };
    _env.data.exercises.push(record);
    persistAndSync('pt_exercises', 'exercises', record);
    existingNames.add(item.name.toLowerCase());
    added++;
  });
  renderExerciseList();
  const skipped = EXERCISE_STARTER_LIBRARY.length - added;
  toast(added ? `Added ${added} exercise${added===1?'':'s'}${skipped?' · '+skipped+' already existed':''} ✓` : 'All starter exercises already in your library');
}

// ---- Toast ---------------------------------------------------------------
let _toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

// ---- Boot ------------------------------------------------------------------
renderSyncStatus();
initAuth();
</script>
</body>
</html>
