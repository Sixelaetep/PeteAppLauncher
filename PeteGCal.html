<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f7f9" id="metaThemeColor">
<script>
// Apply any explicit global theme preference before first paint — same
// pre-paint pattern every other app in the suite uses.
(function(){try{if(localStorage.getItem('pal_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
</script>
<!-- v1.3: root-cause fix — the Google Identity Services script tag was
     never actually in this file (present only as a documentation
     comment inside pal-gcal.js). Added between pal-shared.js and
     pal-gcal.js. Full version history in PeteGCal.md, not duplicated
     here. -->
<title>PeteGCal v1.3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0f0f1a; --ink2:#3a3a4a; --ink3:#7a7a8c; --ink4:#b0b0be;
  --surf:#f7f7f9; --card:#fff; --bdr:#e8e8ee;
  --acc:#4f46e5; --acc-dim:#eef2ff; --acc-dk:#4338ca;
  --ok:#0a7c5c; --ok-dim:#e6f4f0;
  --danger:#d32f2f; --danger-dim:#fdecea;
  --sh:0 4px 12px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);
  --r:10px; --rsm:6px; --rlg:16px; --tr:.18s ease;
  --hdr-bg:#fff; --hdr-shadow:rgba(0,0,0,.06);
  --f:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --ink:#e8e8f0; --ink2:#b8b8c8; --ink3:#8a8a9c; --ink4:#52525e;
  --surf:#14141c; --card:#1e1e2a; --bdr:#2e2e3c;
  --hdr-bg:#1e1e2a; --hdr-shadow:rgba(255,255,255,.06);
  --acc:#818cf8; --acc-dim:rgba(129,140,248,.18); --acc-dk:#a5b4fc;
  --ok:#34d399; --ok-dim:rgba(52,211,153,.15);
  --danger:#f87171; --danger-dim:rgba(248,113,113,.15);
}
body{font-family:var(--f);background:var(--surf);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
header{background:var(--hdr-bg);border-bottom:1px solid var(--bdr);box-shadow:0 1px 3px var(--hdr-shadow);
  padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
header .icon{font-size:22px;}
header .title{font-weight:700;font-size:17px;flex:1;}
header .ver{font-size:10.5px;font-weight:400;color:var(--ink3);margin-left:6px;}
header .sync-pill{font-size:11px;color:var(--ink3);background:var(--surf);border:1px solid var(--bdr);
  padding:3px 9px;border-radius:999px;display:flex;align-items:center;gap:5px;}
header .sync-pill.ok{color:var(--ok);}
header .sync-pill.err{color:var(--danger);}
header button.icon-btn{background:none;border:none;font-size:17px;cursor:pointer;color:var(--ink3);padding:4px 6px;border-radius:6px;}
header button.icon-btn:hover{background:var(--surf);}

main{max-width:620px;margin:0 auto;padding:16px;}

/* ── Sign-in gate ── */
.gate{text-align:center;padding:60px 20px;}
.gate .emoji{font-size:40px;margin-bottom:14px;}
.gate h2{font-size:17px;margin-bottom:6px;}
.gate p{color:var(--ink3);font-size:13.5px;max-width:320px;margin:0 auto 20px;}
.gate button{background:var(--acc);color:#fff;border:none;border-radius:var(--r);padding:12px 22px;
  font-size:14.5px;font-weight:600;cursor:pointer;}
.gate button:hover{background:var(--acc-dk);}

/* ── Agenda ── */
.day-group{margin-bottom:18px;}
.day-label{font-size:12.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
  padding:0 2px 8px;}
.day-label.today{color:var(--acc);}
.ev-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 14px;
  margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;}
.ev-time{font-size:12.5px;color:var(--ink3);min-width:52px;flex-shrink:0;padding-top:1px;}
.ev-time.allday{color:var(--acc);font-weight:600;}
.ev-body{flex:1;min-width:0;}
.ev-title{font-size:14.5px;font-weight:600;word-break:break-word;}
.ev-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;}
.ev-tag{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--acc-dim);color:var(--acc-dk);font-weight:600;}
.ev-tag.native{background:var(--surf);color:var(--ink3);}
.ev-loc{font-size:12px;color:var(--ink3);margin-top:3px;}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink3);}
.empty-state .emoji{font-size:32px;margin-bottom:10px;}
.loading{text-align:center;padding:60px 20px;color:var(--ink3);font-size:13.5px;}
.error-banner{background:var(--danger-dim);color:var(--danger);border-radius:var(--r);padding:12px 14px;
  font-size:13px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.error-banner button{background:var(--danger);color:#fff;border:none;border-radius:var(--rsm);padding:6px 12px;
  font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:#1a1a2e;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:400;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);text-align:center;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="icon">🗓️</div>
  <div class="title">PeteGCal <span class="ver">v1.3</span></div>
  <div class="sync-pill muted" id="syncPill">Not connected</div>
  <button class="icon-btn" id="refreshBtn" title="Refresh" style="display:none;">⟳</button>
</header>

<main>
  <div id="gate" class="gate">
    <div class="emoji">🗓️</div>
    <h2>Connect your Google Calendar</h2>
    <p>PeteGCal reads and will manage events directly on your shared Google Calendar. Sign in to see what's on it.</p>
    <button id="signinBtn">Sign in with Google</button>
  </div>

  <div id="agendaRoot" style="display:none;"></div>
</main>

<div id="toast" class="toast"></div>

<script src="pal-shared.js?v=1.0"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="pal-gcal.js?v=1"></script>
<script>
// ── Config ──────────────────────────────────────────────────────────────
const CLIENT_ID = '417857203939-6novvttk4q4bp72e2nk6j21d4f5jbsoi.apps.googleusercontent.com';
// Hardcoded to Pete's actual account, not 'primary' — 'primary' resolves
// to whichever account is signed in, which is wrong for Lex (it would
// silently show her own calendar). This is the one shared data store,
// per the design decision to use Pete's own primary calendar rather than
// a separate secondary one.
const CALENDAR_ID = 'peteshellard@gmail.com';
const WINDOW_PAST_DAYS = 14;
const WINDOW_FUTURE_DAYS = 180;

let _silentAttempted = false;
let _lastSyncedAt = null;

// ── Theme (same pattern as every other app in the suite) ────────────────
function applyTheme(theme){
  applyThemeCore(theme === 'dark', { dark: '#14141c', light: '#f7f7f9' });
}
window.addEventListener('message', function(e){
  if (e.origin !== window.location.origin) return;
  if (e.data && e.data.type === 'PAL_THEME' && e.data.theme) applyTheme(e.data.theme);
});

// ── Auth UI wiring ────────────────────────────────────────────────────
function setSyncPill(text, mode){
  const el = document.getElementById('syncPill');
  el.textContent = text;
  el.className = 'sync-pill' + (mode ? ' ' + mode : ' muted');
}

function showGate(){
  document.getElementById('gate').style.display = 'block';
  document.getElementById('agendaRoot').style.display = 'none';
  document.getElementById('refreshBtn').style.display = 'none';
}
function showAgenda(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('agendaRoot').style.display = 'block';
  document.getElementById('refreshBtn').style.display = 'inline-block';
}

window.onload = function(){
  PalGCal.init({
    clientId: CLIENT_ID,
    onAuthChange: function(signedIn){
      if (signedIn){
        setSyncPill('Connected', 'ok');
        showAgenda();
        loadEvents();
      } else {
        if (_silentAttempted) setSyncPill('Not connected', 'muted');
        showGate();
      }
    },
    onTokenRefreshed: function(){
      // Silent refresh succeeded in the background — nothing for the
      // user to do, just reflect it quietly.
      setSyncPill('Connected', 'ok');
    },
    onAuthError: function(reason){
      // The very first call on page load is a silent sign-in attempt —
      // failing just means "not signed in yet", not a real error, so it
      // stays quiet and the gate does the talking. Anything after that
      // (e.g. a refresh failing mid-session) is worth a toast.
      console.error('[PeteGCal] Google auth error:', reason);
      if (_silentAttempted) {
        toast(authErrorText(reason), 'error');
        setSyncPill('Reconnect needed', 'err');
        showGate();
      } else {
        console.info('[PeteGCal] (silent sign-in attempt on load failed — this is expected if not already signed in)');
      }
      _silentAttempted = true;
    },
    onInitFailed: function(msg){
      // Distinct from onAuthError: the Google script never loaded at
      // all, so no sign-in attempt was even possible. Usually a content
      // blocker/extension, or a stale cached copy of this page.
      console.error('[PeteGCal] Init failed:', msg);
      toast('Google sign-in script failed to load — see console for details', 'error');
      setSyncPill('Google script blocked', 'err');
      showGate();
    }
  });

  document.getElementById('signinBtn').addEventListener('click', function(){
    PalGCal.signIn();
  });
  document.getElementById('refreshBtn').addEventListener('click', function(){
    loadEvents();
  });

  // Attempt a silent sign-in once the module's ready, so returning to
  // the app doesn't require clicking "Sign in" every single time.
  setTimeout(function(){
    PalGCal.requestTokenRefresh();
    _silentAttempted = true;
  }, 400);
};

// ── Loading & rendering ───────────────────────────────────────────────
async function loadEvents(){
  const root = document.getElementById('agendaRoot');
  root.innerHTML = '<div class="loading">Loading your calendar…</div>';

  const now = new Date();
  const timeMin = new Date(now.getTime() - WINDOW_PAST_DAYS * 86400000);
  const timeMax = new Date(now.getTime() + WINDOW_FUTURE_DAYS * 86400000);

  try {
    const events = await PalGCal.listEvents(CALENDAR_ID, timeMin.toISOString(), timeMax.toISOString());
    _lastSyncedAt = new Date();
    renderAgenda(events);
  } catch (e) {
    root.innerHTML =
      '<div class="error-banner"><span>' + esc(PalGCal.errorHint(e)) + '</span>' +
      '<button onclick="loadEvents()">Retry</button></div>';
    if (e.code === 'unauthorized') { setSyncPill('Reconnect needed', 'err'); showGate(); }
  }
}

function renderAgenda(events){
  const root = document.getElementById('agendaRoot');
  root.innerHTML = '';

  if (!events.length){
    root.innerHTML = '<div class="empty-state"><div class="emoji">🌤️</div>Nothing on the calendar in this window.</div>';
    return;
  }

  // Group by calendar day (local time), in the order Google already
  // returned them (orderBy=startTime in pal-gcal.js's listEvents).
  const groups = [];
  const groupByKey = {};
  const todayKey = dayKey(new Date());

  events.forEach(function(ev){
    const start = ev.start.dateTime || ev.start.date;
    const d = new Date(start);
    const key = dayKey(d);
    if (!groupByKey[key]){
      groupByKey[key] = { key: key, date: d, items: [] };
      groups.push(groupByKey[key]);
    }
    groupByKey[key].items.push(ev);
  });

  groups.forEach(function(group){
    const section = document.createElement('div');
    section.className = 'day-group';

    const label = document.createElement('div');
    label.className = 'day-label' + (group.key === todayKey ? ' today' : '');
    label.textContent = formatDayLabel(group.date, group.key === todayKey);
    section.appendChild(label);

    group.items.forEach(function(ev){
      section.appendChild(renderEventCard(ev));
    });

    root.appendChild(section);
  });
}

function renderEventCard(ev){
  const meta = PalGCal.readAppMeta(ev);
  const isApp = Object.keys(meta).length > 0;
  const isAllDay = !ev.start.dateTime;

  const card = document.createElement('div');
  card.className = 'ev-card';

  const time = document.createElement('div');
  time.className = 'ev-time' + (isAllDay ? ' allday' : '');
  time.textContent = isAllDay ? 'All day' : formatTime(ev.start.dateTime);
  card.appendChild(time);

  const body = document.createElement('div');
  body.className = 'ev-body';

  const title = document.createElement('div');
  title.className = 'ev-title';
  title.textContent = ev.summary || '(no title)';
  body.appendChild(title);

  const metaRow = document.createElement('div');
  metaRow.className = 'ev-meta';
  const tag = document.createElement('span');
  tag.className = 'ev-tag' + (isApp ? '' : ' native');
  tag.textContent = isApp ? (meta.type || 'Other') : 'Calendar';
  metaRow.appendChild(tag);
  body.appendChild(metaRow);

  if (ev.location){
    const loc = document.createElement('div');
    loc.className = 'ev-loc';
    loc.textContent = '📍 ' + ev.location;
    body.appendChild(loc);
  }

  card.appendChild(body);
  return card;
}

function authErrorText(reason){
  if (reason === 'not-initialised') return 'Google sign-in isn\'t ready yet — wait a moment and try again, or refresh the page.';
  return 'Google sign-in issue: ' + reason;
}

function dayKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatDayLabel(d, isToday){
  if (isToday) return 'Today · ' + d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  if (dayKey(d) === dayKey(tomorrow)) return 'Tomorrow · ' + d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
}
function formatTime(dateTimeStr){
  return new Date(dateTimeStr).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}
</script>
</body>
</html>
