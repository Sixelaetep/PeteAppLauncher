<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f7f9" id="metaThemeColor">
<script>
// Apply any explicit global theme preference before first paint — same
// pre-paint pattern every other app in the suite uses.
(function(){try{if(localStorage.getItem('pal_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
</script>
<!-- v1.9: expanded from 6 to 12 event types — music/play/musical/comedy/
     sport/festival/cinema kept as their own distinct types (matching
     GigsAndTrips' GIG_TYPES) rather than collapsed into one generic
     "Gig/Event". Full version history in PeteGCal.md. -->
<title>PeteGCal v1.9</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0f0f1a; --ink2:#3a3a4a; --ink3:#7a7a8c; --ink4:#b0b0be;
  --surf:#f7f7f9; --card:#fff; --bdr:#e8e8ee;
  --acc:#4f46e5; --acc-dim:#eef2ff; --acc-dk:#4338ca;
  --ok:#0a7c5c; --ok-dim:#e6f4f0;
  --danger:#d32f2f; --danger-dim:#fdecea;
  --warn:#92400e; --warn-dim:#fffbeb;
  --sh0:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh:0 4px 12px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);
  --r:10px; --rsm:6px; --rlg:16px; --tr:.18s ease;
  --hdr-bg:#fff; --hdr-shadow:rgba(0,0,0,.06);
  --f:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --ink:#e8e8f0; --ink2:#b8b8c8; --ink3:#8a8a9c; --ink4:#52525e;
  --surf:#14141c; --card:#1e1e2a; --bdr:#2e2e3c;
  --hdr-bg:#1e1e2a; --hdr-shadow:rgba(255,255,255,.06);
  --acc:#818cf8; --acc-dim:rgba(129,140,248,.18); --acc-dk:#a5b4fc;
  --ok:#34d399; --ok-dim:rgba(52,211,153,.15);
  --danger:#f87171; --danger-dim:rgba(248,113,113,.15);
  --warn:#fbbf24; --warn-dim:rgba(251,191,36,.15);
}
body{font-family:var(--f);background:var(--surf);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
header{background:var(--hdr-bg);border-bottom:1px solid var(--bdr);box-shadow:0 1px 3px var(--hdr-shadow);
  padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
header .icon{font-size:22px;}
header .title{font-weight:700;font-size:17px;flex:1;}
header .ver{font-size:10.5px;font-weight:400;color:var(--ink3);margin-left:6px;}
header .sync-pill{font-size:11px;color:var(--ink3);background:var(--surf);border:1px solid var(--bdr);
  padding:3px 9px;border-radius:999px;display:flex;align-items:center;gap:5px;}
header .sync-pill.ok{color:var(--ok);}
header .sync-pill.err{color:var(--danger);}
header button.icon-btn{background:none;border:none;font-size:17px;cursor:pointer;color:var(--ink3);padding:4px 6px;border-radius:6px;}
header button.icon-btn:hover{background:var(--surf);}
header button.today-btn{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;
  border:1px solid var(--bdr);background:var(--surf);color:var(--ink2);cursor:pointer;}
header button.today-btn:hover{border-color:var(--acc);color:var(--acc);}

main{max-width:620px;margin:0 auto;padding:16px;}

/* ── Sign-in gate ── */
.gate{text-align:center;padding:60px 20px;}
.gate .emoji{font-size:40px;margin-bottom:14px;}
.gate h2{font-size:17px;margin-bottom:6px;}
.gate p{color:var(--ink3);font-size:13.5px;max-width:320px;margin:0 auto 20px;}
.gate button{background:var(--acc);color:#fff;border:none;border-radius:var(--r);padding:12px 22px;
  font-size:14.5px;font-weight:600;cursor:pointer;}
.gate button:hover{background:var(--acc-dk);}

/* ── Agenda ── */
.day-group{margin-bottom:18px;scroll-margin-top:72px;}
.day-label{font-size:12.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;
  padding:0 2px 8px;}
.day-label.today{color:var(--acc);}
/* ── Event cards — ported directly from GigsAndTrips.html's own
   .event-card/.card-*/.type-pill/.cal-badge classes (same names, same
   values) rather than a PeteGCal-specific look-alike, so the two apps
   stay visually and structurally consistent as the suite grows. One
   deliberate structural difference: GigsAndTrips groups by year/month
   only, so each card needs its own date block; PeteGCal already groups
   by individual day (the day-group headers above), so a per-card date
   block would duplicate what the header already says — kept the
   day/time info as a compact line instead, same role, right-sized for
   an already-day-grouped list. */
.event-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh0);margin-bottom:10px;
  border:1px solid var(--bdr);overflow:hidden;cursor:pointer;transition:box-shadow var(--tr),transform var(--tr);
  -webkit-tap-highlight-color:transparent;}
.event-card:active{transform:scale(.985);box-shadow:var(--sh);}
.event-card.past{opacity:.72;}
.card-body{padding:12px 14px;}
.card-name{font-size:15.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em;word-break:break-word;}
.card-sub{font-size:13px;color:var(--ink3);margin-top:2px;}
.card-time{font-size:11.5px;color:var(--ink3);margin-top:3px;}
.card-time.allday{color:var(--acc);font-weight:600;}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:8px;}
.type-pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.type-pill.music{background:#f3eeff;color:#7c3aed;}
.type-pill.play{background:#fff0f6;color:#be185d;}
.type-pill.musical{background:#fef3c7;color:#92400e;}
.type-pill.comedy{background:#fff7ed;color:#c2410c;}
.type-pill.sport{background:#ecfdf5;color:#065f46;}
.type-pill.festival{background:#faf5ff;color:#6d28d9;}
.type-pill.cinema{background:#eff6ff;color:#1e40af;}
.type-pill.gym{background:#f0fdf4;color:#15803d;}
.type-pill.appointment{background:#f0f9ff;color:#0369a1;}
.type-pill.pets{background:#fef9f0;color:#92400e;}
.type-pill.food{background:#fffbeb;color:#b45309;}
.type-pill.other{background:#f3f4f6;color:#6b7280;}
.cal-badge{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:20px;font-size:10px;
  font-weight:700;background:#e8f0fe;color:#1a73e8;border:1px solid #d2e3fc;}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink3);}
.empty-state .emoji{font-size:32px;margin-bottom:10px;}
.loading{text-align:center;padding:60px 20px;color:var(--ink3);font-size:13.5px;}
.error-banner{background:var(--danger-dim);color:var(--danger);border-radius:var(--r);padding:12px 14px;
  font-size:13px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.error-banner button{background:var(--danger);color:#fff;border:none;border-radius:var(--rsm);padding:6px 12px;
  font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:#1a1a2e;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:400;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);text-align:center;}
.toast.show{opacity:1;}

/* ── PGC-004: create/edit/delete ── */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:52px;height:52px;
  border-radius:50%;background:var(--acc);color:#fff;border:none;font-size:26px;cursor:pointer;
  box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;z-index:50;}
.fab:hover{background:var(--acc-dk);}

.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;
  align-items:flex-end;justify-content:center;}
.sheet-overlay.open{display:flex;}
.sheet{background:var(--card);border-radius:var(--rlg) var(--rlg) 0 0;width:100%;max-width:620px;
  max-height:88vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));}
.sheet h2{font-size:17px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink3);margin-bottom:5px;}
.field input[type=text], .field input[type=date], .field input[type=time], .field textarea{
  width:100%;padding:10px 11px;border:1px solid var(--bdr);border-radius:var(--rsm);font-size:14.5px;
  font-family:inherit;background:var(--surf);color:var(--ink);}
.field textarea{resize:vertical;min-height:60px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13.5px;}
.type-grid{display:flex;flex-wrap:wrap;gap:8px;}
.type-chip{border:1.5px solid var(--bdr);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;
  background:var(--surf);color:var(--ink2);display:flex;align-items:center;gap:6px;}
.type-chip.sel{border-color:var(--acc);background:var(--acc-dim);color:var(--acc-dk);font-weight:600;}
.sheet-actions{display:flex;gap:10px;margin-top:18px;}
.sheet-actions button{flex:1;padding:12px;border-radius:var(--r);font-size:14.5px;font-weight:600;
  border:none;cursor:pointer;}
.btn-save{background:var(--acc);color:#fff;}
.btn-save:hover{background:var(--acc-dk);}
.btn-cancel{background:var(--surf);color:var(--ink2);border:1px solid var(--bdr) !important;}
.btn-delete{background:var(--danger-dim);color:var(--danger);flex:0 0 auto;padding:12px 16px;}
.btn-delete:hover{background:var(--danger);color:#fff;}
.conflict-warning{background:var(--warn-dim);color:var(--warn);border-radius:var(--rsm);padding:10px 12px;
  font-size:13px;line-height:1.5;}
.workday-badge{display:none;font-size:12px;color:var(--acc-dk);background:var(--acc-dim);
  padding:6px 10px;border-radius:var(--rsm);margin:-6px 0 14px;}
</style>
</head>
<body>

<header>
  <div class="icon">🗓️</div>
  <div class="title">PeteGCal <span class="ver">v1.9</span></div>
  <div class="sync-pill muted" id="syncPill">Not connected</div>
  <button class="today-btn" id="todayBtn" title="Jump to today" style="display:none;">Today</button>
  <button class="icon-btn" id="refreshBtn" title="Refresh" style="display:none;">⟳</button>
</header>

<main>
  <div id="gate" class="gate">
    <div class="emoji">🗓️</div>
    <h2>Connect your Google Calendar</h2>
    <p>PeteGCal reads and will manage events directly on your shared Google Calendar. Sign in to see what's on it.</p>
    <button id="signinBtn">Sign in with Google</button>
  </div>

  <div id="agendaRoot" style="display:none;"></div>
</main>

<!-- PGC-005 follow-up: hidden Fortnight Tracker instance, relayed a
     session the same way fortnight-tracker.html relays to its own
     embedded Claims tab (FT-062) — so its real Supabase data gets
     pulled into localStorage even if Pete hasn't opened that app
     directly on this device recently. Only works when PeteGCal itself
     is embedded in the launcher (see script below for why). -->
<iframe id="ftSyncFrame" src="fortnight-tracker.html" style="display:none;width:0;height:0;border:0;" title="Fortnight Tracker (background sync)"></iframe>

<button class="fab" id="fabAdd" title="Add event" style="display:none;">+</button>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <h2 id="sheetTitle">New event</h2>
    <div class="field">
      <label for="f-title">Title</label>
      <input type="text" id="f-title" placeholder="e.g. Gig at the Barrowlands">
    </div>
    <div class="field">
      <label>Type</label>
      <div class="type-grid" id="f-type-grid"></div>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="f-allday">
      <label for="f-allday" style="margin:0;">All day</label>
    </div>
    <div class="field">
      <label for="f-date">Date</label>
      <input type="date" id="f-date">
    </div>
    <div class="workday-badge" id="workdayBadge"></div>
    <div class="field-row" id="f-time-row">
      <div class="field">
        <label for="f-start">Start time</label>
        <input type="time" id="f-start">
      </div>
      <div class="field">
        <label for="f-end">End time</label>
        <input type="time" id="f-end">
      </div>
    </div>
    <div class="field conflict-warning" id="conflictWarning" style="display:none;"></div>
    <div class="field">
      <label for="f-location">Location</label>
      <input type="text" id="f-location" placeholder="e.g. The Barrowlands, Glasgow">
    </div>
    <div class="field">
      <label for="f-notes">Notes</label>
      <textarea id="f-notes" placeholder="Optional"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn-delete" id="f-delete" style="display:none;">Delete</button>
      <button class="btn-cancel" id="f-cancel">Cancel</button>
      <button class="btn-save" id="f-save">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="pal-shared.js?v=1.0"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="pal-gcal.js?v=1"></script>
<script>
// ── Config ──────────────────────────────────────────────────────────────
const CLIENT_ID = '417857203939-6novvttk4q4bp72e2nk6j21d4f5jbsoi.apps.googleusercontent.com';
// Hardcoded to Pete's actual account, not 'primary' — 'primary' resolves
// to whichever account is signed in, which is wrong for Lex (it would
// silently show her own calendar). This is the one shared data store,
// per the design decision to use Pete's own primary calendar rather than
// a separate secondary one.
const CALENDAR_ID = 'peteshellard@gmail.com';
const WINDOW_PAST_DAYS = 14;
const WINDOW_FUTURE_DAYS = 180;

let _silentAttempted = false;
let _lastSyncedAt = null;

// ── PGC-004: event types ─────────────────────────────────────────────
// Deliberately small — the full GigsAndTrips app has 16 types plus a
// separate trip-item type system; this is the cut-down "minimum" set
// agreed for PeteGCal's first create/edit pass. colorId maps each type
// to one of Google Calendar's native event colours, so the distinction
// shows up in the real Google Calendar app too, not just inside
// PeteGCal — not asked for explicitly, but close to free given Google
// already supports it natively.
// Expanded from the original 6 at Pete's request, before real-world
// deploy: music/play/musical/comedy/sport/festival/cinema kept as their
// own distinct types (matching GigsAndTrips' GIG_TYPES exactly — same
// keys, icons and colours) rather than collapsed into one generic
// "Gig/Event" bucket. Nothing else about the type system changed — same
// extendedProperties storage, same colorId mechanism, just more entries.
const EVENT_TYPES = [
  { key:'music',       icon:'🎸', label:'Music',       colorId:'3'  }, // Grape
  { key:'play',        icon:'🎭', label:'Play',        colorId:'4'  }, // Flamingo
  { key:'musical',     icon:'🎶', label:'Musical',     colorId:'5'  }, // Banana
  { key:'comedy',      icon:'😂', label:'Comedy',      colorId:'6'  }, // Tangerine
  { key:'sport',       icon:'⚽', label:'Sport',       colorId:'2'  }, // Sage
  { key:'festival',    icon:'🎪', label:'Festival',    colorId:'9'  }, // Blueberry
  { key:'cinema',      icon:'🎬', label:'Cinema',      colorId:'7'  }, // Peacock
  { key:'gym',         icon:'🏋️', label:'Gym',         colorId:'10' }, // Basil
  { key:'appointment', icon:'📅', label:'Appointment', colorId:'1'  }, // Lavender
  { key:'pets',        icon:'🐶', label:'Pets',        colorId:'6'  }, // Tangerine (shared)
  { key:'food',        icon:'🍽️', label:'Food',        colorId:'5'  }, // Banana (shared)
  { key:'other',       icon:'📌', label:'Other',       colorId:'8'  }  // Graphite
];
function typeInfo(key){ return EVENT_TYPES.find(function(t){ return t.key === key; }) || EVENT_TYPES[EVENT_TYPES.length-1]; }

// ── PGC-005 (part 2): working-days alert ─────────────────────────────
// Reads Fortnight Tracker's own data directly (same localStorage key and
// fallback chain the launcher's statFortnight() already uses) rather
// than duplicating the 9-day-fortnight pattern here — decided during
// scoping specifically to avoid two copies of the same shift pattern
// drifting apart. This deliberately does NOT re-derive the pattern
// forward for dates beyond whatever bundles already exist; it only
// reflects real data that's actually there, same "don't reproduce
// another app's business logic" principle the launcher's own Horizon
// card comment documents.
const FORTNIGHT_KEYS = ['fn_tracker_v5', 'fn_tracker_v4', 'fn_tracker_v3'];

function getFortnightWorkingDates(){
  let raw = null;
  for (let i = 0; i < FORTNIGHT_KEYS.length; i++){
    raw = localStorage.getItem(FORTNIGHT_KEYS[i]);
    if (raw) break;
  }
  if (!raw) return {}; // Fortnight Tracker never used on this device/browser

  let parsed;
  try { parsed = JSON.parse(raw); } catch(e){ return {}; }

  // Mirrors the launcher's own envelope handling: {data:{bundles}} or
  // legacy flat {bundles}.
  const bundles = (parsed.data && Array.isArray(parsed.data.bundles)) ? parsed.data.bundles
                 : Array.isArray(parsed.bundles) ? parsed.bundles
                 : [];

  const map = {}; // dateStr -> true (working) | false (holiday/sick — off)
  bundles.filter(function(b){ return !b._deleted; }).forEach(function(b){
    (b.days || []).forEach(function(d){
      if (!d.date) return;
      map[d.date] = !(d.status === 'holiday' || d.status === 'sick');
    });
  });
  return map;
}

// true = known working day, false = known day off, null = no data for
// that date (Fortnight Tracker not used, or the date falls outside any
// bundle that's been created yet).
function isWorkingDay(dateStr){
  const map = getFortnightWorkingDates();
  return Object.prototype.hasOwnProperty.call(map, dateStr) ? map[dateStr] : null;
}

let _eventsById = {};      // populated on every load, for the edit form to look up by id
let _editingEventId = null; // null = create mode; set = editing this event's id
let _selectedType = EVENT_TYPES[0].key;

// ── Theme (same pattern as every other app in the suite) ────────────────
function applyTheme(theme){
  applyThemeCore(theme === 'dark', { dark: '#14141c', light: '#f7f7f9' });
}
// _palSessionData: captures the raw incoming PAL_SESSION/PAL_UNLOCKED
// message verbatim, purely to relay it on to the hidden Fortnight Tracker
// frame below — same approach fortnight-tracker.html itself uses for its
// own embedded Claims tab (FT-062), and the Vault-in-Test&Issues embed
// before it. PeteGCal has no PalSync usage of its own; this exists only
// for the relay.
var _palSessionData = null;
var _ftFrameLoaded = false;
window.addEventListener('message', function(e){
  if (e.origin !== window.location.origin) return;
  if (!e.data) return;
  if (e.data.type === 'PAL_THEME' && e.data.theme) applyTheme(e.data.theme);
  if (e.data.type === 'PAL_SESSION' || e.data.type === 'PAL_UNLOCKED'){
    _palSessionData = e.data;
    relayToFortnightFrame(); // covers session arriving after the frame's already loaded
  }
});
function relayToFortnightFrame(){
  if (!_ftFrameLoaded || !_palSessionData) return;
  const frame = document.getElementById('ftSyncFrame');
  if (frame && frame.contentWindow) frame.contentWindow.postMessage(_palSessionData, window.location.origin);
}

// ── Auth UI wiring ────────────────────────────────────────────────────
function setSyncPill(text, mode){
  const el = document.getElementById('syncPill');
  el.textContent = text;
  el.className = 'sync-pill' + (mode ? ' ' + mode : ' muted');
}

function showGate(){
  document.getElementById('gate').style.display = 'block';
  document.getElementById('agendaRoot').style.display = 'none';
  document.getElementById('refreshBtn').style.display = 'none';
  document.getElementById('todayBtn').style.display = 'none';
  document.getElementById('fabAdd').style.display = 'none';
}
function showAgenda(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('agendaRoot').style.display = 'block';
  document.getElementById('refreshBtn').style.display = 'inline-block';
  document.getElementById('todayBtn').style.display = 'inline-block';
  document.getElementById('fabAdd').style.display = 'flex';
}

window.onload = function(){
  PalGCal.init({
    clientId: CLIENT_ID,
    onAuthChange: function(signedIn){
      if (signedIn){
        setSyncPill('Connected', 'ok');
        showAgenda();
        loadEvents();
      } else {
        if (_silentAttempted) setSyncPill('Not connected', 'muted');
        showGate();
      }
    },
    onTokenRefreshed: function(){
      // Silent refresh succeeded in the background — nothing for the
      // user to do, just reflect it quietly.
      setSyncPill('Connected', 'ok');
    },
    onAuthError: function(reason){
      // The very first call on page load is a silent sign-in attempt —
      // failing just means "not signed in yet", not a real error, so it
      // stays quiet and the gate does the talking. Anything after that
      // (e.g. a refresh failing mid-session) is worth a toast.
      console.error('[PeteGCal] Google auth error:', reason);
      if (_silentAttempted) {
        toast(authErrorText(reason), 'error');
        setSyncPill('Reconnect needed', 'err');
        showGate();
      } else {
        console.info('[PeteGCal] (silent sign-in attempt on load failed — this is expected if not already signed in)');
      }
      _silentAttempted = true;
    },
    onInitFailed: function(msg){
      // Distinct from onAuthError: the Google script never loaded at
      // all, so no sign-in attempt was even possible. Usually a content
      // blocker/extension, or a stale cached copy of this page.
      console.error('[PeteGCal] Init failed:', msg);
      toast('Google sign-in script failed to load — see console for details', 'error');
      setSyncPill('Google script blocked', 'err');
      showGate();
    }
  });

  document.getElementById('signinBtn').addEventListener('click', function(){
    PalGCal.signIn();
  });
  document.getElementById('refreshBtn').addEventListener('click', function(){
    loadEvents();
  });
  document.getElementById('todayBtn').addEventListener('click', function(){
    scrollToToday(true);
  });

  // PGC-004: create/edit/delete wiring.
  renderTypeGrid();
  document.getElementById('fabAdd').addEventListener('click', function(){ openCreateForm(); });
  document.getElementById('f-cancel').addEventListener('click', closeForm);
  document.getElementById('f-save').addEventListener('click', handleSave);
  document.getElementById('f-delete').addEventListener('click', handleDelete);
  document.getElementById('f-allday').addEventListener('change', updateTimeRowVisibility);
  document.getElementById('f-allday').addEventListener('change', checkConflicts);
  ['f-date','f-start','f-end'].forEach(function(id){
    document.getElementById(id).addEventListener('input', checkConflicts);
  });
  document.getElementById('f-date').addEventListener('input', updateWorkdayBadge);
  document.getElementById('sheetOverlay').addEventListener('click', function(e){
    if (e.target.id === 'sheetOverlay') closeForm(); // tap outside the sheet to dismiss
  });

  // Attempt a silent sign-in once the module's ready, so returning to
  // the app doesn't require clicking "Sign in" every single time.
  setTimeout(function(){
    PalGCal.requestTokenRefresh();
    _silentAttempted = true;
  }, 400);

  document.getElementById('ftSyncFrame').addEventListener('load', function(){
    _ftFrameLoaded = true;
    relayToFortnightFrame(); // covers the frame finishing load after the session already arrived
  });
};

// ── Loading & rendering ───────────────────────────────────────────────
async function loadEvents(){
  const root = document.getElementById('agendaRoot');
  root.innerHTML = '<div class="loading">Loading your calendar…</div>';

  const now = new Date();
  const timeMin = new Date(now.getTime() - WINDOW_PAST_DAYS * 86400000);
  const timeMax = new Date(now.getTime() + WINDOW_FUTURE_DAYS * 86400000);

  try {
    const events = await PalGCal.listEvents(CALENDAR_ID, timeMin.toISOString(), timeMax.toISOString());
    _lastSyncedAt = new Date();
    _eventsById = {};
    events.forEach(function(ev){ _eventsById[ev.id] = ev; });
    renderAgenda(events);
  } catch (e) {
    root.innerHTML =
      '<div class="error-banner"><span>' + esc(PalGCal.errorHint(e)) + '</span>' +
      '<button onclick="loadEvents()">Retry</button></div>';
    if (e.code === 'unauthorized') { setSyncPill('Reconnect needed', 'err'); showGate(); }
  }
}

function renderAgenda(events){
  const root = document.getElementById('agendaRoot');
  root.innerHTML = '';

  if (!events.length){
    root.innerHTML = '<div class="empty-state"><div class="emoji">🌤️</div>Nothing on the calendar in this window.</div>';
    return;
  }

  // Group by calendar day (local time), in the order Google already
  // returned them (orderBy=startTime in pal-gcal.js's listEvents).
  const groups = [];
  const groupByKey = {};
  const todayKey = dayKey(new Date());

  events.forEach(function(ev){
    const start = ev.start.dateTime || ev.start.date;
    const d = new Date(start);
    const key = dayKey(d);
    if (!groupByKey[key]){
      groupByKey[key] = { key: key, date: d, items: [] };
      groups.push(groupByKey[key]);
    }
    groupByKey[key].items.push(ev);
  });

  groups.forEach(function(group){
    const section = document.createElement('div');
    section.className = 'day-group';
    section.id = 'day-' + group.key;

    const label = document.createElement('div');
    label.className = 'day-label' + (group.key === todayKey ? ' today' : '');
    label.textContent = formatDayLabel(group.date, group.key === todayKey);
    section.appendChild(label);

    group.items.forEach(function(ev){
      section.appendChild(renderEventCard(ev));
    });

    root.appendChild(section);
  });

  // Default view is today, not the top of the 14-day-past window —
  // wrapped in rAF so the scroll happens after layout has settled.
  requestAnimationFrame(function(){ scrollToToday(false); });
}

function scrollToToday(smooth){
  const todayKey = 'day-' + dayKey(new Date());
  const groups = Array.from(document.querySelectorAll('.day-group'));
  if (!groups.length) return;
  // Exact match if today has events; otherwise the nearest upcoming day
  // (group ids sort lexicographically the same as chronologically,
  // since dayKey is zero-padded YYYY-MM-DD) — falls back to the last
  // group if everything in the window is somehow in the past.
  let target = groups.find(function(g){ return g.id === todayKey; })
    || groups.find(function(g){ return g.id > todayKey; })
    || groups[groups.length - 1];
  target.scrollIntoView({ behavior: smooth ? 'smooth' : 'instant', block: 'start' });
}

function renderEventCard(ev){
  const meta = PalGCal.readAppMeta(ev);
  const isApp = Object.keys(meta).length > 0;
  const isAllDay = !ev.start.dateTime;
  const evDateKey = dayKey(new Date(ev.start.dateTime || ev.start.date));
  const isPast = evDateKey < dayKey(new Date());

  const card = document.createElement('div');
  card.className = 'event-card' + (isPast ? ' past' : '');
  card.addEventListener('click', function(){ openEditForm(ev.id); });

  const body = document.createElement('div');
  body.className = 'card-body';

  const title = document.createElement('div');
  title.className = 'card-name';
  title.textContent = ev.summary || '(no title)';
  body.appendChild(title);

  if (ev.location){
    const loc = document.createElement('div');
    loc.className = 'card-sub';
    loc.textContent = '📍 ' + ev.location;
    body.appendChild(loc);
  }

  const time = document.createElement('div');
  time.className = 'card-time' + (isAllDay ? ' allday' : '');
  time.textContent = isAllDay ? 'All day' : (formatTime(ev.start.dateTime) + '–' + formatTime(ev.end.dateTime));
  body.appendChild(time);

  const metaRow = document.createElement('div');
  metaRow.className = 'card-meta';
  if (isApp){
    const t = typeInfo(meta.type);
    const pill = document.createElement('span');
    pill.className = 'type-pill ' + t.key;
    pill.textContent = t.icon + ' ' + t.label;
    metaRow.appendChild(pill);
  } else {
    const badge = document.createElement('span');
    badge.className = 'cal-badge';
    badge.textContent = '📅 Calendar';
    metaRow.appendChild(badge);
  }
  body.appendChild(metaRow);

  card.appendChild(body);
  return card;
}

// ── PGC-004: create/edit/delete form ─────────────────────────────────

function renderTypeGrid(){
  const grid = document.getElementById('f-type-grid');
  grid.innerHTML = '';
  EVENT_TYPES.forEach(function(t){
    const chip = document.createElement('div');
    chip.className = 'type-chip' + (t.key === _selectedType ? ' sel' : '');
    chip.textContent = t.icon + ' ' + t.label;
    chip.addEventListener('click', function(){
      _selectedType = t.key;
      grid.querySelectorAll('.type-chip').forEach(function(c){ c.classList.remove('sel'); });
      chip.classList.add('sel');
    });
    grid.appendChild(chip);
  });
}

function updateTimeRowVisibility(){
  document.getElementById('f-time-row').style.display =
    document.getElementById('f-allday').checked ? 'none' : 'flex';
}

function pad2(n){ return String(n).padStart(2,'0'); }
function dateToInputValue(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function timeToInputValue(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

function openCreateForm(){
  _editingEventId = null;
  document.getElementById('sheetTitle').textContent = 'New event';
  document.getElementById('f-delete').style.display = 'none';
  document.getElementById('f-title').value = '';
  document.getElementById('f-location').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('f-allday').checked = false;

  const now = new Date();
  const start = new Date(now.getTime());
  start.setMinutes(Math.ceil(start.getMinutes() / 15) * 15, 0, 0); // round up to next 15 min
  const end = new Date(start.getTime() + 60 * 60000); // +1hr default

  document.getElementById('f-date').value = dateToInputValue(start);
  document.getElementById('f-start').value = timeToInputValue(start);
  document.getElementById('f-end').value = timeToInputValue(end);
  updateTimeRowVisibility();

  _selectedType = EVENT_TYPES[0].key;
  renderTypeGrid();
  checkConflicts();
  updateWorkdayBadge();

  document.getElementById('sheetOverlay').classList.add('open');
}

function openEditForm(id){
  const ev = _eventsById[id];
  if (!ev) return;
  const meta = PalGCal.readAppMeta(ev);
  const isAllDay = !ev.start.dateTime;

  _editingEventId = id;
  document.getElementById('sheetTitle').textContent = 'Edit event';
  document.getElementById('f-delete').style.display = 'block';
  document.getElementById('f-title').value = ev.summary || '';
  document.getElementById('f-location').value = ev.location || '';
  document.getElementById('f-notes').value = ev.description || '';
  document.getElementById('f-allday').checked = isAllDay;

  const startD = new Date(ev.start.dateTime || ev.start.date);
  document.getElementById('f-date').value = dateToInputValue(startD);
  if (!isAllDay){
    document.getElementById('f-start').value = timeToInputValue(new Date(ev.start.dateTime));
    document.getElementById('f-end').value = timeToInputValue(new Date(ev.end.dateTime));
  }
  updateTimeRowVisibility();

  // Native Calendar entries (no app meta yet) default to "Other" when
  // enriched for the first time, per the design: every event is a
  // first-class app item regardless of origin, but one never typed in
  // the app has no type of its own until you give it one.
  _selectedType = meta.type || 'other';
  renderTypeGrid();
  checkConflicts();
  updateWorkdayBadge();

  document.getElementById('sheetOverlay').classList.add('open');
}

function closeForm(){
  document.getElementById('sheetOverlay').classList.remove('open');
}

// ── PGC-005 (part 1): event-overlap conflict detection ──────────────
// Checked live against everything already loaded in the current window
// (_eventsById, populated by the last loadEvents() call) — informational
// only, never blocks Save. All-day events are skipped on both sides for
// this first pass: a timed gig overlapping an all-day entry (a holiday,
// say) is a real thing worth surfacing eventually, but day-level overlap
// needs different handling than a straight time-range check and isn't
// in this cut.
function checkConflicts(){
  const warnEl = document.getElementById('conflictWarning');

  if (document.getElementById('f-allday').checked){ warnEl.style.display = 'none'; return; }

  const dateVal = document.getElementById('f-date').value;
  const startVal = document.getElementById('f-start').value;
  const endVal = document.getElementById('f-end').value;
  if (!dateVal || !startVal || !endVal){ warnEl.style.display = 'none'; return; }

  const start = new Date(dateVal + 'T' + startVal + ':00');
  const end = new Date(dateVal + 'T' + endVal + ':00');
  if (end <= start){ warnEl.style.display = 'none'; return; }

  const conflicts = Object.values(_eventsById).filter(function(ev){
    if (ev.id === _editingEventId) return false;           // don't flag against itself
    if (!ev.start.dateTime || !ev.end.dateTime) return false; // all-day, skipped for now
    const evStart = new Date(ev.start.dateTime);
    const evEnd = new Date(ev.end.dateTime);
    return start < evEnd && end > evStart; // standard interval-overlap test
  });

  if (!conflicts.length){ warnEl.style.display = 'none'; return; }

  warnEl.style.display = 'block';
  warnEl.innerHTML = '⚠️ Clashes with ' + conflicts.map(function(ev){
    return '<strong>' + esc(ev.summary || '(no title)') + '</strong> (' +
      formatTime(ev.start.dateTime) + '–' + formatTime(ev.end.dateTime) + ')';
  }).join(', ');
}

function updateWorkdayBadge(){
  const badge = document.getElementById('workdayBadge');
  const dateVal = document.getElementById('f-date').value;
  if (!dateVal){ badge.style.display = 'none'; return; }

  const working = isWorkingDay(dateVal);
  if (working === true){
    badge.style.display = 'block';
    badge.textContent = '💼 This is a working day, per Fortnight Tracker';
  } else {
    // false (known day off) and null (no data for this date) both stay
    // quiet — the badge is only worth showing for the alert-worthy case.
    badge.style.display = 'none';
  }
}

function buildStartEnd(){
  const dateVal = document.getElementById('f-date').value;
  if (!dateVal) return null;

  if (document.getElementById('f-allday').checked){
    const start = new Date(dateVal + 'T00:00:00');
    const end = new Date(start.getTime() + 86400000); // Google's end.date is exclusive
    return {
      start: { date: dateVal },
      end:   { date: dateToInputValue(end) }
    };
  }

  const startVal = document.getElementById('f-start').value;
  const endVal = document.getElementById('f-end').value;
  if (!startVal || !endVal) return null;

  const start = new Date(dateVal + 'T' + startVal + ':00');
  const end = new Date(dateVal + 'T' + endVal + ':00');
  if (end <= start) return 'end-before-start';

  return {
    start: { dateTime: start.toISOString() },
    end:   { dateTime: end.toISOString() }
  };
}

async function handleSave(){
  const title = document.getElementById('f-title').value.trim();
  if (!title){ toast('Give it a title first', 'error'); return; }

  const times = buildStartEnd();
  if (times === 'end-before-start'){ toast('End time must be after the start time', 'error'); return; }
  if (!times){ toast('Pick a date', 'error'); return; }

  const typeMeta = typeInfo(_selectedType);
  const eventBody = Object.assign({
    summary: title,
    location: document.getElementById('f-location').value.trim(),
    description: document.getElementById('f-notes').value.trim(),
    colorId: typeMeta.colorId
  }, times);

  const saveBtn = document.getElementById('f-save');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  try {
    if (_editingEventId){
      await PalGCal.updateEvent(CALENDAR_ID, _editingEventId, eventBody, { type: _selectedType });
      toast('Event updated');
    } else {
      await PalGCal.createEvent(CALENDAR_ID, eventBody, { type: _selectedType });
      toast('Event created');
    }
    closeForm();
    loadEvents();
  } catch (e) {
    toast(PalGCal.errorHint(e), 'error');
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';
  }
}

async function handleDelete(){
  if (!_editingEventId) return;
  // Always a real delete against Google Calendar, regardless of whether
  // this event originated in the app or was created natively — the
  // house rule decided during scoping. Confirmed here since it's now
  // unambiguously destructive against the real calendar.
  const ev = _eventsById[_editingEventId];
  const name = ev ? (ev.summary || '(no title)') : 'this event';
  if (!confirm('Delete "' + name + '"? This removes it from Google Calendar for everyone, not just PeteGCal.')) return;

  const delBtn = document.getElementById('f-delete');
  delBtn.disabled = true;
  try {
    await PalGCal.deleteEvent(CALENDAR_ID, _editingEventId);
    toast('Event deleted');
    closeForm();
    loadEvents();
  } catch (e) {
    toast(PalGCal.errorHint(e), 'error');
  } finally {
    delBtn.disabled = false;
  }
}

function authErrorText(reason){
  if (reason === 'not-initialised') return 'Google sign-in isn\'t ready yet — wait a moment and try again, or refresh the page.';
  return 'Google sign-in issue: ' + reason;
}

function dayKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatDayLabel(d, isToday){
  if (isToday) return 'Today · ' + d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  if (dayKey(d) === dayKey(tomorrow)) return 'Tomorrow · ' + d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
}
function formatTime(dateTimeStr){
  return new Date(dateTimeStr).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}
