<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
// Apply any explicit global theme preference before first paint (own cache key; the launcher's PAL_THEME message keeps it current).
(function(){try{if(localStorage.getItem('mus_theme_pref')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();

<title>Music Tracker v1.00</title>
<link rel="stylesheet" href="fonts/pal-fonts.css?v=1.0.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230E0D12'/><text x='16' y='23' font-family='system-ui,sans-serif' font-size='20' text-anchor='middle'>🎵</text></svg>">
<style>
  :root {
    --bg:#0E0D12; --surface:#17161D; --surface2:#211F29; --border:#34313F; --sep:#2A2833;
    --mus:#E58BFA; --acc:#E58BFA; --accTx:#1A0A20;
    --green:#5EE0A0; --red:#FF6A5E; --orange:#FCD34D;
    --ink:#F5F2EA; --ink2:#C9C5D2; --ink3:#A29EB0;
    --hover:rgba(255,255,255,0.05); --radius:16px;
    --chrome-h:56px;
    --f:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --fd:'Bricolage Grotesque','DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  :root[data-theme="light"] {
    --bg:#F4F0E6; --surface:#FFFFFF; --surface2:#ECE7DA; --border:#DDD6C6; --sep:#E7E1D2;
    --mus:#8A2BA8; --acc:#8A2BA8; --accTx:#FFFFFF;
    --green:#1F7A4D; --red:#C2271D; --orange:#8A5A0A;
    --ink:#17151C; --ink2:#3B3846; --ink3:#5E5A6B; --hover:rgba(0,0,0,0.05);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--f); padding-bottom:40px; }
  button { font-family:inherit; }
  :focus-visible { outline:2px solid var(--mus); outline-offset:2px; }

  .chrome { position:sticky; top:0; z-index:50; height:var(--chrome-h); background:var(--bg); padding:0 16px; display:flex; align-items:center; gap:10px; }
  .chrome h1 { font:700 18px var(--fd); margin:0; flex:1; display:flex; align-items:baseline; gap:8px; }
  .chrome h1 .v { font:400 11px var(--f); color:var(--ink3); }
  .sync-chip { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; min-height:32px; border-radius:14px; font-size:11px; font-weight:700; background:var(--surface2); border:1px solid var(--border); color:var(--ink2); cursor:pointer; }
  .sync-chip.state-syncing { color:var(--mus); border-color:var(--mus); }
  .sync-chip.state-synced { color:var(--green); border-color:var(--green); }
  .sync-chip.state-error { color:var(--red); border-color:var(--red); }
  .sync-chip-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .sync-chip.state-syncing .sync-chip-dot { animation:pulse .8s infinite alternate; }
  @keyframes pulse { from{opacity:.4} to{opacity:1} }

  .wrap { max-width:900px; margin:0 auto; padding:0 14px; }
  .seg { display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:3px; margin:4px 0 12px; }
  .seg button { flex:1 1 auto; border:0; background:none; color:var(--ink2); font-size:14px; font-weight:600; min-height:40px; padding:6px 8px; border-radius:9px; cursor:pointer; white-space:nowrap; }
  .seg button[aria-selected="true"] { background:var(--surface2); color:var(--mus); box-shadow:0 0 0 1px var(--border); }
  .seg .n { font-weight:500; font-size:11px; color:var(--ink3); margin-left:5px; }
  .panel { display:none; } .panel.on { display:block; }

  .chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:0 0 12px; }
  .chip { border:1px solid var(--border); background:var(--surface); color:var(--ink2); border-radius:999px; min-height:36px; padding:0 13px; font-size:13px; font-weight:600; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--mus); border-color:var(--mus); color:var(--accTx); }
  .chip.ghost { margin-left:auto; }
  .note { color:var(--ink3); font-size:12.5px; line-height:1.5; }
  .empty { text-align:center; padding:36px 12px; color:var(--ink2); }
  .empty .big { font-size:34px; margin-bottom:8px; }
  .btn { min-height:44px; border-radius:11px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:14px; font-weight:700; padding:0 16px; cursor:pointer; }
  .btn.pri { background:var(--mus); border-color:var(--mus); color:var(--accTx); }
  .btn.danger { color:var(--red); }
  .btn.sm { min-height:36px; padding:0 12px; font-size:13px; }
  .btn[disabled] { opacity:.5; cursor:default; }
  input[type=text], input[type=search], textarea { width:100%; background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:11px; padding:0 14px; min-height:44px; font:500 16px var(--f); }
  textarea { padding:10px 14px; min-height:120px; resize:vertical; line-height:1.4; }
  input:focus, textarea:focus { border-color:var(--mus); outline:none; }

  /* releases */
  .rel { display:flex; gap:12px; align-items:center; padding:10px; border-radius:14px; background:var(--surface); border:1px solid var(--sep); margin-bottom:8px; }
  .rel.hl { border-color:var(--mus); box-shadow:0 0 0 2px color-mix(in srgb, var(--mus) 35%, transparent); }
  .art { width:64px; height:64px; flex:none; border-radius:10px; background:var(--surface2); display:grid; place-items:center; color:var(--ink3); font-size:24px; overflow:hidden; position:relative; }
  .art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .rb { flex:1; min-width:0; }
  .rt { font-weight:700; font-size:15px; overflow-wrap:anywhere; }
  .rs { color:var(--ink2); font-size:13px; margin-top:1px; overflow-wrap:anywhere; }
  .rm { display:flex; gap:8px; align-items:center; margin-top:5px; font-size:12px; color:var(--ink3); flex-wrap:wrap; }
  .badge { border-radius:6px; padding:1px 7px; font-size:11px; font-weight:700; background:var(--surface2); color:var(--ink2); }
  .badge.new { background:var(--mus); color:var(--accTx); }
  .badge.warn { background:color-mix(in srgb, var(--orange) 25%, transparent); color:var(--orange); }
  .ra { display:flex; flex-direction:column; gap:6px; }
  .ra .btn { min-height:38px; padding:0 12px; font-size:13px; }

  /* artists */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:12px; }
  .tile { background:none; border:0; padding:0; text-align:left; color:inherit; cursor:pointer; min-width:0; }
  .tile .art { width:100%; height:auto; aspect-ratio:1; border-radius:14px; font-size:34px; font-weight:700; position:relative; }
  .tile .nm { font-weight:600; font-size:13px; margin-top:6px; overflow-wrap:anywhere; line-height:1.25; }
  .tile .sub { font-size:11.5px; color:var(--ink3); margin-top:1px; }
  .tile .flag { z-index:1; position:absolute; left:6px; top:6px; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--orange); color:#1A1400; }
  .tile.off .art { opacity:.5; }

  /* add */
  .row { display:flex; gap:8px; margin-bottom:10px; }
  .row input { flex:1; min-width:0; }
  .res { display:flex; gap:12px; align-items:center; padding:10px 12px; border:1px solid var(--sep); background:var(--surface); border-radius:12px; margin-bottom:8px; }
  .res .rb { flex:1; }
  .h2 { font:700 12px var(--f); letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); margin:20px 0 8px; }
  .prog { height:6px; border-radius:6px; background:var(--surface2); overflow:hidden; margin:8px 0; }
  .prog > i { display:block; height:100%; background:var(--mus); width:0; transition:width .2s; }

  /* sheet */
  .sheet-bg { position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.55); display:none; align-items:flex-end; justify-content:center; }
  .sheet-bg.on { display:flex; }
  .sheet { width:100%; max-width:560px; max-height:92vh; overflow:auto; background:var(--bg); border:1px solid var(--border); border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px)); }
  @media (min-width:640px) { .sheet-bg { align-items:center; } .sheet { border-radius:18px; } }
  .sh-head { display:flex; gap:14px; align-items:center; margin-bottom:14px; }
  .sh-head .art { width:84px; height:84px; border-radius:14px; font-size:36px; }
  .sh-head h2 { margin:0; font:700 20px var(--fd); overflow-wrap:anywhere; }
  .sh-x { margin-left:auto; align-self:flex-start; min-width:44px; min-height:44px; border-radius:11px; border:1px solid var(--border); background:none; color:var(--ink); font-size:16px; cursor:pointer; }
  .sw { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--sep); }
  .sw small { display:block; color:var(--ink3); font-size:12px; margin-top:2px; font-weight:400; }
  .sw input { width:46px; height:28px; accent-color:var(--mus); flex:none; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .acts .btn { flex:1 1 140px; }

  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--surface2); color:var(--ink); border:1px solid var(--border); padding:10px 16px; border-radius:12px; font-size:14px; z-index:400; display:none; max-width:90vw; }
  #toast.show { display:block; } #toast.err { border-color:var(--red); }
  .data-box { background:var(--surface2); border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.6; margin-bottom:8px; }
  .pal-ds-label { font:700 12px var(--f); letter-spacing:.06em; text-transform:uppercase; margin:18px 0 6px; opacity:.7; }
  #no-pal-banner { display:none; margin:0 0 12px; padding:10px 12px; border-radius:11px; background:color-mix(in srgb, var(--orange) 18%, transparent); color:var(--ink); font-size:13px; }
  @media (prefers-reduced-motion: reduce) { .prog > i, .sync-chip-dot { transition:none; animation:none !important; } }
</style>
</head>

<div class="chrome">
  <h1>🎵 Music <span class="v">v1.00</span></h1>
  <button class="sync-chip state-connecting" id="sync-chip" type="button" onclick="openDataModal()" title="Sync status / Backup &amp; settings"><span class="sync-chip-dot"></span><span id="sync-lbl">Connecting…</span></button>

  </section>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" tabindex="-1"></div></div>

  <div class="pal-ds-label">Launcher alerts</div>

<script id="musCore">
// ══════════════════════════════════════════════════════════════════
// MusicCore: pure logic (no DOM, no network, no storage), unit-tested in Node. The attention rules mirror the
// scheduled server function (pal-music-proxy core.ts / providers.ts) exactly, so the launcher shows the same list
// whether the app or the server built the contract last: same ids, same 45-day window, same 21-day life, same order, same cap.
// ══════════════════════════════════════════════════════════════════
window.MusicCore = (function () {
  var WINDOW_DAYS = 45, LIFE_DAYS = 21, CAP = 10;
  function norm(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ''); }
  function slug(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'artist'; }
  // Confidence from name evidence only. high = the top result is the only exact name match; medium = an exact match exists but not alone / not first;
  // low = no exact name match; none = nothing found. high and medium are linked automatically (medium is flagged "check"); low and none are not.
  function classify(query, results) {
    if (!results || !results.length) return { level: 'none', pick: null };
    var q = norm(query), exact = [];
    for (var i = 0; i < results.length; i++) if (norm(results[i].artistName) === q) exact.push(results[i]);
    if (!exact.length) return { level: 'low', pick: results[0] };
    if (exact.length === 1 && exact[0] === results[0]) return { level: 'high', pick: exact[0] };
    return { level: 'medium', pick: exact[0] };
  }
  function kindOf(name, trackCount) {
    var n = String(name || '');
    if (/- single$/i.test(n)) return 'single';
    if (/- ep$/i.test(n)) return 'ep';
    return trackCount === 1 ? 'single' : 'album';
  }
  function artSize(url, n) {
    if (typeof url !== 'string' || !/^https:\/\//.test(url)) return '';
    return url.replace(/\/\d+x\d+(bb)?\.(jpg|png|webp)$/i, '/' + n + 'x' + n + 'bb.jpg');
  }
  // One Apple lookup result -> a release record (null when it is not a usable album/single).
  function parseRelease(r, aid) {
    if (!r || r.wrapperType !== 'collection' || !r.collectionId || !r.releaseDate || !r.collectionName) return null;
    return { id: String(r.collectionId), aid: String(aid), name: String(r.collectionName), artistName: String(r.artistName || ''), date: String(r.releaseDate).slice(0, 10),
             kind: kindOf(r.collectionName, r.trackCount), art: typeof r.artworkUrl100 === 'string' ? r.artworkUrl100 : '', url: typeof r.collectionViewUrl === 'string' ? r.collectionViewUrl : '', tracks: r.trackCount || 0 };
  }
  function addDays(iso, n) { return new Date(Date.parse(iso + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10); }
  function isFollowed(a) { return !!a && !a._deleted && a.following === true && !a.excluded; }
  function defaultSettings() { return { attention: { albums: true, singles: false }, updatedAt: '' }; }
  function dealtSet(attn) { var s = {}; (attn || []).forEach(function (x) { if (x && x.id && x.dealt && !x._deleted) s[x.id] = true; }); return s; }
  // Releases that may reach Needs attention. Returns { items, overflow, eligible }.
  function attention(releases, artists, settings, attn, today) {
    var followed = {}; (artists || []).forEach(function (a) { if (isFollowed(a) && /^\d{1,12}$/.test(String(a.appleArtistId || ''))) followed[String(a.appleArtistId)] = true; });
    var set = (settings && settings.attention) || {}, dealt = dealtSet(attn), cutoff = addDays(today, -WINDOW_DAYS), cands = [], seen = {};
    (releases || []).forEach(function (r) {
      if (!r || !followed[r.aid] || r.date < cutoff || r.date > today) return;
      var single = r.kind === 'single', id = 'rel_' + r.id;
      if (seen[id]) return; seen[id] = true;
      if (single ? set.singles !== true : set.albums === false) return;     // defaults: albums on, singles off (same as the server)
      var until = addDays(r.date, LIFE_DAYS);
      if (until < today || dealt[id]) return;
      cands.push({ id: id, kind: single ? 'single' : 'album', title: r.artistName + ': ' + r.name, sub: single ? 'New single' : 'New album', date: r.date, until: until, open: { view: 'releases', id: id } });
    });
    var pr = { album: 2, single: 3 };
    cands.sort(function (a, b) { return pr[a.kind] - pr[b.kind] || a.date.localeCompare(b.date) || a.id.localeCompare(b.id); });
    var items = cands.slice(0, CAP).map(function (c) {
      return { id: c.id, level: (c.kind === 'album' && c.date <= today) ? 'soon' : 'info', title: c.title, sub: c.sub, due: c.date, until: c.until, open: c.open };
    });
    return { items: items, overflow: Math.max(0, cands.length - items.length), eligible: cands.length };
  }
  return { norm: norm, slug: slug, classify: classify, kindOf: kindOf, artSize: artSize, parseRelease: parseRelease, addDays: addDays, isFollowed: isFollowed,
           defaultSettings: defaultSettings, dealtSet: dealtSet, attention: attention, WINDOW_DAYS: WINDOW_DAYS, LIFE_DAYS: LIFE_DAYS, CAP: CAP };
})();
</script>

<script>
// ══════════════════════════════════════════════════════════════════
// MUSIC TRACKER v1.00. Phase 1: artists, Apple Music links, new releases, launcher card and Needs attention.
// Data: pal_music rows (this user only): artist_<id>, attn_<releaseId> and __settings__. The scheduled server function
// (swift-responder / pal-music-proxy) reads the same rows, so the field names below (following, excluded, appleArtistId, dealt, attention)
// are shared with it and must not be renamed. Releases are a cache rebuilt from Apple (IndexedDB mus_db), never synced.
// ══════════════════════════════════════════════════════════════════
const APP_VERSION = '1.00';
const SB_TABLE = 'pal_music';
const STAT_CACHE_KEY = 'pal_mus_stat';
const UI_KEY = 'mus_ui';
const REFRESH_STALE_MS = 6 * 3600 * 1000;
const _tArtists  = window.PalSync.table(SB_TABLE, { prefix: 'artist_' });
const _tAttn     = window.PalSync.table(SB_TABLE, { prefix: 'attn_' });
const _tSettings = window.PalSync.table(SB_TABLE, {});
const C = window.MusicCore;

let state = { v: 1, artists: [], attn: [], settings: C.defaultSettings(), lastExported: null };
let rel = { fetchedAt: null, items: {}, fetched: {} };          // items: collectionId -> release; fetched: appleArtistId -> ISO
let ui = { tab: 'releases', range: '90', album: true, single: true, aFilter: 'all', aQuery: '' };
let _syncState = 'connecting', _syncLog = [], _refreshing = false, _hl = null, _lastRefreshInfo = '';
let _bootResolve; const _bootReady = new Promise(r => { _bootResolve = r; });

// ── helpers ───────────────────────────────────────────────────────
// esc(), todayISO(), toast() and applyThemeCore() come from pal-shared.js (loaded above); not redefined here.
const $ = id => document.getElementById(id);
function fmtDate(iso) { try { if (window.PalShared && PalShared.fmtDate) return PalShared.fmtDate(iso) || iso; } catch (e) {} return iso; }
function ago(iso) {
  const t = Date.parse(iso); if (!t) return 'never';
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 2880 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago';
}
const IS_MAC = /Macintosh/.test(navigator.userAgent) && !(navigator.maxTouchPoints > 1);   // iPadOS reports "Macintosh" but has touch
function macify(url) { return IS_MAC ? url.replace(/^https:\/\//, 'music://') : url; }
function artistUrl(a) {
  return macify(a.appleArtistId ? 'https://music.apple.com/gb/artist/' + C.slug(a.appleName || a.name) + '/' + a.appleArtistId
                                : 'https://music.apple.com/gb/search?term=' + encodeURIComponent(a.name));
}
function releaseUrl(r) {
  let u = r.url || '';
  if (/^https:\/\/music\.apple\.com\//.test(u)) return macify(u.replace(/^(https:\/\/music\.apple\.com\/)[a-z]{2}\//, '$1gb/').replace(/\?.*$/, ''));
  return macify('https://music.apple.com/gb/search?term=' + encodeURIComponent(r.artistName + ' ' + r.name));
}

// ── Apple (iTunes Search / Lookup: free, no key, allows browser requests) ──
async function itunes(path) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 10000);
  try { const r = await fetch('https://itunes.apple.com/' + path, { signal: ctl.signal }); if (!r.ok) throw new Error('Apple returned HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function searchArtists(q) { const j = await itunes('search?term=' + encodeURIComponent(q) + '&entity=musicArtist&limit=8&country=GB'); return (j.results || []).filter(x => x && x.artistId && x.artistName); }

// ── artists ───────────────────────────────────────────────────────
function newId(aid) { return aid ? 'a' + aid : 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function findByApple(aid) { return liveArtists().find(a => String(a.appleArtistId) === String(aid)); }
function addArtist(name, hit, level) {
  if (hit && findByApple(hit.artistId)) return { dup: findByApple(hit.artistId) };
  const prior = state.artists.find(a => a._deleted && hit && String(a.appleArtistId) === String(hit.artistId));   // re-adding a removed artist revives it
  const now = new Date().toISOString();
  const a = prior || { id: newId(hit && hit.artistId), addedAt: now };
  Object.assign(a, { name: String(name).trim(), appleArtistId: hit ? String(hit.artistId) : '', appleName: hit ? hit.artistName : '', genre: hit ? (hit.primaryGenreName || '') : '',

// ── releases ──────────────────────────────────────────────────────
let _again = false;
async function refreshReleases(o) {
  o = o || {};

  const cutoff = Date.now() - REFRESH_STALE_MS;
  let targets = (o.only || followedArtists()).filter(hasApple);
  if (!o.only && !o.force) targets = targets.filter(a => !rel.fetched[String(a.appleArtistId)] || Date.parse(rel.fetched[String(a.appleArtistId)]) < cutoff);
  if (!targets.length) { setRelInfo(); renderReleases(); return; }
  _refreshing = true; renderReleases();
  let ok = 0, fail = 0, firstErr = '';
  await pool(targets, 3, async a => {
    try {
      const items = await lookupAlbums(a.appleArtistId), aid = String(a.appleArtistId);
      Object.keys(rel.items).forEach(k => { if (rel.items[k].aid === aid) delete rel.items[k]; });
      items.forEach(r => { rel.items[r.id] = r; });
      rel.fetched[aid] = new Date().toISOString(); ok++;
    } catch (e) { fail++; firstErr = firstErr || (e && e.message) || 'failed'; }
  });
  if (ok) { rel.fetchedAt = new Date().toISOString(); saveRel(); }
  _refreshing = false;
  _lastRefreshInfo = fail ? (ok ? 'Updated ' + ok + ' of ' + targets.length + ' artists (' + fail + ' failed: ' + firstErr + ')' : 'Could not reach Apple Music: ' + firstErr) : '';
  if (fail && !ok) toast('Could not refresh releases: ' + firstErr, 'err');
  slog('Releases: ' + ok + ' ok, ' + fail + ' failed' + (firstErr ? ' (' + firstErr + ')' : ''), fail ? 'error' : 'ok');
  renderAll();

}

    '<br><span class="note">The app checks when you open it if it has been more than six hours. The launcher is also kept up to date by a daily server check.</span>';

// ── contract + launcher cache ─────────────────────────────────────
function buildPayload(status) {
  const today = todayISO(), live = liveArtists(), fol = followedArtists();
  const att = C.attention(allReleases(), state.artists, state.settings, state.attn, today);
  const folAids = new Set(fol.filter(hasApple).map(a => String(a.appleArtistId)));
  const latest = allReleases().filter(r => folAids.has(r.aid) && r.date <= today).sort((a, b) => b.date.localeCompare(a.date) || a.id.localeCompare(b.id)).slice(0, 4)
    .map(r => ({ a: r.artistName, t: r.name, d: r.date, img: C.artSize(r.art, 100) }));
  const card = { artists: live.length, followed: fol.length, newReleases: att.eligible, latest };
  return { attention: att.items, summary: { artists: live.length, followed: fol.length, newReleases: att.eligible, attentionOverflow: att.overflow, card,
           refresh: { at: rel.fetchedAt || new Date().toISOString(), status: status || 'ok', current: (status || 'ok') === 'ok', source: 'app', providers: { 'itunes-releases': status || 'ok' } } } };
}
function publishContract(status) {
  try {
    if (!window.PalContract || !window.PalSync.getUserId() || !liveArtists().length) return;   // an empty library never overwrites a good contract
    const p = buildPayload(status);
    window.PalContract.publish('music', { attention: p.attention, summary: p.summary, app: 'music-' + APP_VERSION, schema: '1', caps: { app: true } });
    const rows = [];
    liveArtists().forEach(a => rows.push({ id: 'artist:' + a.id, t: a.name, s: a.genre || '', k: 'Artist', open: { view: 'artist', id: a.id } }));
    allReleases().filter(r => r.date <= todayISO()).sort((x, y) => y.date.localeCompare(x.date)).slice(0, 300)
      .forEach(r => rows.push({ id: 'rel_' + r.id, t: r.name, s: r.artistName, k: r.kind === 'single' ? 'Single' : r.kind === 'ep' ? 'EP' : 'Album', d: r.date, open: { view: 'releases', id: 'rel_' + r.id } }));
    window.PalContract.publishSearch('music', rows, rows.length);
  } catch (e) {}

}

    const hits = await searchArtists(q);
    if (!hits.length) { out.innerHTML = '<div class="empty">No artists found for “' + esc(q) + '”.</div>'; return; }
    out.innerHTML = hits.map((h, i) => { const have = findByApple(h.artistId);
      return '<div class="res"><div class="rb"><div class="rt">' + esc(h.artistName) + '</div><div class="rs">' + esc(h.primaryGenreName || '') + '</div></div>' + (have ? '<span class="badge">In your list</span>' : '<button class="btn pri sm" data-add="' + i + '">+ Add</button>') + '</div>'; }).join('');
    out.onclick = ev => {
      const b = ev.target.closest('[data-add]'); if (!b) return; const h = hits[+b.dataset.add];
      const r = addArtist(h.artistName, h, 'manual'); if (r.dup) { toast('Already in your list'); return; }
      b.outerHTML = '<span class="badge new">Added</span>'; afterChange(); refreshReleases({ only: [r.artist] });
    };
  } catch (err) { out.innerHTML = '<div class="empty">Could not reach Apple Music: ' + esc(err.message) + '</div>'; }
}
async function doBulk() {
  const names = [...new Set($('bulkText').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean))].slice(0, 80);
  if (!names.length) { toast('Type or paste some names first', 'err'); return; }
  const btn = $('bulkGo'), prog = $('bulkProg'), out = $('bulkOut'), results = [];
  btn.disabled = true; prog.style.display = ''; out.innerHTML = '';
  const have = new Set(liveArtists().map(a => C.norm(a.name)));
  for (let i = 0; i < names.length; i++) {
    const nm = names[i]; prog.firstChild.style.width = Math.round(i / names.length * 100) + '%';
    if (have.has(C.norm(nm))) { results.push({ nm, s: 'dup' }); continue; }
    try {
      const hits = await searchArtists(nm), c = C.classify(nm, hits);
      if ((c.level === 'high' || c.level === 'medium') && !findByApple(c.pick.artistId)) { addArtist(nm, c.pick, c.level); results.push({ nm, s: c.level, to: c.pick.artistName }); }
      else if (c.level === 'high' || c.level === 'medium') results.push({ nm, s: 'dup' });
      else { addArtist(nm, null, c.level); results.push({ nm, s: c.level === 'low' ? 'low' : 'none' }); }
      have.add(C.norm(nm));
    } catch (err) { results.push({ nm, s: 'err', to: err.message }); if (/HTTP 403|HTTP 429/.test(err.message)) { break; } }
    await new Promise(r => setTimeout(r, 650));      // Apple's search allows about 20 requests a minute
  }
  prog.firstChild.style.width = '100%'; btn.disabled = false;
  const lbl = { high: '✓ Matched', medium: '⚠ Matched, please check', low: '? No clear match: choose one in Artists', none: '? Not found: choose one in Artists', dup: 'Already in your list', err: '✗ Not added' };
  out.innerHTML = '<div class="h2">Result</div>' + results.map(r => '<div class="res"><div class="rb"><div class="rt">' + esc(r.nm) + '</div><div class="rs">' + esc(lbl[r.s]) + (r.to && r.s !== 'err' && C.norm(r.to) !== C.norm(r.nm) ? ': ' + esc(r.to) : r.s === 'err' ? ' (' + esc(r.to) + ')' : '') + '</div></div></div>').join('');
  if (results.some(r => r.s === 'err')) toast('Some names could not be added: wait a minute and run those again', 'err');
  $('bulkText').value = results.filter(r => r.s === 'err').map(r => r.nm).join('\n');
  afterChange(); refreshReleases({});
}

// ── sync (pal_music) ──────────────────────────────────────────────
function slog(msg, level) { _syncLog.push({ entry: '[' + new Date().toLocaleTimeString('en-GB') + '] ' + msg, level: level || 'info' }); if (_syncLog.length > 100) _syncLog.shift(); renderSyncLog(); }
function renderSyncLog() {
  const el = $('syncLog'); if (!el) return;
  if (!_syncLog.length) { el.textContent = 'No activity yet.'; return; }
  el.innerHTML = _syncLog.slice().reverse().map(e => '<div style="color:' + (e.level === 'error' ? 'var(--red)' : e.level === 'ok' ? 'var(--green)' : 'inherit') + '">' + esc(e.entry) + '</div>').join('');
}
function setSyncStatus(s) {
  _syncState = s; const chip = $('sync-chip'), lbl = $('sync-lbl'); if (!chip) return;
  const pending = window.PalSync.retryQueueLength();
  const cls = pending ? 'syncing' : s === 'synced' ? 'synced' : (s === 'syncing' || s === 'connecting') ? 'syncing' : s === 'error' ? 'error' : 'local';
  chip.className = 'sync-chip state-' + cls;
  lbl.textContent = pending ? '⏳ ' + pending + ' pending sync' : s === 'synced' ? 'Synced' : s === 'syncing' ? 'Syncing…' : s === 'connecting' ? 'Connecting…' : s === 'error' ? 'Sync error' : 'Local';
}
const hint = e => window.PalSync.errorHint(e && e.status, e && e.message);
async function pushArtist(a) { if (!window.PalSync.hasSession()) return; setSyncStatus('syncing'); try { await _tArtists.upsert(a.id, a); setSyncStatus('synced'); } catch (e) { slog('Artist ' + a.name + ': ' + hint(e), 'error'); setSyncStatus('error'); } }
async function pushAttn(r) { if (!window.PalSync.hasSession()) return; try { await _tAttn.upsert(r.id, r); setSyncStatus('synced'); } catch (e) { slog('Seen mark: ' + hint(e), 'error'); setSyncStatus('error'); } }
async function pushSettings() { if (!window.PalSync.hasSession()) return; try { await _tSettings.upsert('__settings__', state.settings); setSyncStatus('synced'); } catch (e) { slog('Settings: ' + hint(e), 'error'); setSyncStatus('error'); } }
async function syncPull() {
  if (!window.PalSync.hasSession()) return;
  setSyncStatus('syncing');
  try {
    const rows = await window.PalSync.fetchTableRows(SB_TABLE);
    const a = await _tArtists.pull(state.artists, 'id', 'updatedAt', rows); state.artists = a.merged;
    const t = await _tAttn.pull(state.attn, 'id', 'updatedAt', rows); state.attn = t.merged;
    const sr = rows.find(r => r.record_key === '__settings__');
    if (sr && sr.data && sr.data.attention) {
      if ((sr.data.updatedAt || '') > (state.settings.updatedAt || '')) state.settings = normaliseState({ settings: sr.data }).settings;
      else if ((sr.data.updatedAt || '') < (state.settings.updatedAt || '')) await pushSettings();
    } else if (state.settings.updatedAt) await pushSettings();
    saveState(); renderAll();
    slog('Pulled ' + liveArtists().length + ' artists (' + a.pushedCount + ' local-only sent up)', 'ok'); setSyncStatus('synced');
  } catch (e) { slog('Pull failed: ' + hint(e), 'error'); setSyncStatus('error'); }
}
function manualPull() { if (!window.PalSync.hasSession()) { toast('Not connected to cloud', 'err'); return; } syncPull().then(() => toast('Pulled from cloud')); }
async function manualPush() {
  if (!window.PalSync.hasSession()) { toast('Not connected to cloud', 'err'); return; }
  setSyncStatus('syncing');
  try { for (const a of state.artists) await _tArtists.upsert(a.id, a); for (const r of state.attn) await _tAttn.upsert(r.id, r); if (state.settings.updatedAt) await _tSettings.upsert('__settings__', state.settings);
        slog('Pushed ' + state.artists.length + ' artists', 'ok'); setSyncStatus('synced'); toast('Pushed to cloud'); }
  catch (e) { slog('Push error: ' + hint(e), 'error'); setSyncStatus('error'); toast('Push had errors', 'err'); }
}

// ── backup ────────────────────────────────────────────────────────
function exportJSON() {
  state.lastExported = new Date().toISOString(); flushState();
  const out = { format: 'music-tracker-backup/1', app: 'music', version: APP_VERSION, exportedAt: state.lastExported, artists: state.artists, attn: state.attn, settings: state.settings };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  a.download = 'music-tracker-backup.json'; a.click(); toast('Exported');
}
function importJSON(evt) {
  const file = evt.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const inc = JSON.parse(reader.result);
      if (!inc || inc.format !== 'music-tracker-backup/1' || !Array.isArray(inc.artists)) throw new Error('Not a Music Tracker backup file');
      const have = new Map(state.artists.map(a => [a.id, a])); let added = 0, newer = 0;
      inc.artists.forEach(a => { if (!a || !a.id) return; const cur = have.get(a.id); if (!cur) { state.artists.push(a); added++; } else if ((a.updatedAt || '') > (cur.updatedAt || '')) { Object.assign(cur, a); newer++; } });
      const hv = new Map(state.attn.map(a => [a.id, a]));
      (inc.attn || []).forEach(a => { if (!a || !a.id) return; const cur = hv.get(a.id); if (!cur) state.attn.push(a); else if ((a.updatedAt || '') > (cur.updatedAt || '')) Object.assign(cur, a); });
      if (inc.settings && inc.settings.attention && (inc.settings.updatedAt || '') > (state.settings.updatedAt || '')) state.settings = normaliseState({ settings: inc.settings }).settings;
      saveState(); renderAll(); toast('Imported ' + added + ' new, ' + newer + ' updated');
      if (window.PalSync.hasSession()) manualPush();
      refreshReleases({});
    } catch (e) { toast('Import failed: ' + e.message, 'err'); }
    evt.target.value = '';
  };
  reader.readAsText(file);
}

// ── Sync & Backup sheet (shared) ──────────────────────────────────
function fillSummary() {
  const live = liveArtists().length, fol = followedArtists().length;
  $('dataSummary').innerHTML = '<strong>' + live + '</strong> artist' + (live === 1 ? '' : 's') + ' &nbsp;·&nbsp; <strong>' + fol + '</strong> following' + (state.lastExported ? '<br>Last exported <strong>' + esc(fmtDate(state.lastExported)) + '</strong>' : '');
}
function openDataModal() {
  fillSummary(); setRelInfo();
  const connected = window.PalSync.hasSession();
  $('syncStatusVal').innerHTML = _syncState === 'synced' ? '<span style="color:var(--green)">Synced</span>' : _syncState === 'error' ? '<span style="color:var(--red)">Error</span>' : _syncState === 'syncing' || _syncState === 'connecting' ? 'Syncing…' : 'Local only';
  $('syncSessionVal').textContent = connected ? 'Token received' : 'No token';
  $('syncUserVal').textContent = window.PalSync.getUserId() ? window.PalSync.getUserId().slice(0, 8) + '…' : '—';
  renderSyncLog(); PalUI.dataSheet.open();
}
PalUI.dataSheet.mount({
  ids: { status: 'syncStatusVal', session: 'syncSessionVal', user: 'syncUserVal', log: 'syncLog' }, fileId: 'importFile',
  onPull: manualPull, onPush: manualPush, onExport: exportJSON, onFile: importJSON, slots: { top: 'musDataTop', afterSync: 'musDataAfterSync' }
});
PalUI.pill.dock('#sync-chip');

// ── events ────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const t = e.target.closest('[data-artist],[data-open-rel],[data-seen]'); if (!t) return;
  if (t.dataset.artist) openSheet(t.dataset.artist);
  else if (t.dataset.openRel) { const r = rel.items[t.dataset.openRel]; if (r) openApple(releaseUrl(r)); }
  else if (t.dataset.seen) setSeen(t.dataset.seen, t.dataset.on === '1');
});
$('sheetBg').addEventListener('mousedown', e => { if (e.target === $('sheetBg')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('sheetBg').classList.contains('on')) { e.preventDefault(); closeSheet(); } });
window.addEventListener('message', e => {
  if (e.origin !== window.location.origin || !e.data) return;
  if (e.data.type === 'PAL_THEME' && e.data.theme) {
    const dark = e.data.theme === 'dark'; applyThemeCore(dark, { dark: '#0E0D12', light: '#F4F0E6' }); try { localStorage.setItem('mus_theme_pref', dark ? 'dark' : 'light'); } catch (x) {}
  } else if (e.data.type === 'PAL_OPEN') {                 // from the launcher's Needs attention and Universal Search
    _bootReady.then(() => {
      if (e.data.view === 'artist' && e.data.id && byId(e.data.id)) { switchTab('artists'); openSheet(e.data.id); }
      else if (e.data.view === 'releases') {
        ui.range = 'all'; ui.album = ui.single = true; _hl = e.data.id || null; switchTab('releases');
        if (_hl) setTimeout(() => { const el = document.getElementById(_hl); if (el) el.scrollIntoView({ block: 'center' }); }, 120);
        setTimeout(() => { _hl = null; if (ui.tab === 'releases') renderReleases(); }, 4000);
      }
    });
  }
});
window.PalBridge && PalBridge.listen('MUS', { refresh: () => refreshReleases({ force: true }).then(() => true) }, { app: 'music' });

window.PalSync.initSession({
  onSession: async () => {
    await _bootReady;
    slog('PAL_SESSION received for user ' + (window.PalSync.getUserId() || '?').slice(0, 8) + '…'); setSyncStatus('connecting');
    await syncPull(); publishContract(_lastRefreshInfo ? 'partial' : 'ok');
    if (followedArtists().some(hasApple) && releasesStale()) refreshReleases({});
  },
  onRetryFlushed: r => { if (r.flushed) slog('Retried ' + r.flushed + ' queued change(s): done', 'ok'); setSyncStatus(_syncState); },
  onNoSession: () => { setSyncStatus('local'); slog('No PAL_SESSION after 3 s: running on this device only', 'error'); $('no-pal-banner').style.display = 'block';
                       _bootReady.then(() => { if (followedArtists().some(hasApple) && releasesStale()) refreshReleases({}); }); },
  noSessionMs: 3000
});
setSyncStatus('connecting');

// ── boot ──────────────────────────────────────────────────────────
(async () => {
  try {
    loadUi(); await kvOpen();
    state = normaliseState(await kvGet('state'));
    const r = await kvGet('rel'); if (r && r.items) rel = { fetchedAt: r.fetchedAt || null, items: r.items, fetched: r.fetched || {} };
    writeStatCache(); switchTab('releases');
  } finally { _bootResolve(); }
})();
</script>
