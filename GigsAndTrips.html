// GYM-039: CROSS-APP GYM SCHEDULE READER
// Reads the lightweight summary written by Gym Tracker (v2.42+) from
// localStorage key 'gym_pal_xapp'. Computes which plan names fall on
// a given ISO date — mirrors the gym's resolvePlansForDate logic but
// operates on the summary structure only. Graceful no-op if the key
// is absent (gym not installed / not yet saved on this device).
// ═══════════════════════════════════════════════════════════════════
const GYM_XAPP_KEY = 'gym_pal_xapp';
let _gymXApp = null; // cached summary; refreshed per render cycle

function loadGymXApp() {
  try {
    const raw = localStorage.getItem(GYM_XAPP_KEY);
    _gymXApp = raw ? JSON.parse(raw) : null;
  } catch(e) { _gymXApp = null; }
}

// Returns array of { date, names[] } for each date in [startDate, endDate]
// that has gym plans — capped at 14 days to keep render fast.
function gymPlansInRange(startDate, endDate) {
  if (!_gymXApp || !startDate) return [];
  const end = endDate || startDate;
  const results = [];
  let cur = startDate;
  let limit = 0;
  while (cur <= end && limit < 14) {
    const names = gymPlansForDate(cur);
    if (names.length) results.push({ date: cur, names });
    // increment date
    const [y, m, d] = cur.split('-').map(Number);
    const next = new Date(y, m - 1, d + 1);
    cur = next.getFullYear() + '-' + String(next.getMonth() + 1).padStart(2, '0') + '-' + String(next.getDate()).padStart(2, '0');
    limit++;
  }
  return results;
}
// Replicates gym's rule-match logic (daily / weekly / chosen-days / every-N).
function gymPlansForDate(dateStr) {
  if (!_gymXApp || !dateStr) return [];
  const { plans = [], scheduleEntries = [] } = _gymXApp;
  const planMap = {};
  plans.forEach(p => { planMap[p.id] = p.name; });

  const seen = new Set();
  const result = [];

  function push(planId) {
    if (seen.has(planId) || !planMap[planId]) return;
    seen.add(planId);
    result.push(planMap[planId]);
  }

  // One-off entries (no 'kind' field, has 'date')
  scheduleEntries
    .filter(e => !e.kind && e.date === dateStr)
    .forEach(e => push(e.planId));

  // Repeat rules
  scheduleEntries
    .filter(e => e.kind === 'repeat' && e.startDate && e.startDate <= dateStr)
    .forEach(r => {
      if (r.endDate && r.endDate < dateStr) return;
      if ((r.exceptions || []).includes(dateStr)) return;
      // Check frequency match
      const start = r.startDate;
      const freq = r.freq || 'weekly';
      // Compute day-of-week index (0=Mon … 6=Sun) for a date string
      function dowIdx(iso) {
        const [y, m, d] = iso.split('-').map(Number);
        return (new Date(y, m - 1, d).getDay() + 6) % 7; // Mon=0
      }
      // Compute days between two ISO dates
      function dayDiff(a, b) {
        const da = new Date(a + 'T00:00:00'), db = new Date(b + 'T00:00:00');
        return Math.round((db - da) / 86400000);
      }
      let match = false;
      if (freq === 'daily') {
        match = true;
      } else if (freq === 'weekly') {
        match = dowIdx(dateStr) === dowIdx(start);
      } else if (freq === 'days') {
        match = (r.days || []).includes(dowIdx(dateStr));
      } else if (freq === 'everyN') {
        const n = r.interval || 1;
        match = dayDiff(start, dateStr) % n === 0;
      }
      if (match) push(r.planId);
    });

  return result;
}

// Render a gym plans row for an event card. Returns '' when no plans.
function renderGymPlansRow(dateStr) {
  const names = gymPlansForDate(dateStr);
  if (!names.length) return '';
  const badges = names.map(n =>
    `<button class="gym-plan-badge" onclick="openGymTracker(event)">🏋️ ${esc(n)}</button>`
  ).join('');
  return `<div class="gym-plans-row">Gym: ${badges}</div>`;
}

// Render gym plans for a date range (trips). Shows up to 3 date hits compactly.
function renderGymPlansInRange(startDate, endDate) {
  const hits = gymPlansInRange(startDate, endDate);
  if (!hits.length) return '';
  const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const badges = hits.map(h => {
    const [y, m, d] = h.date.split('-').map(Number);
    const dow = DAY_SHORT[new Date(y, m - 1, d).getDay()];
    const label = `${dow} ${d} — ${h.names.join(', ')}`;
    return `<button class="gym-plan-badge" onclick="openGymTracker(event)">🏋️ ${esc(label)}</button>`;
  }).join('');
  return `<div class="gym-plans-row">Gym during trip: ${badges}</div>`;
}

// Navigate to Gym Tracker: three-pronged approach so it works regardless of
// how the launcher wires up PAL_NAVIGATE (GYM-040).
// 1. postMessage to window.parent (launcher receives if it listens)
// 2. BroadcastChannel 'pal_navigate' (launcher can listen on same origin)
// 3. localStorage signal 'pal_nav_request' (belt-and-braces; launcher can
//    poll or listen via storage event)
// Standalone (no launcher): falls through to direct href navigation.
function openGymTracker(e) {
  e.stopPropagation();
  const msg = { type: 'PAL_NAVIGATE', app: 'gym-tracker' };
  let embedded = false;
  try { embedded = window.parent !== window; } catch(_) {}
  if (embedded) {
    // postMessage to parent frame
    try { window.parent.postMessage(msg, window.location.origin); } catch(_) {}
    // BroadcastChannel — same origin, any tab/frame can receive
    try { const bc = new BroadcastChannel('pal_navigate'); bc.postMessage(msg); bc.close(); } catch(_) {}
    // localStorage signal — storage event fires in other same-origin frames
    try {
      localStorage.setItem('pal_nav_request', JSON.stringify({ ...msg, _t: Date.now() }));
    } catch(_) {}
    return;
  }
  // Standalone fallback
  window.location.href = 'gym-tracker.html';
}

// Match an event against the current search query
function eventMatchesSearch(ev,q){
  if(!q) return true;
  const fields=[];
  if(ev.type==='gig'){
    fields.push(ev.name||'');
    fields.push(ev.date||'');
    fields.push(ev.venue||'');
    // Also match formatted date so "Jul" or "2026" works
    if(ev.date) fields.push(fmtDateLong(ev.date));
    fields.push(gigTypeInfo(ev.gigType||'music').label);
  } else {
    fields.push(ev.name||'');
    fields.push(ev.destination||'');
    fields.push(ev.startDate||'');
    fields.push(ev.endDate||'');
    if(ev.startDate) fields.push(fmtDateLong(ev.startDate));
    if(ev.endDate) fields.push(fmtDateLong(ev.endDate));
  }
  const hay=fields.join(' ').toLowerCase();
  return hay.includes(q);
}

let _collapsedYears=null;
let _collapsedYearsUp=null;
function toggleYearGroup(yr,tab){
  if(tab==='upcoming'){
    if(!_collapsedYearsUp) _collapsedYearsUp=new Set();
    if(_collapsedYearsUp.has(yr)) _collapsedYearsUp.delete(yr); else _collapsedYearsUp.add(yr);
  } else {
    if(!_collapsedYears) _collapsedYears=new Set();
    if(_collapsedYears.has(yr)) _collapsedYears.delete(yr); else _collapsedYears.add(yr);
  }
  render();
}

// ── Month sub-groups within each year (GIG-034) ─────────────────────
// Same collapsible pattern as the year headers above, one level down.
// Keys are 'YYYY-MM' so they're unique across years without needing the
// tab in the key itself — upcoming and past keep entirely separate Sets
// (like the year ones do), so there's no cross-tab collision either.
// Both years and months are auto-expanded by default (empty Set = nothing
// collapsed), matching the existing year behaviour.
let _collapsedMonths=null;
let _collapsedMonthsUp=null;
function toggleMonthGroup(mo,tab){
  if(tab==='upcoming'){
    if(!_collapsedMonthsUp) _collapsedMonthsUp=new Set();
    if(_collapsedMonthsUp.has(mo)) _collapsedMonthsUp.delete(mo); else _collapsedMonthsUp.add(mo);
  } else {
    if(!_collapsedMonths) _collapsedMonths=new Set();
    if(_collapsedMonths.has(mo)) _collapsedMonths.delete(mo); else _collapsedMonths.add(mo);
  }
  render();
}
function fmtMonthLabel(mo){
  if(mo.endsWith('-00')) return 'Unknown month';
  const [y,m]=mo.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long'});
}
function render(){
  loadGymXApp(); // GYM-039: refresh gym schedule summary each render
  if(_tab==='reviews'){ showPanel('list',true); renderReviews(); return; }
  if(_tab==='venues'){  showPanel('list',true); renderVenues();  return; }
  if(_tab==='calendar'){ showPanel('list',true); renderCalendar(); return; }
  showPanel('list',true);

  const today=new Date(); today.setHours(0,0,0,0);
  const todayStr=localDateStr(today);
  const d=getData();
  const all=(d.events||[]).filter(ev=>!ev._deleted);

  let upcoming=[], past=[];
  all.forEach(ev=>{
    const endDate=ev.type==='gig'?ev.date:ev.endDate;
    if(!endDate) return;
    const isOver = ev.type==='gig' ? ev.done||ev.missed||(endDate<todayStr) : (ev.status==='Completed'||ev.status==='Cancelled'||(endDate<todayStr));
    if(isOver) past.push(ev); else upcoming.push(ev);
  });

  // Sort key: ISO datetime string for precise ordering including time.
  // Gigs use their time if set, otherwise end-of-day so untimed gigs
  // sit after timed ones on the same date. Trips use start (upcoming)
  // or end (past) date at midnight / end-of-day respectively.
  // Tie-break: trips before gigs (bigger commitment), then name A-Z.
  function sortKey(ev, forPast){
    if(ev.type==='gig'){
      const t=ev.time||'23:59';
      return (ev.date||'')+'T'+t;
    } else {
      return forPast
        ? (ev.endDate||ev.startDate||'')+'T23:59'
        : (ev.startDate||ev.endDate||'')+'T00:00';
    }
  }
  function sortCmp(a, b, forPast){
    const ka=sortKey(a,forPast), kb=sortKey(b,forPast);
    if(ka!==kb) return forPast ? kb.localeCompare(ka) : ka.localeCompare(kb);
    // Same datetime: trips first, then alphabetical
    if(a.type!==b.type) return a.type==='trip'?-1:1;
    return (a.name||'').localeCompare(b.name||'');
  }
  upcoming.sort((a,b)=>sortCmp(a,b,false));
  past.sort((a,b)=>sortCmp(a,b,true));

  const list = _tab==='upcoming' ? upcoming : past;

  // Apply search filter if active
  const filteredList = _searchQuery
    ? list.filter(ev=>eventMatchesSearch(ev,_searchQuery))
    : list;

  // Update results label
  const lbl=document.getElementById('searchResultsLabel');
  if(lbl){
    if(_searchQuery && filteredList.length!==list.length){
      lbl.textContent=filteredList.length===0
        ? 'No results'
        : filteredList.length+' result'+(filteredList.length!==1?'s':'');
    } else {
      lbl.textContent='';
    }
  }

  // Hide-trip-gigs toggle row — always shown on Upcoming/Past (search
  // filter above is independent of this; both can be active at once).
  const hideToggleRow=`<div class="hide-gigs-toggle-row" onclick="toggleHideTripGigs()">
    <span class="tgl-lbl">Hide trip gigs</span>
    <div class="tgl${_hideTripGigs?' on':''}"><div class="kn"></div></div>
  </div>`;

  // Applied after the search filter/label above so the "N results" count
  // reflects search matches only — this is a separate, additional cut.
  const visibleList=_hideTripGigs
    ? filteredList.filter(ev=>!(ev.type==='gig'&&ev.tripId))
    : filteredList;

  if(!visibleList.length){
    const hiddenBySearch=filteredList.length===0;
    document.getElementById('appInner').innerHTML=hideToggleRow+`<div class="empty">
      <div class="empty-icon">${_searchQuery?'🔍':hiddenBySearch?(_tab==='upcoming'?'🗓':'📖'):'🎸'}</div>
      <p>${_searchQuery?'No events match "'+_searchQuery+'"':hiddenBySearch?(_tab==='upcoming'?'No upcoming gigs or trips.<br>Tap ＋ to add one.':'Nothing here yet — your past events will appear here.'):'All '+_tab+' gigs are linked to a trip and hidden.<br>Toggle above to show them, or open the trip.'}</p>
    </div>`;
    return;
  }

  let html=hideToggleRow;

  // Helper: render year-grouped events for both tabs
  // GIG-034: each year now also splits into collapsible month sub-groups,
  // sorted the same direction as the year itself (soonest first for
  // upcoming, most recent first for past), auto-expanded by default.
  function renderYearGroups(evList, tab, collapsedYears, collapsedMonths){
    const byYear={};
    evList.forEach(ev=>{
      const dateStr=ev.type==='gig'?ev.date:(tab==='upcoming'?ev.startDate:ev.endDate)||ev.startDate;
      const yr=dateStr?dateStr.slice(0,4):'Unknown';
      if(!byYear[yr]) byYear[yr]=[];
      byYear[yr].push({ev,dateStr});
    });
    // Upcoming: ascending year order (soonest year first); Past: descending (most recent year first)
    const years=Object.keys(byYear).sort((a,b)=>tab==='upcoming'?a.localeCompare(b):b.localeCompare(a));
    let out='';
    years.forEach(yr=>{
      const isYearCollapsed=collapsedYears.has(yr);
      const count=byYear[yr].length;
      out+=`<div class="year-hdr" onclick="toggleYearGroup('${yr}','${tab}')">
        <span class="year-hdr-label">${yr}</span>
        <span class="year-hdr-count">${count} event${count!==1?'s':''}</span>
        <span class="year-hdr-chevron">${isYearCollapsed?'▶':'▼'}</span>
      </div>`;
      if(!isYearCollapsed){
        out+=`<div class="year-group" id="yg-${tab}-${yr}">`;
        const byMonth={};
        byYear[yr].forEach(({ev,dateStr})=>{
          const mo=(dateStr&&dateStr.length>=7)?dateStr.slice(0,7):yr+'-00';
          if(!byMonth[mo]) byMonth[mo]=[];
          byMonth[mo].push(ev);
        });
        const months=Object.keys(byMonth).sort((a,b)=>tab==='upcoming'?a.localeCompare(b):b.localeCompare(a));
        months.forEach(mo=>{
          const isMonthCollapsed=collapsedMonths.has(mo);
          const mCount=byMonth[mo].length;
          out+=`<div class="month-hdr" onclick="toggleMonthGroup('${mo}','${tab}')">
            <span class="month-hdr-label">${fmtMonthLabel(mo)}</span>
            <span class="month-hdr-count">${mCount} event${mCount!==1?'s':''}</span>
            <span class="month-hdr-chevron">${isMonthCollapsed?'▶':'▼'}</span>
          </div>`;
          if(!isMonthCollapsed){
            out+=`<div class="month-group" id="mg-${tab}-${mo}">`;
            byMonth[mo].forEach(ev=>{
              if(ev.type==='gig') out+=renderGigCard(ev,d);
              else out+=renderTripCard(ev,d);
            });
            out+=`</div>`;
          }
        });
        out+=`</div>`;
      }
    });
    return out;
  }

  if(_searchQuery){
    // Flat list when searching — year groups add noise when filtering
    visibleList.forEach(ev=>{
      if(ev.type==='gig') html+=renderGigCard(ev,d);
      else html+=renderTripCard(ev,d);
    });
  } else if(_tab==='past'){
    if(!_collapsedYears) _collapsedYears=new Set();
    if(!_collapsedMonths) _collapsedMonths=new Set();
    html+=renderYearGroups(visibleList,'past',_collapsedYears,_collapsedMonths);
  } else {
    // Upcoming — year grouped, closest year first
    if(!_collapsedYearsUp) _collapsedYearsUp=new Set();
    if(!_collapsedMonthsUp) _collapsedMonthsUp=new Set();
    html+=renderYearGroups(visibleList,'upcoming',_collapsedYearsUp,_collapsedMonthsUp);
  }

  document.getElementById('appInner').innerHTML=html;
}


// ── Countdown pill helpers (GIG-035) ────────────────────────────────
// Sensible scale: today/tomorrow called out by name, then days for the
// next ~2 weeks, weeks out to ~2 months, months beyond that. Returns
// null for anything already past (shouldn't normally be asked of a past
// event, but kept defensive) so callers can just skip the pill.
function countdownLabel(dateStr){
  if(!dateStr) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const target=new Date(dateStr+'T00:00:00');
  const diffDays=Math.round((target-today)/86400000);
  if(diffDays<0) return null;
  if(diffDays===0) return {text:'Today', cls:'today'};
  if(diffDays===1) return {text:'Tomorrow', cls:'today'};
  if(diffDays<14) return {text:`in ${diffDays} days`, cls:'soon'};
  if(diffDays<60){
    const weeks=Math.round(diffDays/7);
    return {text:`in ${weeks} week${weeks!==1?'s':''}`, cls:'normal'};
  }
  const months=Math.round(diffDays/30.44);
  return {text:`in ${months} month${months!==1?'s':''}`, cls:'normal'};
}
// Trips get their own variant: if currently underway, show "Day N of D"
// instead of a countdown to a start date that's already passed.
function tripCountdownLabel(t){
  if(t.status==='Completed'||t.status==='Cancelled') return null;
  if(!t.startDate||!t.endDate) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const start=new Date(t.startDate+'T00:00:00');
  const end=new Date(t.endDate+'T00:00:00');
  if(today>end) return null;
  if(today>=start){
    const totalDays=Math.round((end-start)/86400000)+1;
    const dayNum=Math.round((today-start)/86400000)+1;
    return {text:`Day ${dayNum} of ${totalDays}`, cls:'today'};
  }
  return countdownLabel(t.startDate);
}
function countdownPillHtml(cd){
  return cd?`<span class="countdown-pill ${cd.cls}">${cd.text}</span>`:'';
}

function renderGigCard(g, d){
  const ti=gigTypeInfo(g.gigType||g.type2||'music');
  const hasReview=g.review&&g.review.rating;
  const stars=hasReview?'★'.repeat(g.review.rating)+'☆'.repeat(5-g.review.rating):'';
  const tripConflicts=gigsConflictingTrips(g.date, g.tripId||null, d);
  const gigConflicts=(!g.done&&!g.missed)?gigsOnSameDate(g.id, g.date, d):[];
  let conflictHtml='';
  if(tripConflicts.length){
    conflictHtml+=`<div class="conflict-banner"><span>⚠️</span><span>Clashes with trip: <strong>${esc(tripConflicts.map(t=>t.name).join(', '))}</strong></span></div>`;
  }
  if(gigConflicts.length){
    conflictHtml+=`<div class="conflict-banner"><span>⚠️</span><span>Same date as: <strong>${esc(gigConflicts.map(g=>g.name+(g.time?' ('+g.time+')':'')).join(', '))}</strong></span></div>`;
  }
  if(!tripConflicts.length&&!gigConflicts.length&&g.tripId){
    const trip=d.events.find(e=>e.id===g.tripId);
    if(trip) conflictHtml=`<div style="margin-top:6px"><span class="trip-pill">✈️ Part of: ${esc(trip.name)}</span></div>`;
  }
  const dayOff=needsDayOff(g.date,g.time);
  if(dayOff&&!g.done&&!g.missed) conflictHtml+=`<div class="dayoff-banner"><span>📅</span><span>Weekday before 6pm — you may need a day off</span></div>`;

  // Date block: split into day number, month abbreviation, and weekday
  const _gd=g.date?new Date(g.date+'T00:00:00'):null;
  const _gdDay=_gd?_gd.getDate():'—';
  const _gdMon=_gd?_gd.toLocaleDateString('en-GB',{month:'short'}).toUpperCase():'';
  const _gdDow=_gd?_gd.toLocaleDateString('en-GB',{weekday:'short'}):'';
  return `<div class="event-card${g.done||g.missed?' past':''}${hasReview?' reviewed':''}" onclick="openGigDetail('${esc(g.id)}')">
    <div class="card-body">
      <div class="card-top">
        <div class="card-date-block">
          <div style="font-size:16px;line-height:1;margin-bottom:2px">${ti.icon}</div>
          <div class="card-date-day">${_gdDay}</div>
          <div class="card-date-mon">${_gdMon}</div>
          ${_gdDow?`<div class="card-date-dow">${_gdDow}</div>`:''}
          ${g.time?`<div class="card-time" style="font-size:9px;color:var(--acc);font-weight:700;margin-top:2px">${g.time}</div>`:''}
        </div>
        <div class="card-info">
          <div class="card-name">${esc(g.name)}</div>
          ${g.venue?`<div class="card-sub">📍 ${esc(g.venue)} ${venueLinkHtml(g.venue)}</div>`:''}
          <div class="card-meta">
            <span class="type-pill ${g.gigType||'music'}">${ti.label}</span>
            ${g.done?`<span style="color:var(--ok);font-weight:600;font-size:12px">✓ Done</span>`:g.missed?`<span style="color:var(--ink3);font-size:12px">Missed</span>`:countdownPillHtml(countdownLabel(g.date))}
            ${stars?`<span class="card-stars">${stars}</span>`:''}
            ${g.calendarAdded?`<span class="cal-badge">📅 In Calendar</span>`:''}
          </div>
        </div>
      </div>
      ${conflictHtml}
      ${(!g.done&&!g.missed)?renderGymPlansRow(g.date):''}
    </div>
  </div>`;
}

// ── Trip card day breakdown (GIG-037) ───────────────────────────────
// Two independent collapse levels, both collapsed by default:
// 1. _expandedTripCards — whether a trip card shows its day list at all
// 2. _expandedTripCardDays — whether one specific day within an expanded
//    trip card shows its item list (keyed 'tripId:dayId' since day ids
//    aren't unique across trips)
let _expandedTripCards=null;
let _expandedTripCardDays=null;
function toggleTripCardExpand(tripId){
  if(!_expandedTripCards) _expandedTripCards=new Set();
  if(_expandedTripCards.has(tripId)) _expandedTripCards.delete(tripId); else _expandedTripCards.add(tripId);
  render();
}
function toggleTripCardDay(tripId,dayId){
  if(!_expandedTripCardDays) _expandedTripCardDays=new Set();
  const key=tripId+':'+dayId;
  if(_expandedTripCardDays.has(key)) _expandedTripCardDays.delete(key); else _expandedTripCardDays.add(key);
  render();
}
// v7.13 (GIG-038): now includes linked gigs — the previous version only
// counted day.items, so a trip with a gig linked to one of its days
// undercounted (and, worse, that gig never appeared in the expanded
// mini day-card at all — see renderTripDaysBreakdown below).
function tripItemCount(t){
  const d=getData();
  const linkedGigs=(d.events||[]).filter(e=>e.type==='gig'&&!e._deleted&&e.tripId===t.id);
  const itemsCount=(t.days||[]).reduce((sum,day)=>sum+(day.items||[]).filter(it=>!it._placeholder).length,0);
  return itemsCount+linkedGigs.length;
}
// Items in day/time order (position order from the Trip Details view —
// see sortDayTimeline, GIG-036), with times shown where set.
function renderMiniDayItems(items,tripId,dayId){
  if(!items.length) return `<div class="mini-day-items"><div style="font-size:11px;color:var(--ink4);padding:4px 0">No items yet</div></div>`;
  let html=`<div class="mini-day-items">`;
  sortDayTimeline(items).forEach(it=>{
    const tm=it._linkedGig?(it.time||null):itemTime(it);
    const icon=it._linkedGig?gigTypeInfo(it.gigType||'music').icon:typeIcon(it.type);
    // v7.16 (GIG-040): map-link icon, matching every other spot GIG-039
    // added this to — this mini day-card breakdown was the one place
    // that rollout missed. Linked gigs use their own venue field since
    // itemLocationName() only knows about trip item types.
    const locName=it._linkedGig?(it.venue||''):itemLocationName(it);
    const locLink=locName?venueLinkHtml(locName):'';
    // Icon/text launches to the item's edit form or the gig's detail
    // view — same "launch to edit" treatment as the timeline strip and
    // Day View item cards. Ghosts go to their origin day instead, same
    // reasoning as renderTlStrip.
    const click=it._linkedGig?`openGigDetail('${esc(it.id)}')`:
                it._ghost?`openDayView('${esc(tripId)}','${esc(it._sourceDayId||'')}')`:
                `openEditItem('${esc(tripId)}','${esc(dayId)}','${esc(it.id)}')`;
    // Food's display name already includes its venue ("Dinner —
    // Restaurant"), since a food item's venue IS its name field — showing
    // locName too would just repeat it. Every other type keeps a
    // genuinely separate name vs. location.
    const showLoc=locName&&it.type!=='food';
    html+=`<div class="mini-item-row" style="cursor:pointer" onclick="event.stopPropagation();${click}">
      <span class="mini-item-icon">${icon}</span>
      <span class="mini-item-name">${esc(itemDisplayName(it))}</span>
      ${showLoc?`<span class="mini-item-loc">${esc(locName)}</span>`:''}
      ${tm?`<span class="mini-item-time">${tm}</span>`:''}
      ${locLink}
    </div>`;
  });
  return html+`</div>`;
}
// The trip card's day-breakdown block: a toggle line ("N days · M items")
// and, once expanded, one mini day-card per day — each independently
// collapsible down to its item list, collapsed by default.
function renderTripDaysBreakdown(t){
  const dayCount=(t.days||[]).length;
  if(!dayCount) return '';
  const d=getData();
  const linkedGigs=(d.events||[]).filter(e=>e.type==='gig'&&!e._deleted&&e.tripId===t.id);
  const itemCount=tripItemCount(t);
  // Auto-expand (no manual tap needed) whenever "Hide trip gigs" is on —
  // that setting removes trip-linked gigs from the flat list, so the
  // trip's own breakdown needs to carry that visibility instead. Manual
  // per-trip expand still works independently when the setting is off.
  const isExpanded=_hideTripGigs||(_expandedTripCards&&_expandedTripCards.has(t.id));
  const toggleChevron=_hideTripGigs?'▾':(isExpanded?'▾':'▸');
  const toggleClick=_hideTripGigs?'':` onclick="event.stopPropagation();toggleTripCardExpand('${esc(t.id)}')"`;
  let html=`<div class="trip-days-toggle"${toggleClick}>
    <span>${toggleChevron} ${dayCount} day${dayCount!==1?'s':''} · ${itemCount} item${itemCount!==1?'s':''}</span>
  </div>`;
  if(isExpanded){
    let sortedDays=(t.days||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    // "Hide trip gigs" also drops days that have already gone — but only
    // in Upcoming. Past intentionally shows every day, since they're all
    // "gone" there by definition and filtering would hide everything.
    if(_hideTripGigs&&_tab==='upcoming'){
      const today=todayISO();
      sortedDays=sortedDays.filter(day=>day.date>=today);
    }
    const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    html+=`<div class="trip-days-mini">`;
    sortedDays.forEach(day=>{
      const realItems=(day.items||[]).filter(it=>!it._placeholder);
      // v7.13 (GIG-038): merge in gigs linked to this trip that fall on
      // this day — previously omitted entirely, so a linked gig never
      // showed up in its expanded day here even though it does in the
      // Trip Details day view.
      const gigsThisDay=linkedGigs.filter(g=>g.date===day.date).map(g=>({...g,_linkedGig:true}));
      const allDayItems=[...realItems,...gigsThisDay];
      const dObj=new Date(day.date+'T00:00:00');
      const dayKey=t.id+':'+day.id;
      // Same auto-expand rule as the trip-level toggle above — "Hide trip
      // gigs" forces every day's item list open too, not just the day
      // headers, since that's the whole point of hiding gigs from the
      // flat list: their detail needs to be visible here instead.
      const dayExpanded=_hideTripGigs||(_expandedTripCardDays&&_expandedTripCardDays.has(dayKey));
      const dayToggleClick=_hideTripGigs?'':` onclick="event.stopPropagation();toggleTripCardDay('${esc(t.id)}','${esc(day.id)}')"`;
      html+=`<div class="mini-day-card">
        <div class="mini-day-hdr"${dayToggleClick}>
          <span class="mini-day-num">${day.dayNumber}</span>
          <span class="mini-day-date">${fmtDateShort(day.date)} ${dow[dObj.getDay()]}</span>
          <span class="mini-day-count">${allDayItems.length} item${allDayItems.length!==1?'s':''}</span>
          <span class="mini-day-chevron">${dayExpanded?'▾':'▸'}</span>
        </div>
        ${dayExpanded?renderMiniDayItems(allDayItems,t.id,day.id):''}
      </div>`;
    });
    html+=`</div>`;
  }
  return html;
}

function renderTripCard(t, d){
  const nights=tripNights(t);
  const sc=t.status==='Completed'?'sp-completed':t.status==='Booked'?'sp-booked':t.status==='Cancelled'?'sp-cancelled':'sp-planning';
  const hasReview=t.review&&t.review.rating;
  const stars=hasReview?'★'.repeat(t.review.rating)+'☆'.repeat(5-t.review.rating):'';
  // Gigs linked to this trip
  const linkedGigs=(d.events||[]).filter(e=>e.type==='gig'&&!e._deleted&&e.tripId===t.id);
  const gigsHtml=linkedGigs.length
    ?`<div class="trip-gigs-row">🎸 <span>${linkedGigs.map(g=>`<span class="trip-gig-badge">${esc(g.name)}</span>`).join(' ')}</span></div>`:'';

  let tripConflictHtml='';
  if(t.status!=='Cancelled'&&t.status!=='Completed'){
    const overlapTrips=tripsOverlapping(t.id, t.startDate, t.endDate, d);
    const unlinked=unlinkedGigsInTrip(t.id, t.startDate, t.endDate, d);
    if(overlapTrips.length)
      tripConflictHtml+=`<div class="conflict-banner"><span>⚠️</span><span>Overlaps with trip: <strong>${esc(overlapTrips.map(x=>x.name).join(', '))}</strong></span></div>`;
    if(unlinked.length)
      tripConflictHtml+=`<div class="conflict-banner"><span>⚠️</span><span>Unlinked event${unlinked.length>1?'s':''} during trip: <strong>${unlinked.map(g=>`<span style="text-decoration:underline;cursor:pointer" onclick="event.stopPropagation();linkGigToTrip('${esc(g.id)}','${esc(t.id)}',null)" title="Tap to link this gig to the trip">${esc(g.name)}</span>`).join(', ')}</strong></span></div>`;
  }

  // Date block for trips: show start day/month + nights count
  const _ts=t.startDate?new Date(t.startDate+'T00:00:00'):null;
  const _tsDay=_ts?_ts.getDate():'—';
  const _tsMon=_ts?_ts.toLocaleDateString('en-GB',{month:'short'}).toUpperCase():'';
  const _teDay=t.endDate?new Date(t.endDate+'T00:00:00').getDate():'';
  const _teMon=t.endDate?new Date(t.endDate+'T00:00:00').toLocaleDateString('en-GB',{month:'short'}).toUpperCase():'';
  const _sameMonth=_tsMon===_teMon;
  return `<div class="event-card${t.status==='Completed'||t.status==='Cancelled'?' past':''}${hasReview?' reviewed':''}" onclick="openTripDetail('${esc(t.id)}')">
    <div class="card-body">
      <div class="card-top">
        <div class="card-date-block">
          <div style="font-size:16px;line-height:1;margin-bottom:2px">${tripIcon(t)}</div>
          <div class="card-date-day">${_tsDay}</div>
          <div class="card-date-mon">${_tsMon}</div>
          ${t.endDate?`<div class="card-date-range">${_sameMonth?'–'+_teDay:'–'+_teDay+' '+_teMon}</div>`:''}
        </div>
        <div class="card-info">
          <div class="card-name">${esc(t.name)}</div>
          ${t.destination?`<div class="card-sub">📍 ${esc(t.destination)} ${venueLinkHtml(t.destination)}</div>`:''}
          <div class="card-meta">
            <span class="status-pill ${sc}">${esc(t.status||'Planning')}</span>
            ${countdownPillHtml(tripCountdownLabel(t))}
            ${stars?`<span class="card-stars">${stars}</span>`:''}
            <span style="font-size:11px;color:var(--ink3)">${nights} night${nights!==1?'s':''}</span>
            ${t.currency&&t.currency!=='GBP'?`<span>${sym(t.currency)}</span>`:''}
            <span style="font-size:11px;color:var(--ink3)">${tripTypeInfo(t.tripType).icon} ${tripTypeInfo(t.tripType).label}</span>
            ${t.calendarAdded?`<span class="cal-badge">📅 In Calendar</span>`:''}
          </div>
        </div>
      </div>
      ${tripConflictHtml}
    </div>
    ${gigsHtml}
    ${(t.status!=='Completed'&&t.status!=='Cancelled')?renderGymPlansInRange(t.startDate,t.endDate):''}
    ${renderTripDaysBreakdown(t)}
  </div>`;
}

// GIG-049: "+ Create new trip…" in the gig form's trip picker. Selecting
// it reveals a small inline name/dates panel rather than opening a
// second modal — showModal() replaces the current modal's whole
// innerHTML, which would wipe out anything already typed into the gig
// form itself. quickCreateTrip() saves the trip immediately (independent
// of whether the gig form itself ends up being saved or cancelled), so
// this doubles as the only way to create a trip at all now that the FAB
// goes straight to the gig form — cancel out of the gig afterward and
// the trip you just created is still there.
function handleGfTripChange(){
  const sel=document.getElementById('gfTripId');
  const panel=document.getElementById('gfNewTripPanel');
  if(!sel||!panel) return;
  if(sel.value==='__new__'){ panel.style.display='block'; }
  else { panel.style.display='none'; checkGigFormConflicts(); }
}
function quickCreateTrip(){
  const name=document.getElementById('gfNewTripName')?.value.trim();
  const sd=document.getElementById('gfNewTripStart')?.value;
  const ed=document.getElementById('gfNewTripEnd')?.value;
  const err=document.getElementById('gfNewTripErr');
  if(!name||!sd||!ed){ if(err) err.textContent='Name and both dates are required'; return; }
  if(ed<sd){ if(err) err.textContent='End date must be on or after start date'; return; }
  if(err) err.textContent='';

  const t={id:uid('gat'),type:'trip',createdAt:new Date().toISOString(),
    name,destination:'',startDate:sd,endDate:ed,status:'Planning',currency:'GBP',
    notes:'',tripType:'holiday',budget:null,tripLevelCosts:[],reviews:[],days:[],
    updatedAt:new Date().toISOString()};
  generateDays(t); // safe standalone — a fresh trip with days:[] never hits the "removed days" confirm() path
  saveEvent(t);

  // Insert into the still-open gig form's trip select without rebuilding
  // the rest of the form (which would lose whatever's already typed in).
  const sel=document.getElementById('gfTripId');
  if(sel){
    const opt=document.createElement('option');
    opt.value=t.id; opt.textContent=t.name;
    sel.insertBefore(opt,sel.querySelector('option[value="__new__"]'));
    sel.value=t.id;
  }
  document.getElementById('gfNewTripPanel').style.display='none';
  ['gfNewTripName','gfNewTripStart','gfNewTripEnd'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  showToast('Trip created ✓ — linked to this event');
  checkGigFormConflicts();
}

function checkGigFormConflicts(){
  const el=document.getElementById('gfConflict'); if(!el) return;
  const date=document.getElementById('gfDate')?.value;
  const time=getTimePicker('gfTime');
  const linkedTripId=document.getElementById('gfTripId')?.value||null;

  if(!date){ el.innerHTML=''; return; }

  const d=getData();
  // Use the id of the gig being edited (if any) to exclude self from same-date check
  const selfId=_editGigId||null;

  const tripClashes=gigsConflictingTrips(date, linkedTripId, d);
  const gigClashes=gigsOnSameDate(selfId, date, d);
  const dayOff=needsDayOff(date, time);

  let html='';
  if(tripClashes.length){
    html+=`<div class="conflict-banner"><span>⚠️</span><span>This date clashes with trip: <strong>${esc(tripClashes.map(t=>t.name).join(', '))}</strong></span></div>`;
  }
  if(gigClashes.length){
    html+=`<div class="conflict-banner"><span>⚠️</span><span>Another event on this date: <strong>${esc(gigClashes.map(g=>g.name+(g.time?' ('+g.time+')':'')).join(', '))}</strong></span></div>`;
  }
  if(dayOff){
    html+=`<div class="dayoff-banner"><span>📅</span><span>Weekday before 6pm — you may need a day off</span></div>`;
  }
  el.innerHTML=html;
}

// GIG-048: generates `count` dates starting from startDate at the given
// frequency (the first date IS startDate itself, matching how the gig
// form's own date field becomes occurrence #1). Monthly uses setMonth,
// which correctly rolls a 31st into whatever the next month's last valid
// day is via JS's own date normalisation — acceptable for this use case
// rather than a bespoke "same weekday of month" rule.
function generateRecurrenceDates(startDate,freq,count){
  const dates=[];
  const d=new Date(startDate+'T00:00:00');
  for(let i=0;i<count;i++){
    dates.push(localDateStr(d));
    if(freq==='weekly') d.setDate(d.getDate()+7);
    else if(freq==='biweekly') d.setDate(d.getDate()+14);
    else if(freq==='monthly') d.setMonth(d.getMonth()+1);
  }
  return dates;
}

function saveGig(){
  const name=document.getElementById('gfName')?.value.trim();
  const date=document.getElementById('gfDate')?.value;
  const err=document.getElementById('gfErr');
  if(!name||!date){ if(err) err.textContent='Name and date are required'; return; }

  const d=getData();
  const isNew=!_editGigId;
  let g=isNew?{id:uid('gat'),type:'gig',createdAt:new Date().toISOString(),done:false,missed:false,addedBy:_currentUserKey}
              :{...getEvent(_editGigId)};
  g.gigType=_editGigType;
  g.name=name;
  g.date=date;
  g.time=getTimePicker('gfTime');
  g.venue=document.getElementById('gfVenue')?.value.trim()||'';
  g.ticketUrl=document.getElementById('gfTicketUrl')?.value.trim()||'';
  g.ticketPrice=parseFloat(document.getElementById('gfTicketPrice')?.value||0)||0;
  g.ticketNote=document.getElementById('gfTicketNote')?.value.trim()||'';
  // GIG-049: '__new__' is the "+ Create new trip…" sentinel — if someone
  // selects it but saves the gig without actually finishing the inline
  // create-trip panel (quickCreateTrip), treat it as not-linked rather
  // than saving a tripId that doesn't point at a real trip.
  const rawTripId=document.getElementById('gfTripId')?.value||null;
  g.tripId=(rawTripId&&rawTripId!=='__new__')?rawTripId:null;
  g.notes=document.getElementById('gfNotes')?.value.trim()||'';
  g.updatedAt=new Date().toISOString();

  // Save venue to venues list (as {name, mapUrl} object)
  let newVenueFromGig=null;
  if(g.venue){
    const venues=normaliseVenues(d.venues);
    if(!venues.find(x=>x.name.toLowerCase()===g.venue.toLowerCase())){
      newVenueFromGig={id:venueId(g.venue),name:g.venue,mapUrl:'',updatedAt:new Date().toISOString()};
      venues.push(newVenueFromGig);
      venues.sort((a,b)=>a.name.localeCompare(b.name));
    }
    d.venues=venues;
  }

  const i=d.events.findIndex(e=>e.id===g.id);
  if(i>=0) d.events[i]=g; else d.events.push(g);
  saveData(d);
  if(newVenueFromGig) syncVenueNow(newVenueFromGig);
  pushEvent(g);
  // Auto-open Google Calendar for new gigs and set the flag immediately.
  // window.open must be called before closeModal() to stay within the
  // user-gesture stack — browsers block popups called asynchronously.
  if(isNew){
    g.calendarAdded=true;
    g.updatedAt=new Date().toISOString();
    saveEvent(g);
    window.open(gcalGigUrl(g),'_blank','noopener');
  }

  // GIG-048: generate the rest of a recurring series, if requested. Only
  // ever runs for a brand-new gig — editing an existing occurrence never
  // re-triggers this, so there's no risk of accidentally duplicating a
  // series on a routine edit. The first occurrence (g, above) already
  // has its own calendarAdded/Google Calendar tab; the rest start with
  // calendarAdded:false like any normal gig, addable individually from
  // their own detail view — opening a browser tab per occurrence would
  // be blocked as a popup storm anyway.
  let seriesCount=0;
  if(isNew){
    const freq=document.getElementById('gfRepeatFreq')?.value||'none';
    if(freq!=='none'){
      const countRaw=parseInt(document.getElementById('gfRepeatCount')?.value||'6',10);
      const count=Math.min(52,Math.max(2,countRaw||6));
      const seriesId=uid('gat');
      const dates=generateRecurrenceDates(date,freq,count);
      g.seriesId=seriesId; g.seriesIndex=0;
      saveEvent(g);
      dates.slice(1).forEach((occDate,idx)=>{
        const occ={...g,id:uid('gat'),date:occDate,seriesIndex:idx+1,calendarAdded:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
        delete occ.review; // a review belongs to one specific occurrence, not the whole series
        saveEvent(occ);
      });
      seriesCount=count;
    }
  }

  closeModal();
  showToast(isNew?(seriesCount>1?`${seriesCount} events added ✓ (first one's Google Calendar opened)`:'Gig added ✓ — Google Calendar opened'):'Gig updated ✓');

  // GIG-043: if this gig was added from inside a trip's day view, return
  // there instead of the plain list so the new gig is immediately visible
  // alongside the trip's other items.
  const returnTo=_gigFormReturnTo;
  _gigFormPrefillDate=null; _gigFormPrefillTripId=null; _gigFormReturnTo=null;
  if(returnTo&&returnTo.view==='dayView'&&getEvent(returnTo.tripId)){
    render(); openDayView(returnTo.tripId,returnTo.dayId);
  } else if(!isNew){
    // Render the list first so the card is up-to-date when the modal is dismissed,
    // then open the detail modal on top — user sees correct emoji/type immediately.
    render();
    openGigDetail(g.id);
  } else {
    render();
  }

  // Day-off notification
  if(isNew&&needsDayOff(date,g.time)){
    setTimeout(()=>showToast(`📅 ${name} is a weekday — check if you need a day off`),1500);
  }
}

// GIG-048: lists every occurrence in a recurring series, tap one to open
// its own detail view (which itself links back here) — a lightweight way
// to browse a series without needing a dedicated "series" data screen.
function showSeriesList(seriesId){
  const occurrences=getGigs().filter(g=>g.seriesId===seriesId).sort((a,b)=>(a.seriesIndex||0)-(b.seriesIndex||0));
  const rows=occurrences.map(g=>`<div class="vlib-item" style="cursor:pointer" onclick="closeModal();openGigDetail('${esc(g.id)}')">
    <span class="vlib-name">Event ${(g.seriesIndex||0)+1} — ${fmtDateShort(g.date)}${g.done?' · Done':g.missed?' · Missed':''}</span>
  </div>`).join('');
  showModal(`<div class="modal-hdr"><div class="modal-title">Repeating series</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${rows}</div>`);
}
function confirmDeleteGig(id){
  const g=getEvent(id); if(!g) return;
  // GIG-048: a recurring series gig gets a 3-way choice instead of the
  // plain confirm() below — deleting "all future" only touches this
  // occurrence and later ones (by seriesIndex), never earlier ones, so
  // history stays intact regardless of which occurrence you delete from.
  if(g.seriesId){
    showModal(`<div class="modal-hdr"><div class="modal-title">Delete "${esc(g.name)}"</div><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--ink2);margin-bottom:14px">This event is part of a repeating series.</p>
        <button class="btn btn-danger" style="width:100%;margin-bottom:10px" onclick="deleteGigSeries('${esc(id)}',false)">Delete just this one</button>
        <button class="btn btn-danger" style="width:100%;margin-bottom:10px" onclick="deleteGigSeries('${esc(id)}',true)">Delete this and all future in the series</button>
        <button class="btn btn-ghost" style="width:100%" onclick="closeModal()">Cancel</button>
      </div>`);
    return;
  }
  if(!confirm(`Delete "${g.name}"?`)) return;
  deleteEvent(id); closeModal(); showToast('Gig deleted'); render();
}
function deleteGigSeries(id,includeFuture){
  const g=getEvent(id); if(!g) return;
  if(includeFuture&&g.seriesId){
    const toDelete=getGigs().filter(x=>x.seriesId===g.seriesId&&(x.seriesIndex||0)>=(g.seriesIndex||0));
    toDelete.forEach(x=>deleteEvent(x.id));
    showToast(`${toDelete.length} event${toDelete.length!==1?'s':''} deleted`);
  } else {
    deleteEvent(id);
    showToast('Gig deleted');
  }
  closeModal(); render();
}

    venueRating:getStarVal('starVenue')||null,
    again:document.getElementById('revAgain')?.value||'',
    note:document.getElementById('revNote')?.value.trim()||'',

  g.done=true; g.updatedAt=new Date().toISOString();

function saveTrip(existingId){
  const name=document.getElementById('tfName')?.value.trim();
  const sd=document.getElementById('tfStart')?.value;
  const ed=document.getElementById('tfEnd')?.value;
  const err=document.getElementById('tfErr');
  if(!name||!sd||!ed){ if(err) err.textContent='Name and dates are required'; return; }
  if(ed<sd){ if(err) err.textContent='End date must be on or after start date'; return; }

  const isNew=!existingId;
  let t=isNew?{id:uid('gat'),type:'trip',days:[],reviews:[],createdAt:new Date().toISOString()}
              :{...getEvent(existingId)};
  const prevSd=t.startDate, prevEd=t.endDate;
  t.name=name;
  t.destination=document.getElementById('tfDest')?.value.trim()||'';
  t.startDate=sd; t.endDate=ed;
  t.status=document.getElementById('tfStatus')?.value||'Planning';
  t.currency=document.getElementById('tfCurrency')?.value||'GBP';
  t.notes=document.getElementById('tfNotes')?.value.trim()||'';
  t.tripType=document.getElementById('tfTripType')?.value||'holiday';
  const budgetRaw=document.getElementById('tfBudget')?.value;
  t.budget=budgetRaw!==''&&budgetRaw!=null?parseFloat(budgetRaw):null;
  if(!t.tripLevelCosts) t.tripLevelCosts=[];
  t.updatedAt=new Date().toISOString();
  if(!t.days) t.days=[];

  // Auto-generate days if date range changed or new
  if(isNew||(prevSd!==sd||prevEd!==ed)){
    const added=generateDays(t);
    if(added===-1) return; // user cancelled removal of content days — abort save
    const removed=(prevSd&&prevEd)?
      // count how many original days fell outside the new range
      (t._prevDayCount||0) : 0;
    showToast(isNew
      ?`Trip added · ${added} day${added!==1?'s':''} added`
      :'Trip updated ✓');
  } else {
    showToast('Trip updated ✓');
  }

  // Auto-open Google Calendar for new trips and set the flag.
  // Must happen before closeModal() to stay in the user-gesture stack.
  if(isNew&&t.startDate&&t.endDate){
    t.calendarAdded=true;
    t.updatedAt=new Date().toISOString();
    window.open(gcalTripUrl(t),'_blank','noopener');
    copyTripItineraryToClipboard(t); // GIG-036 — see markCalendarAdded for the repeat-send path
  }
  saveEvent(t); closeModal();
  if(!isNew){ _view='tripDetail'; openTripDetail(t.id,_curTripTab); }
  else{ _view='tripDetail'; _curTripId=t.id; openTripDetail(t.id,'itinerary'); }
}

// Returns true if a day has any real (non-placeholder) content worth warning about
function dayHasContent(day){
  if(day.notes&&day.notes.trim()) return true;
  return (day.items||[]).some(it=>!it._placeholder);
}

function generateDays(trip){
  const existing=trip.days||[];

  // ── Step 1: Remove days outside the new date range ───────────────
  const inRange=existing.filter(d=>d.date>=trip.startDate&&d.date<=trip.endDate);
  const removed=existing.filter(d=>d.date<trip.startDate||d.date>trip.endDate);

  // Warn if any removed days have real content (items/notes)
  const contentDays=removed.filter(dayHasContent);
  if(contentDays.length){
    const dateList=contentDays.map(d=>fmtDateShort(d.date)).join(', ');
    const ok=confirm(
      `Shortening this trip will remove ${removed.length} day${removed.length!==1?'s':''}, `+
      `including ${contentDays.length} with saved content (${dateList}).

Remove these days?`
    );
    if(!ok){
      // User cancelled — restore original days and abort: caller checks return value
      trip.days=existing;
      return -1; // sentinel: caller should abort save
    }
  }

  // ── Step 2: Add new days for dates not yet present ───────────────
  const dates=new Set(inRange.map(d=>d.date));
  // Renumber cleanly from 1 after pruning
  const cur=new Date(trip.startDate+'T00:00:00');
  const end=new Date(trip.endDate+'T00:00:00');
  let added=0;
  while(cur<=end){
    const ds=localDateStr(cur);
    if(!dates.has(ds)){
      inRange.push({id:genId(),date:ds,notes:'',items:[
        {id:genId(),type:'food',subtype:'Breakfast',name:'',_placeholder:true,cost:0,costActual:null,completed:false,review:null,order:0},
        {id:genId(),type:'food',subtype:'Lunch',name:'',_placeholder:true,cost:0,costActual:null,completed:false,review:null,order:1},
        {id:genId(),type:'food',subtype:'Dinner',name:'',_placeholder:true,cost:0,costActual:null,completed:false,review:null,order:2},
      ]});
      added++;
    }
    cur.setDate(cur.getDate()+1);
  }

  // ── Step 3: Sort and renumber sequentially ────────────────────────
  inRange.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  inRange.forEach((d,i)=>{ d.dayNumber=i+1; });
  trip.days=inRange;
  return added;
}

function confirmDeleteTrip(id){
  const t=getEvent(id); if(!t) return;
  if(!confirm(`Delete "${t.name}" and all its days?`)) return;
  deleteEvent(id); closeModal(); _view='list'; showListNav(); showToast('Trip deleted'); render();
}

function renderTlStrip(items,tripId,dayId){
  let html=`<div class="tl-strip">`;
  items.forEach((it,i)=>{
    const icon=it._linkedGig?gigTypeInfo(it.gigType||'music').icon:typeIcon(it.type);
    const name=it._linkedGig?it.name:(it.type==='food'?(it.subtype||'Food'):it.name||typeLabel(it.type));
    // Icon/text now launches straight to the item's edit form (or the
    // gig's detail view) — previously a real item just reopened the
    // whole day view, which was a no-op when the strip was already
    // shown there. Ghost stays keep navigating to their origin day,
    // since a ghost isn't a real editable record of its own.
    const click=it._linkedGig?`onclick="event.stopPropagation();openGigDetail('${esc(it.id)}')"`:
                it._ghost?`onclick="event.stopPropagation();openDayView('${esc(tripId)}','${esc(it._sourceDayId||'')}')"`:
                `onclick="event.stopPropagation();openEditItem('${esc(tripId)}','${esc(dayId)}','${esc(it.id)}')"`;
    html+=`<div class="tl-node ${it._linkedGig?'tl-gig-node':''}" ${click}>
      <div class="tl-icon${it.completed?' done':''}">
        ${icon}
        ${it.completed?`<span class="tl-chk">✓</span>`:''}
      </div>
      <div class="tl-label">${esc(name)}</div>
    </div>`;
    if(i<items.length-1) html+=`<div class="tl-line"></div>`;
  });
  return html+`</div>`;
}

// "Gigs today" section (below) is collapsible, collapsed by default —
// keyed 'tripId:dayId' so state persists correctly across prev/next day
// navigation without a per-day view needing its own module variable.
let _expandedGigsToday=null;
function toggleGigsToday(tripId,dayId){
  if(!_expandedGigsToday) _expandedGigsToday=new Set();
  const key=tripId+':'+dayId;
  if(_expandedGigsToday.has(key)) _expandedGigsToday.delete(key); else _expandedGigsToday.add(key);
  // openDayView always resets panelDay's scroll via showPanel('day') —
  // same underlying issue GIG-038 fixed for trip cards. Rather than
  // change openDayView's broader contract, just capture/restore scroll
  // locally around this one re-render.
  const panel=document.getElementById('panelDay');
  const scrollPos=panel?panel.scrollTop:0;
  openDayView(tripId,dayId);
  if(panel) panel.scrollTop=scrollPos;
}
// Same collapse toggle, one level up — the trip overview's "Gigs on this
// trip" section (all gigs linked to the trip, not just one day's). Shares
// _expandedGigsToday's Set via the ':__overview' key rather than a
// separate one. openTripDetail resets panelTrip's scroll the same way
// openDayView does, so the same local capture/restore applies here too.
function toggleTripGigsOverview(tripId){
  if(!_expandedGigsToday) _expandedGigsToday=new Set();
  const key=tripId+':__overview';
  if(_expandedGigsToday.has(key)) _expandedGigsToday.delete(key); else _expandedGigsToday.add(key);
  const panel=document.getElementById('panelTrip');
  const scrollPos=panel?panel.scrollTop:0;
  openTripDetail(tripId,_curTripTab);
  if(panel) panel.scrollTop=scrollPos;
}
function openDayView(tripId,dayId,scrollToItems){

  _view='dayView'; _curTripId=tripId; _curDayId=dayId;

  showPanel('day');

  // Prev / next day navigation bar
  const sortedDays=trip.days.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const dayIdx=sortedDays.findIndex(d=>d.id===dayId);
  const prevDay=dayIdx>0?sortedDays[dayIdx-1]:null;
  const nextDay=dayIdx<sortedDays.length-1?sortedDays[dayIdx+1]:null;
  document.getElementById('dayNavBar').innerHTML=`<div style="display:flex;align-items:center;background:var(--card);border-bottom:1px solid var(--bdr);padding:8px 12px;gap:8px">

    <button ${nextDay?`onclick="openDayView('${esc(tripId)}','${esc(nextDay.id)}')"`:'disabled'} style="flex:1;padding:8px;border-radius:var(--rsm);border:1.5px solid var(--bdr);background:var(--card);font-size:13px;font-weight:600;font-family:var(--f);color:${nextDay?'var(--ink2)':'var(--ink4)'};cursor:${nextDay?'pointer':'default'}">Day ${nextDay?nextDay.dayNumber:'—'} ›</button>

      <span>🎸 Gigs today (${linkedGigs.length})</span>

            ${g.time?`<div class="linked-gig-sub">🕐 ${g.time}</div>`:''}
          </div>
          <span style="color:var(--acc);font-size:18px">›</span>

  // Ghost accommodation — multi-night stays originating from another day

          </div>
          ${perNight>0?`<div class="item-right"><span class="cost-pill">${sym(trip.currency||'GBP')}${perNight.toFixed(2)}/night</span></div>`:''}
        </div>
      </div>`;
    });
  }

  // Items — sorted by time (GIG-036), untimed first, matching the
  // timeline strip above so all three views (strip, Gigs today, Items)
  // never disagree on order. Gigs are now merged into this list too
  // (using the same highlighted linked-gig-card style, not the neutral
  // item-card one — Pete's call on GIG-043) so the day's full flow is
  // visible without expanding the still-separate, still-collapsed-by-
  // default "Gigs today" summary above.
  const itemsAndGigs=sortDayTimeline([...realItems,...linkedGigs.map(g=>({...g,_linkedGig:true}))]);
  if(itemsAndGigs.length) html+=`<div class="section-hdr">Items</div>`;
  itemsAndGigs.forEach(it=>{
    if(it._linkedGig){
      const ti=gigTypeInfo(it.gigType||'music');

          ${it.venue?`<div class="linked-gig-sub">📍 ${esc(it.venue)} ${venueLinkHtml(it.venue)}</div>`:''}
          ${it.time?`<div class="linked-gig-sub">🕐 ${it.time}</div>`:''}
        </div>
        <span style="color:var(--acc);font-size:18px">›</span>
      </div>`;
    } else {
      html+=renderItemCard(it,tripId,dayId,s,trip,day);
    }
  });

  // Meal placeholders
  if(placeholders.length){
    html+=`<div class="section-hdr" style="margin-top:${realItems.length?'8px':'18px'}">Meals</div>`;
    placeholders.forEach(it=>{
      html+=`<div class="item-card placeholder" onclick="openEditItem('${esc(tripId)}','${esc(dayId)}','${esc(it.id)}')">
        <div class="item-hdr">
          <div class="item-type-icon">🍽</div>
          <div class="item-main"><div class="item-name" style="color:var(--ink3)">${esc(it.subtype)} — tap to fill in</div></div>
        </div>
      </div>`;
    });
  }

  // Day notes
  html+=`<div class="section-hdr" style="margin-top:12px">Day notes</div>
    <textarea class="fi" id="dayNotes" placeholder="Notes for this day…" rows="3" onblur="saveDayNotes('${esc(tripId)}','${esc(dayId)}',this.value)">${esc(day.notes||'')}</textarea>`;

  // Day total — real items + per-night cost from ghost stays (continuing
  // accommodation) + ticket price of any gig linked to this day
  const ghostCost=ghosts.reduce((sum,it)=>sum+parseFloat(it.costPerNight||0),0);
  const gigCostToday=linkedGigs.reduce((sum,g)=>sum+parseFloat(g.ticketPrice||0),0);
  const dayCost=realItems.filter(it=>!it._placeholder).reduce((sum,it)=>{
    const c=it.costActual!=null?it.costActual:(it.type==='accommodation'?parseFloat(it.costPerNight||0)*parseInt(it.nights||1):parseFloat(it.cost||0));
    return sum+c;
  },0)+ghostCost+gigCostToday;
  if(dayCost>0) html+=`<div style="text-align:right;padding:12px 0;font-size:14px;font-weight:700;color:var(--ink2)">Day total: ${s}${dayCost.toFixed(2)}</div>`;

  html+=`</div>`;
  document.getElementById('dayContent').innerHTML=html;
}

function getAccGhosts(trip,dayId){
  const day=trip.days.find(d=>d.id===dayId); if(!day) return [];
  const dayDate=new Date(day.date+'T00:00:00');
  const ghosts=[];
  trip.days.forEach(d=>{
    if(d.id===dayId) return;
    (d.items||[]).forEach(it=>{
      if(it.type!=='accommodation'||!it.isAccParent) return;
      const nights=parseInt(it.nights||1); if(nights<=1) return;
      const sd=new Date(d.date+'T00:00:00');
      const ed=new Date(sd); ed.setDate(ed.getDate()+nights-1);
      if(dayDate>sd&&dayDate<=ed){
        const nightNum=Math.round((dayDate-sd)/86400000)+1;
        ghosts.push({...it,_ghost:true,_nightNum:nightNum,_sourceDayId:d.id});
      }
    });
  });
  return ghosts;
}

function toggleItemDetail(id){

function toggleDone(tripId,dayId,itemId){
  const trip=getEvent(tripId); if(!trip) return;
  const day=trip.days.find(d=>d.id===dayId); if(!day) return;
  const it=day.items.find(i=>i.id===itemId); if(!it) return;
  it.completed=!it.completed; it.completedAt=it.completed?new Date().toISOString():null;
  trip.updatedAt=new Date().toISOString();

}

function saveDayNotes(tripId,dayId,val){
  const trip=getEvent(tripId); if(!trip) return;

  day.notes=val; trip.updatedAt=new Date().toISOString(); saveEvent(trip);
}

// ── Add day ──
function addDay(tripId){
  const trip=getEvent(tripId); if(!trip) return;
  const n=trip.days.length;
  const lastDate=n?trip.days[n-1].date:null;
  const nextDate=lastDate?localDateStr(new Date(new Date(lastDate+'T00:00:00').getTime()+86400000)):trip.startDate||localDateStr(new Date());
  const newDay={id:genId(),dayNumber:(n?Math.max(...trip.days.map(d=>d.dayNumber||1)):0)+1,date:nextDate,notes:'',items:[
    {id:genId(),type:'food',subtype:'Breakfast',name:'',_placeholder:true,cost:0,costActual:null,completed:false,review:null,order:0},
    {id:genId(),type:'food',subtype:'Lunch',name:'',_placeholder:true,cost:0,costActual:null,completed:false,review:null,order:1},
    {id:genId(),type:'food',subtype:'Dinner',name:'',_placeholder:true,cost:0,costActual:null,completed:false,review:null,order:2},
  ]};
  trip.days.push(newDay);
  trip.days.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  trip.updatedAt=new Date().toISOString();
  saveEvent(trip); showToast('Day added'); openTripDetail(tripId,'itinerary');
}

function confirmDeleteDay(tripId,dayId){
  if(!confirm('Delete this day and all its items?')) return;
  const trip=getEvent(tripId); if(!trip) return;
  trip.days=trip.days.filter(d=>d.id!==dayId);
  trip.updatedAt=new Date().toISOString();
  saveEvent(trip); closeModal(); _view='tripDetail'; openTripDetail(tripId,'itinerary');
}

// GIG-043: link an already-existing (unlinked) gig to this trip, either
// via the picker below or a one-tap action from the conflict-banner
// warning on the trip card. Only offers gigs with no tripId set at all —
// reassigning a gig that's already linked to a *different* trip stays a
// deliberate action on the gig's own edit form, not a one-tap here.
// includePast defaults to false — only future/today gigs shown, closest
// to today at the top. The toggle button re-opens the same picker with
// past gigs included, sorted the same ascending way (oldest-of-the-past
// first), rather than mixing past and future in one date-distance sort.
function showLinkGigPicker(tripId,dayId,includePast){
  const trip=getEvent(tripId); if(!trip) return;
  const today=todayISO();
  let candidates=getGigs().filter(g=>!g.tripId);
  if(!includePast) candidates=candidates.filter(g=>g.date>=today);
  candidates.sort((a,b)=>a.date.localeCompare(b.date));
  const toggleBtn=`<button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="showLinkGigPicker('${esc(tripId)}',${dayId?`'${esc(dayId)}'`:'null'},${includePast?'false':'true'})">${includePast?'Hide past gigs':'Show past gigs too'}</button>`;
  if(!candidates.length){
    showModal(`<div class="modal-hdr"><div class="modal-title">Link an existing gig</div><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body"><div style="font-size:13px;color:var(--ink3);text-align:center;padding:20px 0">${includePast?'No unlinked gigs to choose from.':'No upcoming unlinked gigs to choose from.'}</div>${toggleBtn}</div>`);
    return;
  }
  const rows=candidates.slice(0,30).map(g=>{
    const inRange=trip.startDate&&trip.endDate&&g.date>=trip.startDate&&g.date<=trip.endDate;
    return `<div class="vlib-item" style="cursor:pointer" onclick="linkGigToTrip('${esc(g.id)}','${esc(tripId)}',${dayId?`'${esc(dayId)}'`:'null'})">
      <span class="vlib-name">${esc(g.name)} <span style="color:var(--ink3);font-weight:400">— ${fmtDateShort(g.date)}${inRange?' · in trip range':''}</span></span>
      <span style="color:var(--acc);font-size:13px;font-weight:600">Link</span>
    </div>`;
  }).join('');
  showModal(`<div class="modal-hdr"><div class="modal-title">Link an existing gig</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${rows}${toggleBtn}</div>`);
}
function linkGigToTrip(gigId,tripId,dayId){

    fields+=`<div class="fg"><label>Name *</label><input class="fi" id="ifName" placeholder="e.g. Sagrada Família" value="${esc(it?.name||'')}"></div>
      ${venuePickerFieldHtml('Location / address', it?.location, 'ifLocation', 'ifLocationDrop')}
      <div class="fg"><label>Time (optional)</label>${timePickerHtml('ifTime',it?.time)}</div>`;
  } else { // other
    fields+=`<div class="fg"><label>Description</label><input class="fi" id="ifName" placeholder="What is this?" value="${esc(it?.desc||it?.name||'')}"></div>
      ${venuePickerFieldHtml('Location / venue (optional)', it?.venue, 'ifLocation', 'ifLocationDrop')}
      <div class="fg"><label>Time (optional)</label>${timePickerHtml('ifTime',it?.time)}</div>
      <div class="fi-row">
        <div class="fg"><label>Cost (${s})</label><input class="fi" type="number" step="0.01" id="ifCost" value="${it?.cost||''}"></div>
        <div class="fg"><label>Actual (${s})</label><input class="fi" type="number" step="0.01" id="ifCostActual" value="${it?.costActual!=null?it.costActual:''}"></div>
      </div>`;
  }

  fields+=`<div class="fg"><label>Notes</label><textarea class="fi" id="ifNotes" rows="2">${esc(it?.notes||'')}</textarea></div>`;

  showModal(`<div class="modal-hdr"><div class="modal-title">${esc(title)}</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      ${fields}
      <div id="ifErr" class="form-err"></div>
      <div class="form-actions">
        <button class="btn btn-pri" onclick="saveItem('${esc(tripId)}','${esc(dayId)}','${esc(type)}',${it?`'${esc(it.id)}'`:'null'})">Save</button>
        ${it?`<button class="btn btn-ghost" onclick="convertItemToGig('${esc(tripId)}','${esc(dayId)}','${esc(it.id)}')">🎸 Convert to Gig</button>`:''}
      </div>
    </div>`);
  // v7.15 (GIG-039): wire the venue picker for whichever field this type
  // uses — Food's venue picker lives on the shared 'ifName' id (it IS the
  // restaurant name), every other type that has one uses 'ifLocation'.
  // v7.15 (GIG-039): matches showGigForm's own pattern — deferred a tick
  // so the modal's fresh DOM is fully settled before wiring listeners.
  setTimeout(()=>{
    if(type==='food') initVenueAC('ifName','ifNameDrop');
    else initVenueAC('ifLocation','ifLocationDrop'); // every other type now has this field
  },0);
}

function saveItem(tripId,dayId,type,existingId){
  const trip=getEvent(tripId); if(!trip) return;
  const day=trip.days.find(d=>d.id===dayId); if(!day) return;
  const err=document.getElementById('ifErr');

  const name=document.getElementById('ifName')?.value.trim()||'';
  if((type==='accommodation'||type==='attraction'||type==='keystop')&&!name){
    if(err) err.textContent='Name is required'; return;
  }

  const isNew=!existingId;
  let it=isNew?{id:genId(),type,completed:false,completedAt:null,review:null,order:day.items.length}
              :{...(day.items.find(i=>i.id===existingId)||{id:genId(),type,completed:false,completedAt:null,review:null})};

  // Remove placeholder flag if editing a placeholder
  delete it._placeholder;
  it.type=type;

  if(type==='travel'){
    it.subtype=document.getElementById('ifSubtype')?.value||'Flight';
    it.name=name; it.from=document.getElementById('ifFrom')?.value.trim()||'';
    it.to=document.getElementById('ifTo')?.value.trim()||'';
    it.venue=document.getElementById('ifLocation')?.value.trim()||'';
    it.depTime=getTimePicker('ifDepTime');
    it.cost=parseFloat(document.getElementById('ifCost')?.value||0)||0;
    it.bookingRef=document.getElementById('ifBookingRef')?.value.trim()||'';
    it.confirmNo=document.getElementById('ifConfirmNo')?.value.trim()||'';
    it.seatNo=document.getElementById('ifSeatNo')?.value.trim()||'';
    it.paid=document.getElementById('ifPaid')?.classList.contains('on')||false;
  } else if(type==='accommodation'){
    it.name=name; it.address=document.getElementById('ifLocation')?.value.trim()||'';
    it.checkin=getTimePicker('ifCheckin');
    it.checkout=getTimePicker('ifCheckout');
    it.nights=parseInt(document.getElementById('ifNights')?.value||1)||1;
    it.costPerNight=parseFloat(document.getElementById('ifCostPerNight')?.value||0)||0;
    const at=document.getElementById('ifActualTotal')?.value;
    it.actualTotal=at!==''&&at!=null?parseFloat(at):null;
    it.paymentStatus=document.getElementById('ifPaymentStatus')?.value||'unpaid';
    it.bookingRef=document.getElementById('ifBookingRef')?.value.trim()||'';
    it.isAccParent=true;
  } else if(type==='food'){
    it.subtype=document.getElementById('ifSubtype')?.value||'Dinner';
    it.name=name; it.cuisine=document.getElementById('ifCuisine')?.value.trim()||'';
    it.time=getTimePicker('ifTime');
    it.cost=parseFloat(document.getElementById('ifCost')?.value||0)||0;
    const ca=document.getElementById('ifCostActual')?.value;
    it.costActual=ca!==''&&ca!=null?parseFloat(ca):null;
    it.booked=document.getElementById('ifBooked')?.classList.contains('on')||false;
  } else if(type==='attraction'){
    it.name=name; it.location=document.getElementById('ifLocation')?.value.trim()||'';
    it.time=getTimePicker('ifTime');
    it.openingHours=document.getElementById('ifOpeningHours')?.value.trim()||'';
    it.cost=parseFloat(document.getElementById('ifCost')?.value||0)||0;
    const ca=document.getElementById('ifCostActual')?.value;
    it.costActual=ca!==''&&ca!=null?parseFloat(ca):null;
    it.bookingRef=document.getElementById('ifBookingRef')?.value.trim()||'';
    it.paid=document.getElementById('ifPaid')?.classList.contains('on')||false;
  } else if(type==='keystop'){
    it.name=name; it.location=document.getElementById('ifLocation')?.value.trim()||'';
    it.time=getTimePicker('ifTime');
  } else {
    it.desc=name; it.name=name;
    it.venue=document.getElementById('ifLocation')?.value.trim()||'';
    it.time=getTimePicker('ifTime');
    it.cost=parseFloat(document.getElementById('ifCost')?.value||0)||0;
    const ca=document.getElementById('ifCostActual')?.value;
    it.costActual=ca!==''&&ca!=null?parseFloat(ca):null;
  }
  it.notes=document.getElementById('ifNotes')?.value.trim()||'';

  // v7.15 (GIG-039): auto-add this item's venue/location to the shared
  // venues list if it's not already there — same behaviour as saving a
  // gig. The picker's own "+ Add" already handles the common case, but
  // this catches someone typing a value and hitting Save without ever
  // opening the dropdown.
  const locName=itemLocationName(it);
  let newVenueFromItem=null;
  if(locName){
    const d=getData();
    const venues=normaliseVenues(d.venues);
    if(!venues.find(x=>x.name.toLowerCase()===locName.toLowerCase())){
      newVenueFromItem={id:venueId(locName),name:locName,mapUrl:'',updatedAt:new Date().toISOString()};
      venues.push(newVenueFromItem);
      venues.sort((a,b)=>a.name.localeCompare(b.name));
      d.venues=venues;
      saveData(d);
    }
  }

  const idx=day.items.findIndex(i=>i.id===it.id);
  if(idx>=0) day.items[idx]=it; else day.items.push(it);
  trip.updatedAt=new Date().toISOString();
  saveEvent(trip); closeModal(); showToast(isNew?'Added ✓':'Updated ✓');
  if(newVenueFromItem) syncVenueNow(newVenueFromItem);

  // Return to wherever this edit was actually triggered from (v7.30) —
  // _itemFormReturnTo is only ever set by openEditItem, so a brand-new
  // item (added via the day view's own "+" menu) always falls through to
  // the openDayView default below, same as before this change.
  const returnTo=_itemFormReturnTo;
  _itemFormReturnTo=null;
  if(returnTo&&returnTo.view==='list'){
    render();
  } else if(returnTo&&returnTo.view==='tripDetail'&&returnTo.tripId===tripId){
    openTripDetail(tripId,_curTripTab);
  } else {
    openDayView(tripId,dayId);
  }
}

function deleteItem(tripId,dayId,itemId){
  if(!confirm('Delete this item?')) return;
  const trip=getEvent(tripId); if(!trip) return;
  const day=trip.days.find(d=>d.id===dayId); if(!day) return;
  day.items=day.items.filter(i=>i.id!==itemId);
  trip.updatedAt=new Date().toISOString();
  saveEvent(trip); showToast('Deleted'); openDayView(tripId,dayId);
}

// Converts a trip item into a real gig, linked back to this trip.
// One direction only (item → gig) — the reverse isn't offered, since a
// gig carries fields (ticket URL, review, done/missed) that don't have
// anywhere to go on a plain item, so demoting one would be a lossier,
// less obviously-reversible operation than promoting one.
// Field mapping: name → itemDisplayName() (keeps e.g. a food item's
// "Dinner — Restaurant" combo intact as the gig name), time/venue reuse
// the same itemTime()/itemLocationName() helpers the rest of the app
// already uses for these per-type lookups. cost/costActual have nowhere
// to go on a gig (no numeric price field) — folded into ticketNote as
// text instead of silently dropped. gigType defaults to music; the gig
// edit form opens immediately afterward so that (and anything else) can
// be corrected in the same breath rather than hunting for it later.
function convertItemToGig(tripId,dayId,itemId){
  const trip=getEvent(tripId); if(!trip) return;
  const day=trip.days.find(d=>d.id===dayId); if(!day) return;
  const it=day.items.find(i=>i.id===itemId); if(!it) return;
  if(!confirm(`Convert "${itemDisplayName(it)}" into a gig? This removes it from the trip's item list.`)) return;

  // A gig now has a real numeric ticketPrice field (added alongside "can
  // gig costs contribute to trip costs?"), so an item's cost carries
  // straight across as a number instead of being folded into ticketNote
  // as text — the trip's cost totals stay correct after conversion too.
  const costVal=parseFloat(it.costActual!=null?it.costActual:it.cost)||0;

  const g={
    id:uid('gat'), type:'gig', createdAt:new Date().toISOString(), addedBy:_currentUserKey,
    done:false, missed:false, gigType:'music',
    name:itemDisplayName(it), date:day.date, time:itemTime(it)||'',
    venue:itemLocationName(it), ticketUrl:'', ticketPrice:costVal, ticketNote:'',
    tripId:tripId, notes:it.notes||''
  };
  saveEvent(g);

  day.items=day.items.filter(i=>i.id!==itemId);
  trip.updatedAt=new Date().toISOString();
  saveEvent(trip);

  closeModal();
  showToast('Converted to gig ✓');
  render();
  openEditGig(g.id);
}

// TRIP COSTS TAB

function renderTripCosts(trip,s){
  const days=(trip.days||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const tripLevelCosts=trip.tripLevelCosts||[];
  const linkedGigs=(getData().events||[]).filter(e=>e.type==='gig'&&!e._deleted&&e.tripId===trip.id);

  // ── Day-by-day costs ──────────────────────────────────────────────
  let dayTotal=0;
  let dayRows='';
  const cats={travel:0,accommodation:0,food:0,attraction:0,gig:0,other:0};
  days.forEach(day=>{
    // Include per-night cost from ghost stays (multi-night accommodation originating on another day)
    const ghostsOnDay=getAccGhosts(trip,day.id);
    const ghostCost=ghostsOnDay.reduce((sum,it)=>sum+parseFloat(it.costPerNight||0),0);
    cats.accommodation=(cats.accommodation||0)+ghostCost;

    // Gigs linked to this trip, on this specific day — their ticket price
    // counts toward the day's total and the new "Gigs" category, same as
    // any other item type.
    const gigsOnDay=linkedGigs.filter(g=>g.date===day.date);
    const gigCost=gigsOnDay.reduce((sum,g)=>sum+parseFloat(g.ticketPrice||0),0);
    cats.gig=(cats.gig||0)+gigCost;

    const dayCost=(day.items||[]).filter(it=>!it._placeholder).reduce((sum,it)=>{
      const c=it.costActual!=null?it.costActual:(it.type==='accommodation'?parseFloat(it.costPerNight||0)*parseInt(it.nights||1):parseFloat(it.cost||0));
      return sum+c;
    },0)+ghostCost+gigCost;
    dayTotal+=dayCost;
    if(dayCost>0){
      const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const dObj=new Date(day.date+'T00:00:00');
      const extras=[];
      if(ghostCost>0) extras.push(`${s}${ghostCost.toFixed(2)} stay`);
      if(gigCost>0) extras.push(`${s}${gigCost.toFixed(2)} gig`);
      dayRows+=`<div class="cost-day-row" onclick="openDayView('${esc(trip.id)}','${esc(day.id)}')">
        <span class="cost-day-label">Day ${day.dayNumber} · ${dow[dObj.getDay()]} ${fmtDateShort(day.date)}${extras.length?` <span style="font-size:10px;color:var(--ink3)">(incl. ${extras.join(', ')})</span>`:''}</span>
        <span class="cost-day-val">${s}${dayCost.toFixed(2)}</span>
      </div>`;
    }
    (day.items||[]).filter(it=>!it._placeholder).forEach(it=>{
      const c=it.costActual!=null?it.costActual:(it.type==='accommodation'?parseFloat(it.costPerNight||0)*parseInt(it.nights||1):parseFloat(it.cost||0));
      const k=cats[it.type]!=null?it.type:'other'; cats[k]=(cats[k]||0)+c;
    });
  });

  // ── Trip-level cost total ─────────────────────────────────────────
  const tlTotal=tripLevelCosts.reduce((s,c)=>s+parseFloat(c.amount||0),0);
  const grandTotal=dayTotal+tlTotal;
  const budget=trip.budget!=null?parseFloat(trip.budget):null;
  const remaining=budget!=null?budget-grandTotal:null;
  const overBudget=remaining!=null&&remaining<0;

  // ── Budget bar ────────────────────────────────────────────────────
  let budgetBar='';
  if(budget!=null&&budget>0){
    const pct=Math.min(100,Math.round((grandTotal/budget)*100));
    const barColour=pct>=100?'var(--danger)':pct>=85?'var(--amber)':'var(--ok)';
    budgetBar=`<div style="background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);padding:14px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <span style="font-size:13px;font-weight:700;color:var(--ink)">Budget tracker</span>
        <span style="font-size:13px;font-weight:700;color:${overBudget?'var(--danger)':'var(--ok)'}">
          ${overBudget?'Over by '+s+Math.abs(remaining).toFixed(2):''+s+remaining.toFixed(2)+' remaining'}
        </span>
      </div>
      <div style="height:12px;border-radius:6px;background:var(--bdr);overflow:hidden;margin-bottom:8px">
        <div style="height:100%;width:${pct}%;background:${barColour};border-radius:6px;transition:width .4s ease"></div>
      </div>
      <div class="pa-row" style="margin-top:0">
        <div class="pa-cell"><div class="pa-label">Budget</div><div class="pa-value">${s}${budget.toFixed(2)}</div></div>
        <div class="pa-cell"><div class="pa-label">Spent</div><div class="pa-value ${overBudget?'over':''}">${s}${grandTotal.toFixed(2)}</div></div>
        <div class="pa-cell"><div class="pa-label">Remaining</div><div class="pa-value ${overBudget?'over':'under'}">${s}${Math.abs(remaining).toFixed(2)} ${overBudget?'over':'left'}</div></div>
      </div>
    </div>`;
  }

  // ── Trip-level costs section ──────────────────────────────────────
  const TLC_CATS=[
    {id:'package',  icon:'🏖',  label:'Package'},
    {id:'travel',   icon:'🚌',  label:'Travel'},
    {id:'accommodation',icon:'🏨',label:'Stay'},
    {id:'insurance',icon:'🛡',  label:'Insurance'},
    {id:'other',    icon:'💳',  label:'Other'},
  ];
  function tlcIcon(cat){ return (TLC_CATS.find(c=>c.id===cat)||TLC_CATS[4]).icon; }

  const tlcRows=tripLevelCosts.length
    ? tripLevelCosts.map(c=>`
      <div class="cost-day-row" style="align-items:flex-start;padding:10px 0">
        <span class="cost-day-label" style="display:flex;align-items:center;gap:6px;flex:1">
          <span style="font-size:16px">${tlcIcon(c.category)}</span>
          <span>
            <div style="font-weight:500">${esc(c.name)}</div>
            ${c.notes?`<div style="font-size:11px;color:var(--ink3)">${esc(c.notes)}</div>`:''}
          </span>
        </span>
        <span style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span class="cost-day-val">${s}${parseFloat(c.amount||0).toFixed(2)}</span>
          <button onclick="editTripLevelCost('${esc(trip.id)}','${esc(c.id)}')" style="background:none;border:none;cursor:pointer;color:var(--ink3);font-size:13px;padding:2px 4px" title="Edit">✏️</button>
          <button onclick="deleteTripLevelCost('${esc(trip.id)}','${esc(c.id)}')" style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:13px;padding:2px 4px" title="Delete">🗑</button>
        </span>
      </div>`).join('')
    : `<div style="padding:12px 0;font-size:13px;color:var(--ink3);text-align:center">No trip-level costs yet</div>`;

  const catOpts=TLC_CATS.map(c=>`<option value="${c.id}">${c.icon} ${c.label}</option>`).join('');

  return `<div style="padding:0 0 12px">
    ${budgetBar}

    <div class="section-hdr">Trip-level costs</div>
    <p style="font-size:12px;color:var(--ink3);margin:-4px 0 10px">Package holidays, flights booked as a whole, insurance — anything that covers the full trip rather than a single day.</p>
    <div style="background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);padding:2px 14px;margin-bottom:10px">
      ${tlcRows}
      ${tlTotal>0?`<div class="cost-day-row" style="border-top:1px solid var(--bdr)"><span class="cost-day-label" style="font-weight:700">Trip costs subtotal</span><span class="cost-day-val">${s}${tlTotal.toFixed(2)}</span></div>`:''}
    </div>
    <button class="btn btn-ghost" style="width:100%;margin-bottom:16px" onclick="showAddTripLevelCost('${esc(trip.id)}')">＋ Add trip-level cost</button>

    <div class="section-hdr">By category</div>
    <div class="cost-grid">
      <div class="cost-tile"><div class="cost-tile-label">🚌 Travel</div><div class="cost-tile-val" style="font-size:16px">${s}${(cats.travel||0).toFixed(2)}</div></div>
      <div class="cost-tile"><div class="cost-tile-label">🏨 Stays</div><div class="cost-tile-val" style="font-size:16px">${s}${(cats.accommodation||0).toFixed(2)}</div></div>
      <div class="cost-tile"><div class="cost-tile-label">🍽 Food</div><div class="cost-tile-val" style="font-size:16px">${s}${(cats.food||0).toFixed(2)}</div></div>
      <div class="cost-tile"><div class="cost-tile-label">🎡 Attractions</div><div class="cost-tile-val" style="font-size:16px">${s}${(cats.attraction||0).toFixed(2)}</div></div>
      <div class="cost-tile"><div class="cost-tile-label">🎸 Gigs</div><div class="cost-tile-val" style="font-size:16px">${s}${(cats.gig||0).toFixed(2)}</div></div>
    </div>

    <div class="section-hdr">Per day</div>
    <div style="background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);padding:2px 14px">
      ${dayRows||`<div style="padding:16px 0;font-size:13px;color:var(--ink3);text-align:center">No daily costs logged yet</div>`}
      ${dayTotal>0?`<div class="cost-day-row"><span class="cost-day-label" style="font-weight:700">Daily subtotal</span><span class="cost-day-val">${s}${dayTotal.toFixed(2)}</span></div>`:''}
    </div>

    ${grandTotal>0?`<div style="background:#0f0f1a;border-radius:var(--r);padding:14px;margin-top:12px;display:flex;justify-content:space-between;align-items:center">
      <span style="color:rgba(255,255,255,.7);font-size:14px;font-weight:600">Grand total</span>
      <span style="color:#fff;font-size:20px;font-weight:800">${s}${grandTotal.toFixed(2)}</span>
    </div>`:''}
  </div>`;
}
