function showAddTripLevelCost(tripId){ showTripLevelCostForm(tripId, null); }
function editTripLevelCost(tripId, costId){
  const trip=getEvent(tripId); if(!trip) return;
  const existing=(trip.tripLevelCosts||[]).find(c=>c.id===costId);
  showTripLevelCostForm(tripId, existing);
}

function saveTripLevelCost(tripId, existingId){
  const name=document.getElementById('tlcName')?.value.trim();
  const amtRaw=document.getElementById('tlcAmount')?.value;
  const err=document.getElementById('tlcErr');
  if(!name){ if(err) err.textContent='Description is required'; return; }
  if(!amtRaw||parseFloat(amtRaw)<0){ if(err) err.textContent='Enter a valid amount'; return; }

  const trip=getEvent(tripId); if(!trip) return;
  if(!trip.tripLevelCosts) trip.tripLevelCosts=[];

  const cost={
    id: existingId||genId(),
    name,
    amount: parseFloat(amtRaw),
    category: document.getElementById('tlcCategory')?.value||'other',
    notes: document.getElementById('tlcNotes')?.value.trim()||'',
  };

  const idx=trip.tripLevelCosts.findIndex(c=>c.id===cost.id);
  if(idx>=0) trip.tripLevelCosts[idx]=cost; else trip.tripLevelCosts.push(cost);
  trip.updatedAt=new Date().toISOString();
  saveEvent(trip);
  closeModal();
  showToast(existingId?'Cost updated ✓':'Cost added ✓');
  openTripDetail(tripId,'costs');
}

function deleteTripLevelCost(tripId, costId){
  if(!confirm('Remove this cost?')) return;
  const trip=getEvent(tripId); if(!trip) return;
  trip.tripLevelCosts=(trip.tripLevelCosts||[]).filter(c=>c.id!==costId);
  trip.updatedAt=new Date().toISOString();
  saveEvent(trip);
  showToast('Removed');
  openTripDetail(tripId,'costs');
}

function saveTripReview(tripId){

// REVIEWS TAB
// ═══════════════════════════════════════════════════════════════════
function renderReviews(){
  const d=getData();
  const filterType=document.getElementById('rvFilterType')?.value||'';
  const sortBy=document.getElementById('rvSort')?.value||'rating';

  // Collect all reviewable items: gigs + trip-level + trip stop items
  let reviewed=[], unreviewed=[];

  (d.events||[]).filter(ev=>!ev._deleted).forEach(ev=>{
    if(ev.type==='gig'){
      if(filterType==='trip') return;
      const entry={_kind:'gig',ev,date:ev.date,name:ev.name,rating:ev.review?.rating||0};
      if(ev.review?.rating) reviewed.push(entry); else if(ev.done||ev.missed||(ev.date<todayISO())) unreviewed.push(entry);
    } else if(ev.type==='trip'){
      if(filterType==='gig') return;
      // Trip-level review
      const tripEntry={_kind:'trip',ev,date:ev.endDate||ev.startDate,name:ev.name,rating:ev.review?.rating||0};
      if(ev.review?.rating) reviewed.push(tripEntry); else if(ev.status==='Completed'||(ev.endDate&&ev.endDate<todayISO())) unreviewed.push(tripEntry);
      // Individual stop reviews from trip days
      (ev.days||[]).forEach(day=>{
        (day.items||[]).filter(it=>!it._placeholder&&(it.type==='attraction'||it.type==='food'||it.type==='accommodation'||it.type==='keystop')).forEach(it=>{
          const stopEntry={_kind:'stop',ev,it,day,date:day.date,name:it.type==='food'?(it.subtype+(it.name?` — ${it.name}`:'')):it.name||typeLabel(it.type),rating:it.review?.rating||0};
          if(it.review?.rating) reviewed.push(stopEntry); else if(ev.status==='Completed'||(ev.endDate&&ev.endDate<todayISO())) unreviewed.push(stopEntry);
        });
      });
    }
  });

  // Sort reviewed
  if(sortBy==='rating') reviewed.sort((a,b)=>b.rating-a.rating||b.date.localeCompare(a.date));
  else if(sortBy==='recent') reviewed.sort((a,b)=>b.date.localeCompare(a.date));
  else if(sortBy==='name') reviewed.sort((a,b)=>a.name.localeCompare(b.name));

  // Sort unreviewed with same sort (rating falls back to date desc)
  if(sortBy==='rating') unreviewed.sort((a,b)=>b.date.localeCompare(a.date));
  else if(sortBy==='recent') unreviewed.sort((a,b)=>b.date.localeCompare(a.date));
  else if(sortBy==='name') unreviewed.sort((a,b)=>a.name.localeCompare(b.name));

  const filterBar=`<div class="filter-bar">
    <select id="rvFilterType" onchange="renderReviews()">
      <option value="">All types</option>
      <option value="gig" ${filterType==='gig'?'selected':''}>Gigs only</option>
      <option value="trip" ${filterType==='trip'?'selected':''}>Trips & stops only</option>
    </select>
    <select id="rvSort" onchange="renderReviews()">
      <option value="rating" ${sortBy==='rating'?'selected':''}>Sort: highest rated</option>
      <option value="recent" ${sortBy==='recent'?'selected':''}>Sort: most recent</option>
      <option value="name" ${sortBy==='name'?'selected':''}>Sort: A–Z</option>
    </select>
  </div>`;

  let html=filterBar;

  if(!reviewed.length&&!unreviewed.length){
    html+=`<div class="empty"><div class="empty-icon">⭐</div><p>No past events to review yet.<br>Mark a gig as done or complete a trip.</p></div>`;
  } else {
    if(reviewed.length){
      html+=`<div class="section-hdr">Reviewed (${reviewed.length})</div>`;
      reviewed.forEach(r=>{ html+=buildRevCard(r); });
    }
    if(unreviewed.length){
      html+=`<div class="section-hdr">Awaiting review (${unreviewed.length})</div>`;
      unreviewed.forEach(r=>{ html+=buildRevCard(r,true); });
    }
  }

  document.getElementById('appInner').innerHTML=html;
}

// v7.41 (GIG-053): todayISO() now comes from pal-utils.js (shared,
// byte-identical output to this app's old version). localDateStr()
// stays local — it's a more general date-formatter used with
// arbitrary dates throughout this file, out of scope for this pass.

function buildRevCard(r, unrev){
  if(r._kind==='gig'){
    const g=r.ev, ti=gigTypeInfo(g.gigType||'music'), rv=g.review||{};
    const stars=rv.rating?'★'.repeat(rv.rating)+'☆'.repeat(5-rv.rating):'';
    const againClass={'Definitely':'again-def','Probably':'again-prob','Maybe':'again-maybe','No':'again-no'}[rv.again]||'';
    return `<div class="rev-card${unrev?' unreviewed':''}" onclick="${unrev?`showReviewForm('${esc(g.id)}')`:`openGigDetail('${esc(g.id)}')`}">
      <div class="rev-name">${ti.icon} ${esc(g.name)}</div>
      <div class="rev-sub">${g.venue?`📍 ${esc(g.venue)} · `:''}${fmtDateLong(g.date)}</div>
      ${unrev?`<div style="font-size:12px;color:var(--acc);font-weight:600">Tap to add review →</div>`:`
      <div class="rev-meta">
        <span style="color:var(--gold);font-size:15px;letter-spacing:1px">${stars}</span>
        ${rv.again?`<span class="again-pill ${againClass}">${rv.again}</span>`:''}
        <span class="by-pill">${ti.label}</span>
      </div>
      ${(rv.atmosphereRating||rv.venueRating)?`<div class="rev-ratings">
        ${rv.atmosphereRating?`<div class="rev-rating-item"><div class="rrl">Atmosphere</div><div style="color:var(--gold);font-size:12px">${'★'.repeat(rv.atmosphereRating)}${'☆'.repeat(5-rv.atmosphereRating)}</div></div>`:''}
        ${rv.venueRating?`<div class="rev-rating-item"><div class="rrl">Venue</div><div style="color:var(--gold);font-size:12px">${'★'.repeat(rv.venueRating)}${'☆'.repeat(5-rv.venueRating)}</div></div>`:''}
      </div>`:``}
      ${rv.note?`<div class="rev-note">${esc(rv.note)}</div>`:''}`}
    </div>`;
  } else if(r._kind==='trip'){
    const t=r.ev, rv=t.review||{};
    const stars=rv.rating?'★'.repeat(rv.rating)+'☆'.repeat(5-rv.rating):'';
    return `<div class="rev-card trip-rev${unrev?' unreviewed':''}" onclick="${unrev?`openTripDetail('${esc(t.id)}','review')`:`openTripDetail('${esc(t.id)}','review')`}">
      <div class="rev-name">✈️ ${esc(t.name)}</div>
      <div class="rev-sub">${t.destination?`📍 ${esc(t.destination)} · `:''}${fmtDateLong(t.startDate)} — ${fmtDateLong(t.endDate)}</div>
      ${unrev?`<div style="font-size:12px;color:var(--acc);font-weight:600">Tap to add trip review →</div>`:`
      <div class="rev-meta">
        <span style="color:var(--gold);font-size:15px;letter-spacing:1px">${stars}</span>
        <span class="by-pill">Trip</span>
      </div>
      ${rv.note?`<div class="rev-note">${esc(rv.note)}</div>`:''}`}
    </div>`;
  } else { // stop
    const t=r.ev, it=r.it, rv=it.review||{};
    const stars=rv.rating?'★'.repeat(rv.rating)+'☆'.repeat(5-rv.rating):'';
    return `<div class="rev-card trip-rev${unrev?' unreviewed':''}" onclick="openTripDetail('${esc(t.id)}','review')">
      <div class="rev-name">${typeIcon(it.type)} ${esc(r.name)}</div>
      <div class="rev-sub">✈️ ${esc(t.name)} · ${fmtDateShort(r.date)}</div>
      ${unrev?`<div style="font-size:12px;color:var(--acc);font-weight:600">Tap to add review →</div>`:`
      <div class="rev-meta">
        <span style="color:var(--gold);font-size:15px;letter-spacing:1px">${stars}</span>
        <span class="by-pill">${typeLabel(it.type)}</span>
      </div>
      ${rv.note?`<div class="rev-note">${esc(rv.note)}</div>`:''}`}
    </div>`;
  }
}

// ═══════════════════════════════════════════════════════════════════
// CALENDAR TAB (GIG-045)
// ═══════════════════════════════════════════════════════════════════
// Scope decisions worth knowing:
// - Month view: tapping a day drills into that day (Day view) rather
//   than offering add/open directly on the cell — month cells are too
//   small for a reliable "blank space vs. item" tap target the way
//   Google Calendar's own month view works. Week, Day, and Agenda all
//   show real item rows, so those get the literal "tap an item to open
//   it, tap + to add" behaviour requested.
// - No hour-positioned drag grid for Week/Day — each day is a compact,
//   time-sorted stacked list (reusing sortDayTimeline, same as every
//   other view in the app), not pixel-per-minute blocks. Far less
//   engineering for a mobile-first app, and consistent with how every
//   other view already presents a day's items.
let _calView=localStorage.getItem('gat_calView')||'month'; // 'month'|'week'|'day'|'agenda'
let _calAnchorDate=todayISO(); // the date the current view is centred/focused on
// Agenda-specific: show or hide dates that are a trip day but have no
// gigs/items on them at all. Off by default (matches the original
// behaviour) — a display preference, localStorage only, like the
// "Hide trip gigs" toggle.
let _calAgendaShowEmpty=localStorage.getItem('gat_calAgendaShowEmpty')==='1';
function toggleCalAgendaEmpty(){
  _calAgendaShowEmpty=!_calAgendaShowEmpty;
  localStorage.setItem('gat_calAgendaShowEmpty',_calAgendaShowEmpty?'1':'0');
  render();
}
function setCalView(v){
  _calView=v; localStorage.setItem('gat_calView',v); render();
}
function calNav(dir){
  const d=new Date(_calAnchorDate+'T00:00:00');
  if(_calView==='month') d.setMonth(d.getMonth()+dir);
  else if(_calView==='week') d.setDate(d.getDate()+dir*7);
  else d.setDate(d.getDate()+dir); // day & agenda both step by a day
  _calAnchorDate=localDateStr(d);
  render();
}
function calToday(){ _calAnchorDate=todayISO(); render(); }
function calGoToDate(dateStr){ _calAnchorDate=dateStr; _calView='day'; localStorage.setItem('gat_calView','day'); render(); }

// Everything happening on one calendar date, across ALL trips — gigs by
// date, plus each spanning trip's own day object (and that day's items)
// for any trip whose range covers this date. Distinct from the existing
// per-trip openDayView(tripId,dayId) — this is a global, date-first view.
function getDayAgenda(dateStr){
  const d=getData();
  const gigs=(d.events||[]).filter(e=>e.type==='gig'&&!e._deleted&&e.date===dateStr);
  const trips=(d.events||[]).filter(e=>e.type==='trip'&&!e._deleted&&e.startDate&&e.endDate&&e.startDate<=dateStr&&e.endDate>=dateStr);
  const tripBlocks=trips.map(trip=>{
    const day=(trip.days||[]).find(dd=>dd.date===dateStr);
    const items=day?(day.items||[]).filter(it=>!it._placeholder):[];
    return {trip,day,items};
  }).filter(tb=>tb.day);
  return {gigs,tripBlocks};
}
// Flattens one date's gigs + every spanning trip's items into a single
// time-sorted list for display — gigs get _linkedGig:true purely to
// reuse sortDayTimeline's existing time-lookup branch (real gigs already
// have their own .type==='gig', unaffected), trip items get _tripId/
// _dayId stamped on for click-routing since a merged list otherwise
// loses which trip/day each one came from.
function getDayCombinedItems(dateStr){
  const {gigs,tripBlocks}=getDayAgenda(dateStr);
  const flat=[...gigs.map(g=>({...g,_linkedGig:true}))];
  tripBlocks.forEach(tb=>{
    tb.items.forEach(it=>flat.push({...it,_tripId:tb.trip.id,_dayId:tb.day.id,_tripName:tb.trip.name}));
  });
  return sortDayTimeline(flat);
}
// Shared row renderer for Week/Day/Agenda — icon, name, time, location,
// tapping opens the gig detail or the item's edit form.
function renderCalItemRow(it){
  const isGig=it.type==='gig';
  const icon=isGig?gigTypeInfo(it.gigType||'music').icon:typeIcon(it.type);
  const name=isGig?it.name:itemDisplayName(it);
  const tm=isGig?(it.time||null):itemTime(it);
  const locName=isGig?(it.venue||''):itemLocationName(it);
  const click=isGig?`openGigDetail('${esc(it.id)}')`:`openEditItem('${esc(it._tripId)}','${esc(it._dayId)}','${esc(it.id)}')`;
  return `<div class="cal-item-row" onclick="${click}">
    <span class="cal-item-icon">${icon}</span>
    <span class="cal-item-name">${esc(name)}</span>
    ${locName?`<span class="cal-item-loc">${esc(locName)}</span>`:''}
    ${tm?`<span class="cal-item-time">${tm}</span>`:''}
    ${!isGig&&it._tripName?`<span class="cal-item-trip">${esc(it._tripName)}</span>`:''}
  </div>`;
}
// The tap-a-blank-day add flow: always offers a plain gig/event (no trip
// context needed), plus one option per trip whose range covers this
// date — usually one, but a rare overlap between two trips gets both.
function openCalDayActions(dateStr){
  const d=getData();
  const trips=(d.events||[]).filter(e=>e.type==='trip'&&!e._deleted&&e.startDate&&e.endDate&&e.startDate<=dateStr&&e.endDate>=dateStr);
  const dLabel=new Date(dateStr+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let opts=`<button class="btn btn-ghost" style="width:100%;margin-bottom:10px" onclick="closeModal();openAddGigForTrip(null,null,'${esc(dateStr)}')">🎸 Add Gig / Event</button>`;
  trips.forEach(trip=>{
    const day=(trip.days||[]).find(dd=>dd.date===dateStr);
    if(day) opts+=`<button class="btn btn-ghost" style="width:100%;margin-bottom:10px" onclick="closeModal();showAddItemMenu('${esc(trip.id)}','${esc(day.id)}')">➕ Add to ${esc(trip.name)}</button>`;
  });
  opts+=`<button class="btn btn-ghost" style="width:100%" onclick="closeModal();calGoToDate('${esc(dateStr)}')">📋 View this day</button>`;
  showModal(`<div class="modal-hdr"><div class="modal-title">${esc(dLabel)}</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${opts}</div>`);
}

function renderCalendar(){
  const anchor=new Date(_calAnchorDate+'T00:00:00');
  const viewBtns=['month','week','day','agenda'].map(v=>
    `<button class="cal-view-btn${_calView===v?' on':''}" onclick="setCalView('${v}')">${v.charAt(0).toUpperCase()+v.slice(1)}</button>`
  ).join('');

  let navLabel='', body='';
  if(_calView==='month'){
    navLabel=anchor.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    body=renderCalMonth(anchor);
  } else if(_calView==='week'){
    const weekStart=new Date(anchor); weekStart.setDate(anchor.getDate()-((anchor.getDay()+6)%7));
    const weekEnd=new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
    navLabel=weekStart.getMonth()===weekEnd.getMonth()
      ?`${weekStart.getDate()}–${weekEnd.getDate()} ${weekEnd.toLocaleDateString('en-GB',{month:'short',year:'numeric'})}`
      :`${weekStart.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${weekEnd.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;
    body=renderCalWeek(weekStart);
  } else if(_calView==='day'){
    navLabel=anchor.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    body=renderCalDay(_calAnchorDate);
  } else {
    navLabel='Agenda — from '+anchor.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    body=renderCalAgenda(_calAnchorDate);
  }

  const html=`
    <div class="cal-view-switch">${viewBtns}</div>
    <div class="cal-nav-row">
      <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
      <div class="cal-nav-label">${esc(navLabel)}</div>
      <button class="cal-nav-btn" onclick="calNav(1)">›</button>
      <button class="cal-today-btn" onclick="calToday()">Today</button>
    </div>
    ${body}
  `;
  document.getElementById('appInner').innerHTML=html;
}

function renderCalMonth(anchor){
  const year=anchor.getFullYear(), month=anchor.getMonth();
  const firstOfMonth=new Date(year,month,1);
  const firstDow=(firstOfMonth.getDay()+6)%7; // Monday-start grid
  const gridStart=new Date(year,month,1-firstDow);
  const today=todayISO();
  const dowLabels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html=`<div class="cal-month-grid">`;
  dowLabels.forEach(l=>html+=`<div class="cal-dow-label">${l}</div>`);
  for(let i=0;i<42;i++){
    const cellDate=new Date(gridStart); cellDate.setDate(gridStart.getDate()+i);
    const cellStr=localDateStr(cellDate);
    const inMonth=cellDate.getMonth()===month;
    const isToday=cellStr===today;
    const {gigs,tripBlocks}=getDayAgenda(cellStr);
    const dots=gigs.slice(0,3).map(()=>`<span class="cal-dot"></span>`).join('');
    const extraCount=Math.max(0,gigs.length-3);
    html+=`<div class="cal-cell${inMonth?'':' out'}${isToday?' today':''}" onclick="calGoToDate('${cellStr}')">
      <div class="cal-cell-daynum">${cellDate.getDate()}</div>

    </div>`;
  }
  html+=`</div>`;
  return html;
}

function renderCalAgenda(startDate){
  const toggleRow=`<div class="hide-gigs-toggle-row" onclick="toggleCalAgendaEmpty()">
    <span class="tgl-lbl">Show empty days</span>
    <div class="tgl${_calAgendaShowEmpty?' on':''}"><div class="kn"></div></div>
  </div>`;

  let dates;
  if(_calAgendaShowEmpty){
    // v7.35 (GIG-047 — corrected from v7.34): every calendar date in
    // sequence from startDate, not just dates that happen to fall inside
    // a trip. This is a genuinely continuous day-by-day walk — a totally
    // blank stretch with no trip anywhere near it still shows every date.
    // Capped at 60 days for the same reason as the sparse list below: an
    // agenda view isn't meant to load the whole future at once.
    dates=[];
    const d=new Date(startDate+'T00:00:00');
    for(let i=0;i<60;i++){
      dates.push(localDateStr(d));
      d.setDate(d.getDate()+1);
    }
  } else {
    // Original behaviour: only dates that actually have something on
    // them — a gig, or a trip day with real items — gathered from actual
    // events rather than walking every date, then further filtered below
    // to drop any date that turns out to have zero combined items (e.g.
    // a trip day with no items and no gig either).
    const d=getData();
    const allDates=new Set((d.events||[]).filter(e=>e.type==='gig'&&!e._deleted&&e.date>=startDate).map(e=>e.date));
    (d.events||[]).filter(e=>e.type==='trip'&&!e._deleted&&e.endDate>=startDate).forEach(trip=>{
      (trip.days||[]).forEach(day=>{ if(day.date>=startDate) allDates.add(day.date); });
    });
    dates=[...allDates].sort().slice(0,60);
  }

  if(!dates.length) return toggleRow+`<div class="empty"><div class="empty-icon">📋</div><p>Nothing scheduled from this date onward.</p></div>`;
  let html=toggleRow;
  let shown=0;
  dates.forEach(dateStr=>{
    const items=getDayCombinedItems(dateStr);
    if(!items.length&&!_calAgendaShowEmpty) return; // sparse mode still drops empty dates entirely
    shown++;
    const dObj=new Date(dateStr+'T00:00:00');
    html+=`<div class="cal-agenda-date-hdr">
      <span>${dObj.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</span>
      <button class="cal-add-btn" onclick="openCalDayActions('${dateStr}')">+ Add</button>
    </div>
    ${items.length?items.map(it=>renderCalItemRow(it)).join(''):`<div class="cal-empty-day">Nothing planned</div>`}`;
  });
  if(!shown) html+=`<div class="empty"><div class="empty-icon">📋</div><p>Nothing scheduled from this date onward.</p></div>`;
  return html;
}

function addVenueFromInput(){
  const inp=document.getElementById('newVenueName');
  const name=inp?.value?.trim(); if(!name) return;
  const d=getData();
  const venues=normaliseVenues(d.venues);
  let newVenue=null;
  if(!venues.find(v=>v.name.toLowerCase()===name.toLowerCase())){
    newVenue={id:venueId(name),name,mapUrl:'',updatedAt:new Date().toISOString()};
    venues.push(newVenue);
    venues.sort((a,b)=>a.name.localeCompare(b.name));
    d.venues=venues;
    saveData(d);
  }
  inp.value='';
  renderVenues();
  if(newVenue) syncVenueNow(newVenue);
}

function deleteVenue(id){
  const d=getData();
  const venues=normaliseVenues(d.venues); // full list — preserves any other pending tombstone
  const idx=venues.findIndex(v=>v.id===id);
  const v=venues[idx];
  if(!v||!confirm(`Remove "${v.name}" from venue list?`)) return;
  venues.splice(idx,1);
  d.venues=venues;
  saveData(d);
  renderVenues();
  // v5.3 (GT-003): tombstone the venue in the cloud rather than just
  // dropping it locally — otherwise it never actually leaves the shared
  // list for Lex, and could even resurrect on this device's own next pull.
  syncVenueNow(Object.assign({},v,{_deleted:true,updatedAt:new Date().toISOString()}));
}

function editVenue(id){
  const d=getData();
  const venues=normaliseVenues(d.venues);
  const v=venues.find(x=>x.id===id); if(!v) return;
  const idAttr=esc(v.id).replace(/'/g,"\\'");
  showModal(`<div class="modal-hdr">
      <div class="modal-title">Edit Venue</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

          <button class="btn btn-ghost" style="flex-shrink:0;padding:10px 12px;font-size:13px" onclick="prefillMapUrl()" title="Search Google Maps">🔍</button>
        </div>

      </div>

function prefillMapUrl(){
  const name=document.getElementById('evName')?.value.trim();
  if(!name) return;
  const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name);
  const inp=document.getElementById('evMap');
  if(inp) inp.value=url;
}

function saveVenueEdit(id){
  const name=document.getElementById('evName')?.value.trim();
  const mapUrl=document.getElementById('evMap')?.value.trim()||'';
  if(!name) return;
  const d=getData();
  const venues=normaliseVenues(d.venues); // full list — preserves any other pending tombstone
  const idx=venues.findIndex(v=>v.id===id);
  const existing=venues[idx];
  if(!existing) return;
  // v5.3 (GT-003): preserve the existing id — it's the venue's stable
  // identity now, not derived fresh from the current name. Rebuilding
  // the object from scratch here would have silently orphaned the old
  // cloud record every time someone renamed a venue.
  const updated=Object.assign({},existing,{name,mapUrl,updatedAt:new Date().toISOString()});
  venues[idx]=updated;
  venues.sort((a,b)=>a.name.localeCompare(b.name));
  d.venues=venues;
  saveData(d);
  closeModal();
  renderVenues();
  syncVenueNow(updated);
}

function gigsConflictingTrips(gigDate, gigTripId, d){
  if(!gigDate) return [];
  return (d.events||[]).filter(e=>
    e.type==='trip' && !e._deleted &&
    e.status!=='Cancelled' && e.status!=='Completed' &&
    e.startDate && e.endDate &&
    gigDate>=e.startDate && gigDate<=e.endDate &&
    e.id!==gigTripId
  );
}
function gigsOnSameDate(gigId, gigDate, d){
  if(!gigDate) return [];
  return (d.events||[]).filter(e=>
    e.type==='gig' && !e._deleted &&
    e.id!==gigId && e.date===gigDate && !e.missed
  );
}
function tripsOverlapping(tripId, startDate, endDate, d){
  if(!startDate||!endDate) return [];
  return (d.events||[]).filter(e=>
    e.type==='trip' && !e._deleted &&
    e.id!==tripId &&
    e.status!=='Cancelled' && e.status!=='Completed' &&
    e.startDate && e.endDate &&
    e.startDate<=endDate && e.endDate>=startDate
  );
}
function unlinkedGigsInTrip(tripId, startDate, endDate, d){
  if(!startDate||!endDate) return [];
  return (d.events||[]).filter(e=>
    e.type==='gig' && !e._deleted &&
    e.tripId!==tripId &&
    e.date>=startDate && e.date<=endDate && !e.missed
  );
}
function needsDayOff(dateStr,timeStr){
  if(!dateStr||!timeStr) return false;
  const d=new Date(dateStr+'T00:00:00');
  const dow=d.getDay();
  if(dow===0||dow===6) return false;
  return parseInt(timeStr.split(':')[0],10)<18;
}

    `<div class="vd-item" onclick="selectVenue('${esc(v.name)}')">${esc(v.name)}</div>`
  ).join('');

  const venues=normaliseVenues(d.venues);

  if(!venues.find(v=>v.name.toLowerCase()===name.toLowerCase())){

    venues.push(newVenue);
    venues.sort((a,b)=>a.name.localeCompare(b.name));

function renderStarInput(containerId,currentVal){

function setStarVal(cid,v){

  el.dataset.val=n;
  [1,2,3,4,5].forEach((i,idx)=>{ el.children[idx].className='si'+(i<=n?' on':''); el.children[idx].textContent=i<=n?'★':'☆'; });

function hoverStar(cid,v){
  const el=document.getElementById(cid); if(!el) return;
  const set=parseInt(el.dataset.val||'0');
  [1,2,3,4,5].forEach((i,idx)=>{ const on=v>0?i<=v:i<=set; el.children[idx].className='si'+(on?' on':''); el.children[idx].textContent=on?'★':'☆'; });
}

// DRAG-TO-REORDER — day items
// ═══════════════════════════════════════════════════════════════════
let _dragItemId=null, _dragTripId=null, _dragDayId=null;

function onItemDragStart(e){
  const card=e.currentTarget;
  _dragItemId=card.dataset.itemId;
  _dragTripId=card.dataset.tripId;
  _dragDayId=card.dataset.dayId;
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',_dragItemId);
}
function onItemDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  const card=e.currentTarget;
  if(card.dataset.itemId!==_dragItemId) card.classList.add('drag-over');
}
function onItemDragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
function onItemDrop(e){
  e.preventDefault();
  const targetCard=e.currentTarget;
  targetCard.classList.remove('drag-over');
  const targetId=targetCard.dataset.itemId;
  if(!_dragItemId||targetId===_dragItemId) return;
  const trip=getEvent(_dragTripId); if(!trip) return;
  const day=trip.days.find(d=>d.id===_dragDayId); if(!day) return;
  const items=day.items||[];
  const fromIdx=items.findIndex(i=>i.id===_dragItemId);
  const toIdx=items.findIndex(i=>i.id===targetId);
  if(fromIdx<0||toIdx<0) return;
  const [moved]=items.splice(fromIdx,1);
  items.splice(toIdx,0,moved);
  items.forEach((it,i)=>{ it.order=i; });
  day.items=items;
  trip.updatedAt=new Date().toISOString();
  saveEvent(trip);
  openDayView(_dragTripId,_dragDayId);
}
function onItemDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('drag-over'));
  _dragItemId=null;
}

// ── Sync log — persisted across modal open/close, matching the rest of the suite ──
let _syncLog=[]; // [{msg,type}] oldest-first, cap 120
function syncLog(msg, type){
  // type: 'info' | 'ok' | 'err' | 'working'
  const ts = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  _syncLog.push({ts, msg, type: type||'info'});
  if(_syncLog.length>120) _syncLog.shift();
  const el=document.getElementById('syncLogArea');
  if(!el) return; // modal not open — entry is still kept for next time it opens
  const colours={info:'var(--ink3)',ok:'var(--ok)',err:'var(--danger)',working:'var(--acc)'};
  const icons={info:'',ok:'✓ ',err:'❌ ',working:'⏳ '};
  const line=document.createElement('div');
  line.style.cssText='padding:4px 0;border-bottom:1px solid var(--bdr);font-size:12px;color:'+colours[type||'info']+';word-break:break-all;line-height:1.4';
  line.textContent=ts+' — '+(icons[type||'info'])+msg;
  el.appendChild(line);
  el.scrollTop=el.scrollHeight;
}

function clearSyncLog(){
  _syncLog=[];
  const el=document.getElementById('syncLogArea');
  if(el) el.innerHTML='';
}

function exportJSON(){
  const d=getData();
  // v7.2 (GIG-0xx): stamped and saved to localStorage (not just the
  // downloaded file) so the launcher's Health Check can read it
  // directly — previously untracked, so this app was hardcoded as a
  // 'known-exception' and skipped from the backup-staleness scan.
  d.lastExported=new Date().toISOString();
  saveData(d);
  const exportData={...d,events:(d.events||[]).filter(ev=>!ev._deleted)};
  window.dlJSON(exportData,'gigs-and-trips.json');
  showToast('Backup downloaded ✓');
}

// v7.2 (GIG-0xx): removed confirmResetVenues() and resetVenuesInSupabase()
// — a fully-built, never-called confirm-modal + reset pair left over
// from an earlier refactor. dmResetVenues() (below) is the only
// reachable path for this action, and already shows an equivalent
// confirm modal before calling confirmResetVenuesLogged(); this was
// dead code duplicating that same safety gate.
// v7.6 (GT-004, suite-wide sync audit): handleImport() used to merge an
// imported backup file only against whatever was already in local
// storage, then push the result straight to Supabase via pushAllEvents()
// — never reconciling against the cloud's actual current state first.
// If the cloud had something newer this device's local copy didn't know
// about yet (e.g. Lex added an event from another device since this
// backup was taken), that push would silently overwrite it. Same defect
// found and fixed in Meal Planner (MP-045), Reading Tracker (MR-011),
// On Budget (ON--049), and Fortnight Tracker (FT-026). Both import
// branches (native and legacy gig-tracker format) now call
// pullFromSupabase(false) — a full, non-incremental pull that merges
// last-write-wins by updatedAt — before pushing, so the eventual push
// only ever sends a state already reconciled with the cloud.

function handleImport(inp){
  const f=inp.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const imported=JSON.parse(e.target.result);
      // Accept both native gat format and legacy gig-tracker format
      const isNative=Array.isArray(imported.events);
      const isLegacy=Array.isArray(imported.gigs);
      if(!isNative&&!isLegacy){ showToast('❌ Unrecognised file format'); return; }

      const d=getData();

      if(isNative){
        // Merge events — remote wins on conflict by updatedAt
        const map={};
        d.events.forEach(ev=>map[ev.id]=ev);
        (imported.events||[]).forEach(ev=>{
          if(!map[ev.id]||(ev.updatedAt||'')>=(map[ev.id].updatedAt||'')) map[ev.id]=ev;
        });
        d.events=Object.values(map);
        // Merge venues — union by name
        const vmap={};
        normaliseVenues(d.venues).forEach(v=>vmap[v.name.toLowerCase()]=v);
        normaliseVenues(imported.venues||[]).forEach(v=>{
          const k=v.name.toLowerCase();
          // Keep existing map URL if remote has none
          if(!vmap[k]) vmap[k]=v;
          else if(v.mapUrl&&!vmap[k].mapUrl) vmap[k].mapUrl=v.mapUrl;
        });
        d.venues=Object.values(vmap).sort((a,b)=>a.name.localeCompare(b.name));
        saveData(d);
        const evCount=(imported.events||[]).length;
        const vCount=Object.values(vmap).length;
        showToast(`Imported ${evCount} events, ${vCount} venues ✓`);
        // GT-004 (suite-wide sync audit): this used to push straight to
        // Supabase after merging the imported file only against whatever
        // was already in local storage — never against the cloud's actual
        // current state. If the cloud had something newer that this
        // device's local copy didn't yet know about (e.g. Lex added an
        // event from another device), the blind push here would silently
        // overwrite it. Same defect found and fixed in Meal Planner
        // (MP-045), Reading Tracker (MR-011), On Budget (ON--049), and
        // Fortnight Tracker (FT-026). pullFromSupabase(false) does a full
        // (non-incremental) pull, merging the cloud's current state into
        // local last-write-wins by updatedAt, before anything is pushed —
        // so the eventual push only ever sends a state that's already
        // reconciled with the cloud, not a blind overwrite of it.
        setTimeout(()=>{ pullFromSupabase(false).then(()=>pushAllEvents()); }, 300);
      } else {
        // Legacy gig-tracker.json format — transform and merge
        const newGigs=(imported.gigs||[]).map(g=>({
          id:g.id, type:'gig',
          gigType:g.type||'music',
          name:g.name, date:g.date, time:g.time||'',
          venue:g.venue||'', ticketUrl:g.ticketUrl||'',
          ticketNote:g.ticketNote||'', notes:g.notes||'',
          addedBy:g.addedBy||'Pete', tripId:null,
          done:g.done||false, missed:g.missed||false,
          review:g.review||null,
          createdAt:g.createdAt||new Date().toISOString(),
          updatedAt:g.updatedAt||new Date().toISOString(),
        }));
        const map={};
        d.events.forEach(ev=>map[ev.id]=ev);
        newGigs.forEach(ev=>{ if(!map[ev.id]) map[ev.id]=ev; });
        d.events=Object.values(map);
        // Merge venues
        const vmap={};
        normaliseVenues(d.venues).forEach(v=>vmap[v.name.toLowerCase()]=v);
        normaliseVenues(imported.venues||[]).forEach(v=>{
          const k=v.name.toLowerCase();
          if(!vmap[k]) vmap[k]=v;
          else if(v.mapUrl&&!vmap[k].mapUrl) vmap[k].mapUrl=v.mapUrl;
        });
        d.venues=Object.values(vmap).sort((a,b)=>a.name.localeCompare(b.name));
        saveData(d);
        showToast(`Imported ${newGigs.length} gigs, ${Object.values(vmap).length} venues ✓`);
        // GT-004 (suite-wide sync audit): same fix as the native-format
        // branch above — pull-and-merge with the cloud's current state
        // before pushing, instead of pushing a merge against stale local
        // storage that never saw the cloud's latest.
        setTimeout(()=>{ pullFromSupabase(false).then(()=>pushAllEvents()); }, 300);
      }
      render();
    } catch(err){
      showToast('❌ Could not read file');
      console.error('Import error:',err);
    }
    inp.value=''; // reset so same file can be re-imported if needed
  };
  reader.readAsText(f);
}

function localDateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function fmtDateCard(ds){
  if(!ds) return '—';
  const d=new Date(ds+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function fmtDateShort(ds){
  if(!ds) return '—';
  const d=new Date(ds+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function fmtDateLong(ds){
  if(!ds) return '—';
  const d=new Date(ds+'T00:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
}
function tripNights(t){
  if(!t.startDate||!t.endDate) return (t.days||[]).length||0;
  const diff=Math.ceil((new Date(t.endDate)-new Date(t.startDate))/86400000);
  return diff>0?diff:0;
}

function timePickerHtml(idPrefix, selected){
  const selH = selected ? selected.split(':')[0] : '';
  const selM = selected ? selected.split(':')[1] : '';
  const noSel = !selected;

  // Hour select: blank "—" option + 00–23
  let hOpts = `<option value=""${noSel?' selected':''}>—</option>`;
  for(let h=0;h<24;h++){
    const v=String(h).padStart(2,'0');
    hOpts+=`<option value="${v}"${selH===v?' selected':''}>${v}</option>`;
  }

  // Minute select: blank "—" option + 00, 05, 10 … 55
  let mOpts = `<option value=""${noSel?' selected':''}>—</option>`;
  for(let m=0;m<60;m+=5){
    const v=String(m).padStart(2,'0');
    mOpts+=`<option value="${v}"${selM===v?' selected':''}>${v}</option>`;
  }

  return `<div class="time-pick" style="display:flex;gap:4px;align-items:center">` +
    `<select class="fi" id="${idPrefix}H" style="flex:1">${hOpts}</select>` +
    `<span style="font-weight:600;color:var(--ink2)">:</span>` +
    `<select class="fi" id="${idPrefix}M" style="flex:1">${mOpts}</select>` +
    `</div>`;
}

// Read the two selects back as a combined "HH:MM" string (or '' if either blank).
function getTimePicker(idPrefix){
  const h=document.getElementById(idPrefix+'H')?.value||'';
  const m=document.getElementById(idPrefix+'M')?.value||'';
  if(!h&&!m) return '';
  if(!h||!m) return ''; // treat partial selection as no time
  return h+':'+m;
}

// Backwards-compat alias — not used in new code but kept in case any cached
// HTML in localStorage references the old single select.
function timeOptions(selected){
  return timePickerHtml('_legacy_', selected);
}

// ═══════════════════════════════════════════════════════════════════
// CALENDAR-ADDED FLAG
// ═══════════════════════════════════════════════════════════════════
// Sets calendarAdded:true on the record, saves and pushes so the badge
// persists across devices. Called synchronously from the <a> onclick
// so it always fires even if the user closes the calendar tab instantly.
// v7.8 (GIG-033): removed calSnapshotGig/calSnapshotTrip/calendarStatus —
// the button used to grey out to "In Calendar ✓" when nothing had changed
// since the last send, or turn amber "Update in Calendar" when it had.
// Pete asked to remove that complexity: the button is now always the
// same active "Add to Google Calendar" action (see openGigDetail/
// showTripForm below) — clicking it always opens a fresh Google Calendar
// tab stamped with a [Sent D Mon] suffix (see gcalGigUrl/gcalTripUrl
// above), so there's no state to track here beyond the "In Calendar"
// badge itself.
function markCalendarAdded(id){
  const ev=getEvent(id); if(!ev) return;
  ev.calendarAdded=true;
  ev.updatedAt=new Date().toISOString();
  saveEvent(ev);
  // v7.11 (GIG-036): trips also get their full itinerary copied to the
  // clipboard on every calendar-add — see copyTripItineraryToClipboard.
  // The overwritten showToast from that call is fine here; there's
  // nothing else competing for the toast at this point in the flow.
  if(ev.type==='trip') copyTripItineraryToClipboard(ev);
  closeModal(); // close the detail/edit modal after opening calendar tab
}

// ═══════════════════════════════════════════════════════════════════
// GOOGLE CALENDAR LINKS
// ═══════════════════════════════════════════════════════════════════
function gcalGigUrl(g){
  let dates;
  if(g.time){
    const start=new Date(g.date+'T'+g.time+':00');
    const end=new Date(start.getTime()+3*60*60*1000);
    const fmt=d=>`${d.getUTCFullYear()}${String(d.getUTCMonth()+1).padStart(2,'0')}${String(d.getUTCDate()).padStart(2,'0')}T${String(d.getUTCHours()).padStart(2,'0')}${String(d.getUTCMinutes()).padStart(2,'0')}00Z`;
    dates=fmt(start)+'/'+fmt(end);
  } else {
    const ds=g.date.replace(/-/g,'');
    const next=new Date(g.date+'T00:00:00');
    next.setDate(next.getDate()+1);
    const nd=localDateStr(next).replace(/-/g,'');
    dates=ds+'/'+nd;
  }
  // v7.8 (GIG-033): always append a [Sent D Mon] suffix (was only added on
  // "update") so every send — first time or repeat — is stamped with the
  // date it was sent, making duplicates in Google Calendar easy to spot.
  const _sentSuffix=' [Sent '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})+']';
  const parts=['https://calendar.google.com/calendar/render?action=TEMPLATE'];
  const _gigIcon=gigTypeInfo(g.gigType||'music').icon;
  parts.push('text='+encodeURIComponent(_gigIcon+' '+g.name+_sentSuffix));
  parts.push('dates='+dates);
  const details=[g.ticketNote||'',g.notes||''].filter(Boolean).join('\n');
  if(details) parts.push('details='+encodeURIComponent(details));
  if(g.venue) parts.push('location='+encodeURIComponent(g.venue));
  return parts.join('&');
}

// ── Trip itinerary text (GIG-036) ────────────────────────────────────
// Day-by-day plain-text summary: each day's date as a header line, then
// its items (+ any linked gigs) underneath in day/time order — the same
// order sortDayTimeline() puts on screen. Ghost stays are deliberately
// excluded (they're a display-only echo of the real item on its actual
// check-in day, so including them here would duplicate every night of a
// multi-night stay). Used both for the trip's own calendar-link details
// (truncated, see gcalTripUrl) and the full clipboard copy.
function buildTripItinerary(trip){
  const days=(trip.days||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!days.length) return '';
  const d=getData();
  const linkedGigs=(d.events||[]).filter(e=>e.type==='gig'&&!e._deleted&&e.tripId===trip.id);
  const lines=[];
  days.forEach(day=>{
    const dObj=new Date(day.date+'T00:00:00');
    const dateLabel=dObj.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    lines.push(`Day ${day.dayNumber} — ${dateLabel}`);
    const realItems=(day.items||[]).filter(it=>!it._placeholder);
    const gigsToday=linkedGigs.filter(g=>g.date===day.date).map(g=>({...g,_linkedGig:true}));
    const sorted=sortDayTimeline([...realItems,...gigsToday]);
    if(!sorted.length){
      lines.push('  (nothing planned yet)');
    } else {
      sorted.forEach(it=>{
        const icon=it._linkedGig?gigTypeInfo(it.gigType||'music').icon:typeIcon(it.type);
        const t=it._linkedGig?(it.time||null):itemTime(it);
        lines.push(`  ${t?t+' ':''}${icon} ${itemDisplayName(it)}`);
      });
    }
    lines.push('');
  });
  return lines.join('\n').trim();
}
// Copies the full (untruncated) itinerary — plus destination/notes — to
// the clipboard, with a document.execCommand fallback for browsers/
// contexts where the async Clipboard API isn't available. Called on
// every trip calendar-add (first send and repeats alike), per Pete's
// choice of "both embed + clipboard backup".
function copyTripItineraryToClipboard(trip){
  const full=[trip.destination?('📍 '+trip.destination):'',trip.notes||'',buildTripItinerary(trip)].filter(Boolean).join('\n\n');
  if(!full) return;
  function fallbackCopy(text){
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Itinerary copied to clipboard ✓');
    }catch(e){ /* clipboard is a nice-to-have here, not worth surfacing an error for */ }
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(full).then(()=>showToast('Itinerary copied to clipboard ✓')).catch(()=>fallbackCopy(full));
  } else {
    fallbackCopy(full);
  }
}

function gcalTripUrl(t){
  const sd=t.startDate.replace(/-/g,'');
  const endExcl=new Date(t.endDate+'T00:00:00');
  endExcl.setDate(endExcl.getDate()+1);
  const ed=localDateStr(endExcl).replace(/-/g,'');
  // v7.8 (GIG-033): always append a [Sent D Mon] suffix (was only added on
  // "update") — see gcalGigUrl above.
  const _sentSuffix=' [Sent '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})+']';
  const parts=['https://calendar.google.com/calendar/render?action=TEMPLATE'];
  parts.push('text='+encodeURIComponent(tripIcon(t)+' '+t.name+_sentSuffix));
  parts.push('dates='+sd+'/'+ed);
  // v7.11 (GIG-036): embed the day-by-day itinerary in the calendar
  // event's own details, truncated to a safe length — Google's calendar
  // template links can silently fail or truncate well before typical URL
  // limits once everything is URL-encoded, so this stays conservative.
  // The full, untruncated text always goes to the clipboard too (see
  // copyTripItineraryToClipboard), so nothing is lost either way.
  const MAX_ITINERARY_CHARS=1200;
  let itinerary=buildTripItinerary(t);
  if(itinerary.length>MAX_ITINERARY_CHARS){
    itinerary=itinerary.slice(0,MAX_ITINERARY_CHARS).trim()+'\n…(truncated — full itinerary copied to clipboard)';
  }
  const details=[t.destination||'',t.notes||'',itinerary].filter(Boolean).join('\n\n');
  if(details) parts.push('details='+encodeURIComponent(details));
  if(t.destination) parts.push('location='+encodeURIComponent(t.destination));
  return parts.join('&');
}

// ═══════════════════════════════════════════════════════════════════
// COMPLETION PROMPT — fires once per day on first open
// ═══════════════════════════════════════════════════════════════════
// ── Per-item calendar add (GIG-036) ──────────────────────────────────
// Same [Sent D Mon] convention as gigs/trips (GIG-033). Timed items get
// a 1-hour placeholder duration (there's no explicit end time on any
// item type); untimed items become an all-day entry for that day.
function gcalItemUrl(trip, day, it){
  const t=itemTime(it);
  let dates;
  if(t){
    const start=new Date(day.date+'T'+t+':00');
    const end=new Date(start.getTime()+60*60*1000);
    const fmt=d=>`${d.getUTCFullYear()}${String(d.getUTCMonth()+1).padStart(2,'0')}${String(d.getUTCDate()).padStart(2,'0')}T${String(d.getUTCHours()).padStart(2,'0')}${String(d.getUTCMinutes()).padStart(2,'0')}00Z`;
    dates=fmt(start)+'/'+fmt(end);
  } else {
    const ds=day.date.replace(/-/g,'');
    const next=new Date(day.date+'T00:00:00'); next.setDate(next.getDate()+1);
    const nd=localDateStr(next).replace(/-/g,'');
    dates=ds+'/'+nd;
  }
  const _sentSuffix=' [Sent '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})+']';
  const parts=['https://calendar.google.com/calendar/render?action=TEMPLATE'];
  parts.push('text='+encodeURIComponent(typeIcon(it.type)+' '+itemDisplayName(it)+_sentSuffix));
  parts.push('dates='+dates);
  const detailLines=[];
  if(trip.name) detailLines.push('Part of trip: '+trip.name);
  if(it.notes) detailLines.push(it.notes);
  if(it.bookingRef) detailLines.push('Booking ref: '+it.bookingRef);
  if(it.confirmNo) detailLines.push('Confirm no.: '+it.confirmNo);
  if(detailLines.length) parts.push('details='+encodeURIComponent(detailLines.join('\n')));
  const loc=itemLocationName(it)||it.location||it.address||(it.type==='travel'?(it.to||it.from||''):'');
  if(loc) parts.push('location='+encodeURIComponent(loc));
  return parts.join('&');
}
function markItemCalendarAdded(tripId,dayId,itemId){
  const trip=getEvent(tripId); if(!trip) return;
  const day=trip.days.find(d=>d.id===dayId); if(!day) return;
  const it=day.items.find(i=>i.id===itemId); if(!it) return;
  it.calendarAdded=true;
  trip.updatedAt=new Date().toISOString();
  saveEvent(trip);
  openDayView(tripId,dayId);
}

function checkCompletionPrompt(){
  const todayStr=localDateStr(new Date());
  const checkedKey=SK+'_cpChecked';

  // Only prompt once per calendar day
  if(localStorage.getItem(checkedKey)===todayStr) return;
  localStorage.setItem(checkedKey, todayStr);

  const d=getData();
  const all=(d.events||[]).filter(ev=>!ev._deleted);

  // Gigs: date is yesterday or earlier, not done, not missed.
  // Exclude self-completing types (appointment, gym, pets) — no done/missed concept.
  const _selfComplete=new Set(['appointment','gym','pets']);
  const pendingGigs=all.filter(ev=>
    ev.type==='gig' &&
    ev.date && ev.date<todayStr &&
    !ev.done && !ev.missed &&
    !_selfComplete.has(ev.gigType||'music')
  );

  // Trips: endDate is yesterday or earlier, status is still Planning or Booked
  const pendingTrips=all.filter(ev=>
    ev.type==='trip' &&
    ev.endDate && ev.endDate<todayStr &&
    (ev.status==='Planning'||ev.status==='Booked')
  );

  const pending=[...pendingTrips, ...pendingGigs];
  if(!pending.length) return;

  // Sort: most recently past first
  pending.sort((a,b)=>{
    const da=a.type==='gig'?a.date:a.endDate;
    const db=b.type==='gig'?b.date:b.endDate;
    return db.localeCompare(da);
  });

  // Build modal content
  const count=pending.length;
  let itemsHtml=pending.map(ev=>{
    if(ev.type==='gig'){
      const ti=gigTypeInfo(ev.gigType||'music');
      return `<div class="cp-item" id="cp-${esc(ev.id)}">
        <div class="cp-icon">${ti.icon}</div>
        <div class="cp-info">
          <div class="cp-name">${esc(ev.name)}</div>
          <div class="cp-sub">${fmtDateShort(ev.date)}${ev.venue?' · '+esc(ev.venue):''}</div>
        </div>
        <div class="cp-actions">
          <button class="cp-btn ok" onclick="cpMarkGigDone('${esc(ev.id)}')">✓ Done</button>
          <button class="cp-btn miss" onclick="cpMarkGigMissed('${esc(ev.id)}')">✗ Missed</button>
        </div>
      </div>`;
    } else {
      return `<div class="cp-item" id="cp-${esc(ev.id)}">
        <div class="cp-icon">${tripIcon(ev)}</div>
        <div class="cp-info">
          <div class="cp-name">${esc(ev.name)}</div>
          <div class="cp-sub">${fmtDateShort(ev.startDate)} – ${fmtDateShort(ev.endDate)}${ev.destination?' · '+esc(ev.destination):''}</div>
        </div>
        <div class="cp-actions">
          <button class="cp-btn complete" onclick="cpMarkTripDone('${esc(ev.id)}')">✓ Complete</button>
        </div>
      </div>`;
    }
  }).join('');

  showModal(`<div class="modal-hdr">
      <div class="modal-title">Catch up (${count})</div>
      <button class="modal-close" onclick="closeModal()">Later</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--ink3);margin-bottom:12px">
        ${count===1?'This item is':'These items are'} in the past — how did ${count===1?'it':'they'} go?
      </p>
      <div id="cpList">${itemsHtml}</div>
      <div style="margin-top:16px">
        <button class="btn btn-ghost" style="width:100%" onclick="closeModal()">Skip for now</button>
      </div>
    </div>`);
}

// Remove a completion prompt item from the list; close modal if all done
function cpRemoveItem(id){
  const el=document.getElementById('cp-'+id);
  if(el) el.remove();
  const list=document.getElementById('cpList');
  if(list&&!list.children.length) closeModal();
}

function cpMarkGigDone(id){
  const g=getEvent(id); if(!g) return;
  g.done=true; g.missed=false; g.updatedAt=new Date().toISOString();
  saveEvent(g);
  cpRemoveItem(id);
  showToast('Marked as done ✓');
}

function cpMarkGigMissed(id){
  const g=getEvent(id); if(!g) return;
  g.missed=true; g.done=false; g.updatedAt=new Date().toISOString();
  saveEvent(g);
  cpRemoveItem(id);
  showToast('Marked as missed');
}

function cpMarkTripDone(id){
  const t=getEvent(id); if(!t) return;
  t.status='Completed'; t.updatedAt=new Date().toISOString();
  saveEvent(t);
  cpRemoveItem(id);
  showToast('Trip marked complete ✓');
}

// ═══════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════
function onUnlocked(){
  // Show search bar for the default upcoming tab
  const sb=document.getElementById('searchBar');
  if(sb) sb.classList.add('visible');
  render();
  pullFromSupabase();  // initial pull
  startPoll();         // then poll every 60s in background
  // Check for past items needing completion — delay so initial pull can settle
  setTimeout(checkCompletionPrompt, 1800);
}

// Expose for launcher backup
window.getData = getData;
window.dlJSON = function(d,name){
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
};
window.exportJSON = exportJSON;
