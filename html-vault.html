<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d1117" id="metaThemeColor">
<script>
// Apply any explicit global theme preference before first paint.
(function(){try{if(localStorage.getItem('pal_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();
</script>
<title>HTML Vault v1.2</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1117'/><text x='16' y='23' font-family='system-ui,sans-serif' font-weight='700' font-size='16' fill='%2334d399' text-anchor='middle'>&#128193;</text></svg>">
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2333; --border:#30363d;
    --accent:#34d399; --accent2:#3fb950; --accent3:#58a6ff; --accent4:#ffa657; --accent5:#d2a8ff;
    --ink:#e6edf3; --ink2:#8b949e; --ink3:#484f58;
    --radius:10px; --nav-h:52px;
  }
  :root[data-theme="light"] {
    --bg:#f4f6f8; --surface:#ffffff; --surface2:#f0f2f5; --border:#dde1e7;
    --ink:#111827; --ink2:#6b7280; --ink3:#9ca3af;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}

  .top-chrome{position:fixed;top:0;left:0;right:0;z-index:100}
  .header{height:var(--nav-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px}
  .logo{font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;flex:1}
  .logo .icon{font-size:20px}
  .logo .ver{font-size:10px;color:var(--ink3);font-weight:400;margin-top:2px}
  .header-actions{display:flex;align-items:center;gap:8px}

  .sync-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:14px;font-size:11px;font-weight:600;background:var(--surface2);border:1px solid var(--border);color:var(--ink2);cursor:default;white-space:nowrap}
  .sync-chip.state-error{background:rgba(247,129,102,0.12);border-color:rgba(247,129,102,0.4);color:#f78166}
  .sync-chip.state-synced{background:rgba(63,185,80,0.12);border-color:rgba(63,185,80,0.4);color:var(--accent2)}
  .sync-chip-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}

  .sync-banner{background:rgba(88,166,255,0.08);border:1px solid rgba(88,166,255,0.2);border-radius:8px;padding:9px 14px;margin:0 14px 10px;font-size:12px;color:var(--accent3);display:none;align-items:center;gap:8px;max-width:872px}
  .sync-banner.visible{display:flex}
  .sync-banner-close{background:none;border:none;color:var(--accent3);cursor:pointer;font-size:16px;margin-left:auto;padding:0;line-height:1}

  .body-scroll{position:fixed;top:var(--nav-h);bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .panel{padding:16px 14px 100px;max-width:640px;margin:0 auto}
  @media (min-width:900px){
    .panel{max-width:900px}
    .sync-banner{max-width:872px;margin-left:auto;margin-right:auto}
    .header{padding:0 calc((100% - 900px)/2 + 14px)}
  }

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s}
  .btn-primary{background:var(--accent);color:#04120c}
  .btn-primary:hover{opacity:0.85}
  .btn-secondary{background:var(--surface2);color:var(--ink2);border:1px solid var(--border)}
  .btn-secondary:hover{border-color:var(--ink3);color:var(--ink)}
  .btn-danger{background:rgba(247,129,102,0.12);color:#f78166;border:1px solid rgba(247,129,102,0.3)}
  .btn-danger:hover{background:#f78166;color:#fff}
  .btn-sm{padding:5px 12px;font-size:12px;border-radius:6px}
  .btn:disabled{opacity:0.35;cursor:default}
  .btn:disabled:hover{opacity:0.35}

  .vault-grid{display:grid;grid-template-columns:1fr;gap:10px}
  @media (min-width:640px){.vault-grid{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:900px){.vault-grid{grid-template-columns:repeat(3,1fr)}}

  .item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px}
  .item-name{font-size:14px;font-weight:700;color:var(--ink);word-break:break-word}
  .item-meta{font-size:11px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
  .item-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

  .empty-state{text-align:center;padding:48px 24px;color:var(--ink2)}
  .empty-state .empty-icon{font-size:48px;margin-bottom:14px}
  .empty-state p{font-size:14px}
  .empty-state .empty-sub{font-size:12px;margin-top:6px}

  .section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink2);margin:6px 0 10px}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);color:var(--ink);padding:9px 18px;border-radius:8px;font-size:13px;z-index:9999;transition:transform 0.25s ease;pointer-events:none;white-space:nowrap}
  #toast.show{transform:translateX(-50%) translateY(0)}

  /* ── Modals ── */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:500;align-items:center;justify-content:center;padding:16px}
  .modal-overlay.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.35)}
  .modal-title{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
  .modal-close{background:var(--surface2);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:16px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
  label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink2);margin-bottom:5px;margin-top:14px}
  label:first-child{margin-top:0}
  input[type="text"]{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:16px;color:var(--ink);background:var(--surface2);outline:none}
  input:focus{border-color:var(--accent3)}
  .btn-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

  /* ── Full-screen viewer ── */
  #viewerOverlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:900;flex-direction:column}
  #viewerOverlay.open{display:flex}
  .viewer-bar{height:44px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px}
  .viewer-title{font-size:13px;font-weight:600;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #viewerFrame{flex:1;width:100%;border:none;background:#fff}

  #fileInput{display:none}
  #importInput{display:none}
</style>
</head>
<body>

<div id="app">
<div class="top-chrome">
  <div class="header">
    <div class="logo">
      <span class="icon">🗂️</span>
      <div>
        <div>HTML Vault</div>
        <div class="ver">v1.2</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="sync-chip" id="syncChip">
        <span class="sync-chip-dot" id="syncDot"></span>
        <span id="syncLabel">Connecting…</span>
      </button>
    </div>
  </div>
</div>

<div class="sync-banner" id="syncBanner">
  ☁ Open via Pete's Apps launcher for cloud access
  <button class="sync-banner-close" onclick="document.getElementById('syncBanner').classList.remove('visible')" title="Dismiss">✕</button>
</div>

<div class="body-scroll">
  <div class="panel">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">⬆ Upload HTML file</button>
      <button class="btn btn-secondary" onclick="exportBackup()">⬇ Export backup (JSON)</button>
      <button class="btn btn-secondary" onclick="document.getElementById('importInput').click()">Import backup</button>
    </div>
    <input type="file" id="fileInput" accept=".html,.htm,text/html" onchange="handleFileUpload(event)">
    <input type="file" id="importInput" accept=".json,application/json" onchange="handleImportFile(event)">

    <div class="section-title">Saved tools</div>
    <div id="listArea">
      <div class="empty-state">
        <div class="empty-icon">🗂️</div>
        <p>Loading…</p>
      </div>
    </div>
  </div>
</div>

<!-- Rename modal -->
<div class="modal-overlay" id="renameModal">
  <div class="modal">
    <div class="modal-title">Rename tool <button class="modal-close" onclick="closeRenameModal()">✕</button></div>
    <label>Display name</label>
    <input type="text" id="renameInput">
    <div class="btn-row">
      <button class="btn btn-primary" onclick="submitRename()">Save</button>
      <button class="btn btn-secondary" onclick="closeRenameModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Full-screen viewer -->
<div id="viewerOverlay">
  <div class="viewer-bar">
    <div class="viewer-title" id="viewerTitle"></div>
    <button class="btn btn-secondary btn-sm" onclick="popOutViewer()">Open in new tab ↗</button>
    <button class="btn btn-secondary btn-sm" onclick="closeViewer()">✕ Close</button>
  </div>
  <iframe id="viewerFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
</div>

<div id="toast"></div>
</div>

<script src="pal-config.js"></script>
<script src="pal-sync.js"></script>
<script>
// ─────────────────────────────────────────────────────────────
// HTML Vault v1.2 (HTV-001..HTV-008)
// A lightweight library for self-contained HTML "view" tools —
// upload once, open full-screen from any device. Deliberately NOT
// built on PalSync's generic table().pull()/push() sync engine:
// that engine assumes a small always-fully-pulled JSON blob per
// app, reconciled with tombstones. Vault items can be large
// (hundreds of KB) and only need fetching on demand when opened,
// so this app talks to Supabase directly via PalSync.sbFetch()
// (the shared low-level REST wrapper) while still using
// PalSync.initSession() for the PAL_SESSION handshake, origin
// guard, and token refresh — reusing the auth plumbing every
// other app in the suite already relies on.
//
// Table: html_vault_items (id, user_id, name, filename,
// html_content, size_bytes, created_at, updated_at, deleted).
// RLS: auth.uid() = user_id (Pete-only app; no Lex access).
// ─────────────────────────────────────────────────────────────

const TABLE = '/html_vault_items';
const MAX_WARN_BYTES  = 2 * 1024 * 1024; // 2MB — warn
const MAX_BLOCK_BYTES = 5 * 1024 * 1024; // 5MB — block

let items = [];           // metadata only (no html_content)
let currentViewerId = null;
let currentViewerName = '';
let renameTargetId = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function setSyncState(state, label) {
  const chip = document.getElementById('syncChip');
  const dot  = document.getElementById('syncDot');
  chip.className = 'sync-chip' + (state ? ' state-' + state : '');
  document.getElementById('syncLabel').textContent = label;
}

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(2) + ' MB';
}

function fmtDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch(e) { return iso; }
}

// ── Session ─────────────────────────────────────────────────
PalSync.initSession({
  onSession: function() {
    setSyncState('synced', 'Connected');
    document.getElementById('syncBanner').classList.remove('visible');
    loadList();
  },
  onNoSession: function() {
    setSyncState('error', 'Not connected');
    document.getElementById('syncBanner').classList.add('visible');
  }
});

window.addEventListener('message', function(e) {
  if (e.origin !== window.location.origin) return;
  if (e.data && e.data.type === 'PAL_THEME' && e.data.theme) applyTheme(e.data.theme);
});

function applyTheme(theme) {
  if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
}

// ── List (metadata only — html_content deliberately excluded) ──
async function loadList() {
  try {
    const res = await PalSync.sbFetch(
      TABLE + '?select=id,name,filename,size_bytes,created_at,updated_at,sort_order&deleted=eq.false&order=sort_order.asc.nullslast,created_at.desc',
      'GET'
    );
    if (!res.ok) throw new Error(PalSync.errorHint(res.status));
    items = await res.json();
    await backfillSortOrder();
    renderList();
  } catch (e) {
    toast('Could not load library: ' + e.message);
    renderList();
  }
}

// HTV-001: reorder needs a persisted position — timestamps don't survive
// manual reordering. Existing rows (and anyone restoring an older JSON
// backup that predates this column) will have sort_order = null. One-time,
// lazy migration: assign 1..n in the order the list is currently shown
// (nulls already sort last, after any already-numbered rows, so this
// never visually jumps anything) and persist it. Runs at most once per
// item, then every load is a plain ordered fetch.
async function backfillSortOrder() {
  const needsBackfill = items.some(function(it) { return it.sort_order == null; });
  if (!needsBackfill) return;
  let next = items.reduce(function(max, it) { return it.sort_order != null ? Math.max(max, it.sort_order) : max; }, 0) + 1;
  for (const it of items) {
    if (it.sort_order == null) {
      it.sort_order = next++;
      try {
        await PalSync.sbFetch(TABLE + '?id=eq.' + it.id, 'PATCH', { sort_order: it.sort_order });
      } catch (e) { /* best-effort — a fresh load will retry any that failed */ }
    }
  }
}

function renderList() {
  const area = document.getElementById('listArea');
  if (!items.length) {
    area.innerHTML = '<div class="empty-state"><div class="empty-icon">🗂️</div>' +
      '<p>No tools saved yet</p>' +
      '<div class="empty-sub">Upload a self-contained .html file to get started</div></div>';
    return;
  }
  area.innerHTML = '<div class="vault-grid">' + items.map(function(it, idx) {
    const isFirst = idx === 0;
    const isLast  = idx === items.length - 1;
    return '<div class="item-card">' +
      '<div class="item-name">' + escapeHtml(it.name) + '</div>' +
      '<div class="item-meta">' +
        '<span>' + escapeHtml(it.filename || '') + '</span>' +
        '<span>' + fmtBytes(it.size_bytes) + ' · added ' + fmtDate(it.created_at) + '</span>' +
      '</div>' +
      '<div class="item-actions">' +
        '<button class="btn btn-primary btn-sm" data-action="open" data-id="' + escapeHtml(it.id) + '">Open</button>' +
        '<button class="btn btn-secondary btn-sm" data-action="rename" data-id="' + escapeHtml(it.id) + '">Rename</button>' +
        '<button class="btn btn-danger btn-sm" data-action="archive" data-id="' + escapeHtml(it.id) + '">Archive</button>' +
        '<button class="btn btn-secondary btn-sm" data-action="moveup" data-id="' + escapeHtml(it.id) + '"' + (isFirst ? ' disabled' : '') + ' title="Move up">↑</button>' +
        '<button class="btn btn-secondary btn-sm" data-action="movedown" data-id="' + escapeHtml(it.id) + '"' + (isLast ? ' disabled' : '') + ' title="Move down">↓</button>' +
      '</div>' +
    '</div>';
  }).join('') + '</div>';
}

// Delegated click handler — item names never get serialized into HTML
// attributes (that was the v1.0 bug: JSON.stringify(name) embedded into
// a double-quoted onclick="" attribute broke as soon as the attribute's
// own delimiter appeared inside the stringified name). Buttons carry
// only the item's id (a UUID, never needs escaping for meaning, though
// it's still escaped above defensively); the name is looked up from the
// in-memory items array instead.
document.getElementById('listArea').addEventListener('click', function(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.disabled) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  const item = items.find(function(i) { return i.id === id; });
  if (!item) return;
  if (action === 'open') openTool(id, item.name);
  else if (action === 'rename') openRenameModal(id, item.name);
  else if (action === 'archive') archiveItem(id);
  else if (action === 'moveup') moveItem(id, -1);
  else if (action === 'movedown') moveItem(id, 1);
});

// HTV-001: swap this item's sort_order with its neighbour rather than
// renumbering the whole list — two PATCH calls regardless of list size,
// and no risk of a half-renumbered list if one request fails partway.
async function moveItem(id, direction) {
  const idx = items.findIndex(function(i) { return i.id === id; });
  const swapIdx = idx + direction;
  if (idx === -1 || swapIdx < 0 || swapIdx >= items.length) return;
  const a = items[idx], b = items[swapIdx];
  const aOrder = a.sort_order, bOrder = b.sort_order;
  try {
    await PalSync.sbFetch(TABLE + '?id=eq.' + a.id, 'PATCH', { sort_order: bOrder, updated_at: new Date().toISOString() });
    await PalSync.sbFetch(TABLE + '?id=eq.' + b.id, 'PATCH', { sort_order: aOrder, updated_at: new Date().toISOString() });
    loadList();
  } catch (e) {
    toast('Reorder failed: ' + e.message);
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

// ── Upload ──────────────────────────────────────────────────
function handleFileUpload(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  if (file.size > MAX_BLOCK_BYTES) {
    toast('File too large (' + fmtBytes(file.size) + ') — 5MB limit');
    return;
  }
  if (file.size > MAX_WARN_BYTES) {
    if (!confirm('This file is ' + fmtBytes(file.size) + ' — larger files load slower on mobile. Continue?')) return;
  }
  const reader = new FileReader();
  reader.onload = async function() {
    const html = reader.result;
    const baseName = file.name.replace(/\.html?$/i, '');
    const now = new Date().toISOString();
    // HTV-001: append new uploads to the end of the current manual order
    // (max existing sort_order + 1) rather than the old newest-first
    // placement — once ordering is user-controlled, a new upload jumping
    // to the top would undo whatever order was just set up.
    const nextOrder = items.reduce(function(max, it) { return it.sort_order != null ? Math.max(max, it.sort_order) : max; }, 0) + 1;
    const row = {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
      user_id: PalSync.getUserId(),
      name: baseName,
      filename: file.name,
      html_content: html,
      size_bytes: file.size,
      created_at: now,
      updated_at: now,
      deleted: false,
      sort_order: nextOrder
    };
    try {
      const res = await PalSync.sbFetch(TABLE, 'POST', row);
      if (!res.ok) throw new Error(PalSync.errorHint(res.status));
      toast('Saved "' + baseName + '" ✓');
      loadList();
    } catch (e) {
      toast('Upload failed: ' + e.message);
    }
  };
  reader.onerror = function() { toast('Could not read that file'); };
  reader.readAsText(file);
}

// ── Open / view ─────────────────────────────────────────────
async function openTool(id, name) {
  toast('Loading "' + name + '"…');
  try {
    const res = await PalSync.sbFetch(TABLE + '?id=eq.' + id + '&select=html_content', 'GET');
    if (!res.ok) throw new Error(PalSync.errorHint(res.status));
    const rows = await res.json();
    if (!rows.length) { toast('Tool not found'); return; }
    currentViewerId = id;
    currentViewerName = name;
    document.getElementById('viewerTitle').textContent = name;
    document.getElementById('viewerFrame').srcdoc = rows[0].html_content;
    document.getElementById('viewerOverlay').classList.add('open');
  } catch (e) {
    toast('Could not open: ' + e.message);
  }
}

function closeViewer() {
  document.getElementById('viewerOverlay').classList.remove('open');
  document.getElementById('viewerFrame').srcdoc = '';
  currentViewerId = null;
}

function popOutViewer() {
  const html = document.getElementById('viewerFrame').srcdoc;
  if (!html) return;
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// ── Rename ──────────────────────────────────────────────────
function openRenameModal(id, name) {
  renameTargetId = id;
  document.getElementById('renameInput').value = name;
  document.getElementById('renameModal').classList.add('open');
}
function closeRenameModal() {
  document.getElementById('renameModal').classList.remove('open');
  renameTargetId = null;
}
async function submitRename() {
  const newName = document.getElementById('renameInput').value.trim();
  if (!newName || !renameTargetId) return;
  try {
    const res = await PalSync.sbFetch(
      TABLE + '?id=eq.' + renameTargetId, 'PATCH',
      { name: newName, updated_at: new Date().toISOString() }
    );
    if (!res.ok) throw new Error(PalSync.errorHint(res.status));
    toast('Renamed ✓');
    closeRenameModal();
    loadList();
  } catch (e) {
    toast('Rename failed: ' + e.message);
  }
}

// ── Archive (soft delete — consistent with suite-wide pattern) ──
async function archiveItem(id) {
  if (!confirm('Archive this tool? It will be hidden from the library (recoverable from a JSON backup).')) return;
  try {
    const res = await PalSync.sbFetch(
      TABLE + '?id=eq.' + id, 'PATCH',
      { deleted: true, updated_at: new Date().toISOString() }
    );
    if (!res.ok) throw new Error(PalSync.errorHint(res.status));
    toast('Archived ✓');
    loadList();
  } catch (e) {
    toast('Archive failed: ' + e.message);
  }
}

// ── Backup export / import ───────────────────────────────────
async function exportBackup() {
  toast('Preparing backup…');
  try {
    const res = await PalSync.sbFetch(TABLE + '?select=*&deleted=eq.false&order=created_at.asc', 'GET');
    if (!res.ok) throw new Error(PalSync.errorHint(res.status));
    const rows = await res.json();
    const envelope = {
      version: 1,
      lastUpdated: new Date().toISOString(),
      lastExported: new Date().toISOString(),
      data: { items: rows }
    };
    const blob = new Blob([JSON.stringify(envelope, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'html-vault-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Backup downloaded ✓');
  } catch (e) {
    toast('Backup failed: ' + e.message);
  }
}

function handleImportFile(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function() {
    try {
      const parsed = JSON.parse(reader.result);
      const data = parsed.data || parsed; // backwards-compat unwrap
      const list = data.items || [];
      if (!list.length) { toast('No items found in that backup'); return; }
      if (!confirm('Restore ' + list.length + ' tool(s) from this backup? Existing tools with the same ID will be updated.')) return;
      let restored = 0;
      for (const it of list) {
        // Upsert pattern: PATCH first, POST if no row matched — same
        // convention used suite-wide, and the right one here since
        // restore must respect stable ids across devices.
        const patchRes = await PalSync.sbFetch(TABLE + '?id=eq.' + it.id, 'PATCH', it);
        if (patchRes.ok) {
          const patched = await patchRes.json();
          if (!patched.length) {
            const postRes = await PalSync.sbFetch(TABLE, 'POST', it);
            if (postRes.ok) restored++;
          } else {
            restored++;
          }
        }
      }
      toast('Restored ' + restored + ' of ' + list.length + ' tool(s) ✓');
      loadList();
    } catch (e) {
      toast('Import failed: ' + e.message);
    }
  };
  reader.readAsText(file);
}
</script>
