<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d1117" id="metaThemeColor">
<meta name="app-version" content="1.5">
<script>
// Apply any explicit global theme preference before first paint (suite pattern).
(function(){try{if(localStorage.getItem('pal_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();
</script>
<title>Food System v1.5</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1117'/><text x='16' y='23' font-family='system-ui,sans-serif' font-size='18' text-anchor='middle'>🥫</text></svg>">
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2333; --border:#30363d;
    --accent:#58a6ff; --fs:#fb7185;
    --green:#3fb950; --red:#f78166; --amber:#f59e0b; --purple:#d2a8ff;
    --ink:#e6edf3; --ink2:#8b949e; --ink3:#484f58;
    --hover:rgba(255,255,255,0.03); --radius:10px; --nav-h:52px; --tabs-h:44px;
  }
  :root[data-theme="light"] {
    --bg:#f4f6f8; --surface:#ffffff; --surface2:#f0f2f5; --border:#dde1e7;
    --ink:#111827; --ink2:#6b7280; --ink3:#9ca3af; --hover:rgba(0,0,0,0.03);
    --green:#1a7f37; --red:#cf222e; --amber:#b45309; --purple:#8250df; --fs:#e11d48;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  body{overflow:hidden}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ── Nav ── */
  #nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;z-index:50}
  .nav-title{font-size:15px;font-weight:700}
  .nav-title span{color:var(--fs)}
  .nav-ver{font-size:10px;color:var(--ink3);font-weight:400;margin-left:4px}
  .nav-spacer{flex:1}
  .sync-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--ink2)}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
  .sync-pill.synced .sync-dot{background:var(--green)}
  .sync-pill.syncing .sync-dot{background:var(--accent)}
  .sync-pill.pending .sync-dot{background:var(--amber)}
  .sync-pill.error .sync-dot{background:var(--red)}

  /* ── Tabs (text-only, suite rule TI-012) ── */
  #tabs{position:fixed;top:var(--nav-h);left:0;right:0;height:var(--tabs-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:2px;padding:0 8px;overflow-x:auto;scrollbar-width:none;z-index:49}
  #tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;background:none;border:none;border-bottom:2px solid transparent;padding:0 12px;color:var(--ink2);font-weight:600;font-size:13px;white-space:nowrap}
  .tab.hidden{display:none}
  .tab.active{color:var(--ink);border-bottom-color:var(--fs)}
  .tab .badge{display:inline-block;min-width:16px;padding:0 5px;margin-left:5px;border-radius:8px;font-size:10px;line-height:16px;background:var(--amber);color:#111;text-align:center}
  .tab .badge.red{background:var(--red);color:#fff}

  #main{position:fixed;top:calc(var(--nav-h) + var(--tabs-h));left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .view{display:none;max-width:1100px;margin:0 auto;padding:16px 14px calc(90px + env(safe-area-inset-bottom,0px))}
  .view.active{display:block}

  h2{font-size:17px;font-weight:700;margin:4px 0 12px}
  h3{font-size:14px;font-weight:700;margin:18px 0 8px;color:var(--ink)}
  .muted{color:var(--ink2)}
  .small{font-size:12px}
  .tiny{font-size:11px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
  .panel + .panel{margin-top:12px}

  /* ── Buttons & fields ── */
  .btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
  .btn:hover{border-color:var(--ink3)}
  .btn.primary{background:var(--fs);border-color:var(--fs);color:#fff}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--red)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:default}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:600}
  .inp,select.inp,textarea.inp{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink);outline:none;width:100%}
  /* Stock Check (v1.3) */
  .sc-diff{font-weight:700}
  .sc-diff.sc-up{color:var(--green)} .sc-diff.sc-down{color:var(--red)}
  tr.sc-changed{background:var(--hover)}
  .panel.due{border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.06)}
  .sc-actual{text-align:right}
  @media (min-width:700px){.sc-actual{width:90px}}
  .inp:focus{border-color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  @media (max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:none;padding:8px 12px;font-weight:600;font-size:13px;color:var(--ink2)}
  .seg button.on{background:var(--surface2);color:var(--ink)}

  /* ── Home ── */
  .home-top{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
  @media (max-width:700px){.home-top{grid-template-columns:1fr}}
  .headline{display:flex;align-items:baseline;gap:8px}
  .headline .num{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .headline .unit{font-size:15px;color:var(--ink2);font-weight:600}
  .measures{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .measure{border-top:2px solid var(--border);padding-top:6px}
  .measure.limit{border-top-color:var(--fs)}
  .measure .v{font-size:18px;font-weight:700}
  .measure .l{font-size:11px;color:var(--ink2)}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  @media (max-width:560px){.quick{grid-template-columns:repeat(2,1fr)}}
  .quick .btn{padding:12px 8px}

  /* ── Status chips & rotation ── */
  .chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
  .chip.usefirst{background:rgba(245,158,11,.15);color:var(--amber)}
  .chip.risk{background:rgba(210,168,255,.15);color:var(--purple)}
  .chip.maintain{background:rgba(63,185,80,.13);color:var(--green)}
  .chip.expired{background:rgba(247,129,102,.15);color:var(--red)}
  .chip.bbpast{background:rgba(247,129,102,.10);color:var(--red)}
  .item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}
  .item:first-child{border-top:none}
  .item .body{flex:1;min-width:0}
  .item .name{font-weight:600}
  .item .why{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.45}
  .item .act{display:flex;gap:6px;flex-shrink:0}
  .group-head{display:flex;align-items:center;gap:8px;margin:18px 0 6px}
  .group-head h3{margin:0}
  .empty{padding:18px;text-align:center;color:var(--ink2);font-size:13px}

  /* ── Inventory table (spreadsheet on desktop, cards on mobile) ── */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .toolbar .inp{width:auto;min-width:0;font-size:16px;padding:7px 9px}
  @media (min-width:700px){.toolbar .inp{font-size:14px}}
  .toolbar .search{flex:1;min-width:160px}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:11px;color:var(--ink2);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
  .tbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr.click{cursor:pointer}
  .tbl tr.click:hover td{background:var(--hover)}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  @media (max-width:700px){
    table.tbl.cards thead{display:none}
    table.tbl.cards, table.tbl.cards tbody, table.tbl.cards tr, table.tbl.cards td{display:block;width:100%}
    table.tbl.cards tr{padding:10px 12px;border-bottom:1px solid var(--border)}
    table.tbl.cards td{border:none;padding:1px 0}
    table.tbl.cards td[data-l]:not(.lead)::before{content:attr(data-l) ": ";color:var(--ink2);font-size:11px}
    table.tbl.cards td.lead{font-weight:600;font-size:14px}
    table.tbl.cards td.hide-m{display:none}
    table.tbl.cards .num{text-align:left}
  }
  .bulk td{padding:3px 4px}
  .bulk input,.bulk select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:5px 6px;font-size:16px;color:var(--ink);min-width:60px}
  @media (min-width:700px){.bulk input,.bulk select{font-size:13px}}
  .bulk input.bad{border-color:var(--red)}

  /* ── Bars ── */
  .bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:5px}
  .bar > i{display:block;height:100%;background:var(--fs)}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:13px}
  .kv:first-child{border-top:none}
  .kv b{font-variant-numeric:tabular-nums}
  .note{font-size:12px;color:var(--ink2);line-height:1.55;margin-top:8px}
  .warnbox{background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.35);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:12px}

  /* ── Modal ── */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:200}
  #modal.open{display:flex}
  @media (min-width:700px){#modal{align-items:center}}
  .sheet{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column}
  .sheet.wide{max-width:1050px}
  @media (min-width:700px){.sheet{border-radius:14px}}
  .sheet-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
  .sheet-head h2{margin:0;flex:1;font-size:16px}
  .sheet-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
  .sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);flex-wrap:wrap}
  .x{background:none;border:none;font-size:20px;color:var(--ink2);padding:2px 6px}
  details summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--ink2)}
  details[open] summary{margin-bottom:8px}

  /* ── Typeahead ── */
  .ta{position:relative}
  .ta-list{position:absolute;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-height:230px;overflow-y:auto;z-index:5;margin-top:2px}
  .ta-list button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--border);padding:9px 10px;font-size:14px}
  .ta-list button:hover,.ta-list button:focus{background:var(--hover)}
  .ta-list .sub{font-size:11px;color:var(--ink2)}

  /* ── Toast ── */
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border);color:var(--ink);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:300;display:flex;gap:12px;align-items:center;max-width:92vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  #toast button{background:none;border:none;color:var(--accent);font-weight:700}

  .log{font-family:ui-monospace,monospace;font-size:11px;max-height:180px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px}
  .log .err{color:var(--red)} .log .ok{color:var(--green)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav id="nav">
  <div class="nav-title">🥫 <span>Food</span> System <span class="nav-ver" id="navVer">v1.5</span></div>
  <div class="nav-spacer"></div>
  <button class="sync-pill" id="syncPill" onclick="go('settings');document.getElementById('sec-sync').scrollIntoView()" title="Sync status"><span class="sync-dot"></span><span id="syncLabel">Local</span></button>
</nav>

<!-- v1.3 (FS-053): Phase 1 scope reduction. Consume and Shopping are no
     longer primary-nav tabs — they're hidden with .tab.hidden (display:none)
     rather than removed, so their DOM (including badgeShop, still read by
     renderBadges()) and every underlying function stay exactly as they
     were; unhiding them later is a one-class change, not a rebuild.
     Shopping stays reachable from Home ("To buy" → Shopping). Stock Check
     is the new primary tab for periodic physical counts. -->
<div id="tabs" role="tablist">
  <button class="tab active" data-view="home" onclick="go('home')">Home</button>
  <button class="tab" data-view="inventory" onclick="go('inventory')">Inventory</button>
  <button class="tab" data-view="rotation" onclick="go('rotation')">Rotation<span class="badge" id="badgeRot" hidden></span></button>
  <button class="tab" data-view="resilience" onclick="go('resilience')">Resilience</button>
  <button class="tab" data-view="stockcheck" onclick="go('stockcheck')">Stock Check</button>
  <button class="tab" data-view="settings" onclick="go('settings')">Settings</button>
  <button class="tab hidden" data-view="consume" onclick="go('consume')">Consume</button>
  <button class="tab hidden" data-view="shopping" onclick="go('shopping')">Shopping<span class="badge" id="badgeShop" hidden></span></button>
</div>

<main id="main">
  <section class="view active" id="view-home"></section>
  <section class="view" id="view-inventory"></section>
  <section class="view" id="view-rotation"></section>
  <section class="view" id="view-resilience"></section>
  <section class="view" id="view-stockcheck"></section>
  <section class="view" id="view-settings"></section>
  <section class="view" id="view-consume"></section>
  <section class="view" id="view-shopping"></section>
</main>

<div id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<!-- v1.5 (FS-062): the v1.4 mobile fixes weren't enough — a real iPhone
     screenshot (Stock Check) still showed oversized, cut-off content.
     Root cause: this app's viewport meta tag was missing
     maximum-scale=1.0/user-scalable=no. Every other app in the suite
     (launcher, Test & Issues — see TI's own changelog, TI-077, where
     removing this same lock was deliberately declined) sets it; this
     app never had it. Without it, iOS Safari can zoom the page (via
     pinch or, before v1.4, via focusing a sub-16px input) and that zoom
     is sticky — it persists across this app's in-page tab switches
     (there's no full reload between them) until manually pinched back
     out, which is exactly what a static screenshot of an already-zoomed
     page looks like: oversized text, oversized boxes, content cut off
     at the screen edge. v1.4's font-size fix stopped NEW auto-zoom but
     couldn't un-zoom a tab already zoomed from an earlier tap, and did
     nothing to stop a manual pinch. This closes it properly, matching
     the rest of the suite: zoom is now impossible here at all, so this
     class of bug can't recur regardless of any future input's font
     size. Existing zoomed Safari tabs still need one manual pinch-out
     or reload after this deploys; new page loads can't zoom in the
     first place. -->
<!-- v1.4 (FS-061): mobile fixes reported directly on iPhone 16 Pro Max.
     (1) iOS zoom-on-focus: .toolbar search inputs (Inventory/Stock Check/
     Shopping) and the Bulk grid's inputs were under 16px, which makes iOS
     Safari zoom the whole page on focus — after that zoom, everything
     (Stock Check's columns included) genuinely no longer fits the screen
     until the person manually zooms back out. Both now default to 16px;
     the tighter desktop sizing is restored only above the existing 700px
     breakpoint, where zoom-on-focus doesn't happen. (2) Stock Check's
     Actual input had a fixed 84px width that didn't fill its cell in the
     mobile "card" table layout (every other input in the app is 100%
     width) — restored to fill on mobile, fixed-width only at desktop's
     real table layout. (3) Home: the stock-check status banner had no
     top margin, so it sat flush against the resilience/dog panels above
     it while every other section keeps a consistent ~12px gap — gave it
     the same margin as everything else. -->
<!-- v1.3 (FS-053): Phase 1 scope reduction to a Household Food
     Resilience & Rotation System, per Pete's request — not a rebuild,
     the existing data model, movement ledger, rotation engine and
     resilience calc are unchanged underneath.
     ACTIVE: Inventory (add/edit/adjust/remove stock), Rotation (Use
     First / Rotation Risk / Maintain / Expired), Resilience (now shows
     target + shortfall on Home as well as its own tab), dog food, and
     a new Stock Check tab — compare system vs actual quantity across
     all batches and apply the differences in one go (reuses the
     existing per-batch adjustTo(), same op openStock()'s "Counted
     quantity" field already used — no new ledger operation).
     HIDDEN, NOT DELETED: Consume and Shopping are no longer primary-nav
     tabs (.tab.hidden, display:none — DOM, ids/badges and every
     underlying function untouched). Shopping stays reachable from
     Home's "To buy" panel. Both, plus Log meal, are also reachable from
     a "Deferred features (Phase 2+)" section in Settings. Home's "Use
     food"/"Log meal" quick actions and the Inventory stock table's
     per-row "Use" button are removed (the row already opens the same
     counted-quantity editor via a click); rotItem's action button now
     opens that editor too, instead of quick-consume.
     BEHAVIOUR FIX (not just hiding): rotationFor() previously defaulted
     any batch with no logged consumption history to Rotation Risk once
     enough time had passed since first boot — harmless while consumption
     was being logged, but under this workflow logging never happens, so
     it would have flagged nearly all stock red, permanently. It now
     requires real observed consumption events before applying that
     pace-based check; with none, a distant-dated batch reads Maintain
     from date/quantity alone. Logging consumption in a future phase
     re-activates the pace-based check automatically.
     Settings gained a stock-check reminder interval (default 30 days)
     and Home/Stock Check show a "due for a check" banner from it.
     No data-model or schema change; existing/seeded data loads as-is. -->
<!-- v1.2 (FS-052): sync reviewed against the actual pal-sync.js (v1.11).
     Confirmed every cloud read/write goes through pal-sync (initSession,
     table().upsert with its 401 retry queue, paginated fetchTableRows,
     errorHint) — no direct Supabase calls. table().pull() deliberately
     not used (reasons in the SYNC header comment). Two gaps closed:
     pal-sync's upsert()/fetchTableRows() silently no-op when the session
     is gone, which could clear a pending edit that never reached the
     cloud — now aborts and keeps it pending; and a missing/broken
     pal-config.js now shows a clear local-only message instead of
     repeated TypeErrors. Settings → About names pal-sync.js. -->
<!-- v1.1 (FS-049): Phase 1 initial household inventory seeded — the 20
     supplied products (19 with stock batches; Grahams yoghurt has no
     quantity/date so is product-only). All values preserved verbatim in
     each record's `source` and shown in Product → "Originally supplied
     values". Seeds once per device, fixed ids (converges across devices,
     real edits always win), skipped if the device already holds
     user-entered household products. No stock invented for Chappie.
     Also (FS-050): sync now fetches before pushing, so an older local
     copy can no longer briefly overwrite a newer cloud edit/delete; and
     (FS-051) practical-food days equal calorie days exactly when all
     stock is uncategorised, so it isn't wrongly shown as limiting. -->
<!-- v1.0 (FS-001…FS-048): Food System Tracker — Phase 1 foundation.
     New app, pete-only in the launcher. Local-first (localStorage key
     fs_v1, standard {version,lastUpdated,lastExported,data} envelope),
     synced to Supabase table fs_records through the suite's pal-sync.js
     when opened via the launcher, full JSON backup/restore, and a paste
     import for the inventory-capture spreadsheet. Stock quantity is
     derived from an append-only movement ledger (never stored), so
     offline consumption on two devices merges without losing either.
     Requires the fs_records migration (see release notes) before cloud
     sync will work; runs local-only until then. -->
<script src="pal-config.js?v=1.5"></script>
<script src="pal-sync.js?v=1.5"></script>
<script>
// ══════════════════════════════════════════════════════════════════
// FOOD SYSTEM TRACKER  (app id: food-system-tracker, issue prefix FS)
// v1.0 — Phase 1: core food system foundation.
// v1.1 — Phase 1 initial household inventory seeded (see INV_SEED_ROWS).
// v1.2 — FS-052 sync review against the real pal-sync.js (see SYNC notes).
// v1.3 — FS-053 Phase 1 scope reduction: primary workflow is now periodic
//   Stock Check (adjustTo per batch) rather than logged consumption.
//   Consume/meal logging hidden from nav (not deleted — see part1.html's
//   .tab.hidden note and Settings → Deferred features). Rotation no
//   longer defaults distant-dated stock to Risk when there's no logged
//   consumption evidence (see rotationFor's hasEvidence note) — that
//   default made Rotation Risk fire on nearly everything once logging
//   stopped being the norm.
//
// Architecture notes (read before changing):
// • Local-first. Everything lives in localStorage under STORAGE_KEY using
//   the suite's standard envelope {version,lastUpdated,lastExported,data}.
//   Supabase (via pal-sync.js, when opened through the launcher) is a
//   synchronised copy, never the only copy. JSON export is first-class.
// • Stock quantity is NEVER stored. It is derived from the movement
//   ledger (sum of qty deltas per stock batch). Movements are append-only
//   records, so two devices consuming the same batch offline merge
//   cleanly on sync — no last-write-wins race on a quantity field.
// • Every record carries a stable id and updatedAt. Deletes are soft
//   (_deleted:true) so they sync like any other edit and stay auditable.
// • Seed records (locations, categories, the dog food product, settings)
//   use FIXED ids and a fixed old timestamp, so two devices that both
//   first-boot offline converge on the same records instead of creating
//   duplicates.
// ══════════════════════════════════════════════════════════════════

    Object.keys(KINDS).forEach(k => { if (!p.data[k]) p.data[k] = {}; });

// DERIVED INDEX — recomputed lazily after every commit
// ══════════════════════════════════════════════════════════════════

function ix() {

  const rawQty = Object.assign({}, stockQty);
  live('stock').forEach(s => { (byProduct[s.productId] = byProduct[s.productId] || []).push(s); });

  // picked it FIFO), leaving it below zero once the ledgers merge even
  // though the household total is right. The ledger is kept exactly as
  // recorded; here the negative is offset against the product's other
  // batches, oldest first, so totals and per-batch figures stay true.
  Object.keys(byProduct).forEach(pid => {
    const list = byProduct[pid];
    let deficit = 0;
    list.forEach(s => { const q = stockQty[s.id] || 0; if (q < -1e-9) { deficit += -q; stockQty[s.id] = 0; reconciled.push(s.id); } });
    if (deficit <= 1e-9) return;
    list.slice().sort((a, b) => (b.opened - a.opened) || ((a.date || '9999') < (b.date || '9999') ? -1 : (a.date || '9999') > (b.date || '9999') ? 1 : 0) || (a.createdAt < b.createdAt ? -1 : 1))
      .forEach(s => { if (deficit <= 1e-9) return; const q = stockQty[s.id] || 0; if (q <= 0) return; const t = Math.min(q, deficit); stockQty[s.id] = q - t; deficit -= t; });
  });

    id: uid('stock_'), productId: opts.productId, locationId: opts.locationId || null,
    locStatus: opts.locStatus || '', date: opts.date || null, datePrecision: opts.datePrecision || 'day',
    dateType: opts.dateType || 'best_before', opened: !!opts.opened, openedAt: opts.opened ? todayISO() : null,
    packWeightG: opts.packWeightG || null, notes: opts.notes || ''
  });
  mov(opts.purchase ? 'purchase' : 'add', s, opts.qty, { note: opts.note || '', shopId: opts.shopId || null });
  return s;
}

// FIFO: opened first, then earliest date, then oldest batch.
function fifo(productId) {
  return batchesOf(productId).slice().sort((a, b) =>
    (b.opened - a.opened) || ((a.date || '9999') < (b.date || '9999') ? -1 : (a.date || '9999') > (b.date || '9999') ? 1 : 0) ||
    (a.createdAt < b.createdAt ? -1 : 1));
}

// Consume `qty` units of a product (optionally from one batch). Splits
// across batches FIFO. Refuses to go negative. Returns movement ids.
function consume(productId, qty, opts) {
  opts = opts || {};
  qty = round(qty, 9);
  if (!(qty > 0)) throw new Error('Enter a quantity above zero');
  const pool = opts.stockId ? [D.stock[opts.stockId]].filter(Boolean) : fifo(productId);
  const avail = round(pool.reduce((a, s) => a + qtyOf(s.id), 0), 9);
  if (qty > avail + 1e-9) throw new Error('Only ' + fmtNum(avail) + ' available');
  const ids = [];
  const groupId = uid('grp_');
  let left = qty;
  for (const s of pool) {
    if (left <= 1e-9) break;
    const take = Math.min(left, qtyOf(s.id));
    if (take <= 0) continue;
    ids.push(mov('consume', s, -take, { reason: opts.reason || '', mealId: opts.mealId || null, groupId, note: opts.note || '' }).id);
    left = round(left - take, 9);
  }
  return ids;
}

// Set a batch to an exact counted quantity (stocktake / correction).
function adjustTo(stockId, newQty, note) {
  const s = D.stock[stockId];
  const delta = round(newQty - qtyOf(stockId), 9);
  if (newQty < 0) throw new Error('Quantity cannot be negative');
  if (Math.abs(delta) < 1e-9) return null;
  return mov('adjust', s, delta, { note: note || 'Counted' });
}
function removeBatch(stockId, reason) {
  const s = D.stock[stockId];
  const q = qtyOf(stockId);
  if (q > 0) mov('remove', s, -q, { reason: reason || 'discarded' });
}
// Move a whole batch, or split part of it into a new batch at the target.
function moveStock(stockId, toLocationId, qty) {
  const s = D.stock[stockId];
  const have = qtyOf(stockId);
  const from = s.locationId;
  if (toLocationId === from) return;
  const groupId = uid('grp_');
  if (qty == null || qty >= have - 1e-9) {
    s.locationId = toLocationId; s.locStatus = '';
    put('stock', s);
    mov('move', s, 0, { fromLocationId: from, toLocationId, moved: have, groupId });
    return s;
  }
  if (!(qty > 0)) throw new Error('Enter a quantity to move');
  const n = put('stock', Object.assign({}, s, { id: uid('stock_'), locationId: toLocationId, locStatus: '', createdAt: null, splitFrom: s.id }));
  mov('move', s, -qty, { fromLocationId: from, toLocationId, groupId, toStockId: n.id });
  mov('move', n, qty, { fromLocationId: from, toLocationId, groupId, fromStockId: s.id });
  return n;
}
// Undo = void the movements (soft delete). They stay in the ledger,
// marked voided, so the history remains auditable.
function voidMovements(ids) { ids.forEach(id => { const m = D.movements[id]; if (m) { m.voided = true; softDelete('movements', id); } }); }

// ══════════════════════════════════════════════════════════════════
// CONSUMPTION RATES
// ══════════════════════════════════════════════════════════════════
function dogDailyGrams() { return (settings().dogs || []).reduce((a, d) => a + (num(d.gramsPerMeal) || 0) * (num(d.mealsPerDay) || 0), 0); }
function isDogRuleProduct(pid) { return pid && pid === settings().dogProductId; }

// Observed rate (units/day) for a product from consume movements. Rule-
// driven dog movements are excluded here (that product uses its rule).
function consumptionRate(productId) {
  const S = settings(), R = S.rotation;
  const p = product(productId);
  if (p && isDogRuleProduct(productId)) {
    const w = weightPerUnit(p);
    return { rate: w ? dogDailyGrams() / w : 0, known: !!w, source: 'rule' };
  }
  const today = todayISO();
  const tracked = Math.max(0, daysBetween(S.trackingStart || today, today));
  const windowDays = Math.max(1, Math.min(R.historyWindowDays, tracked || 1));
  const since = addDays(today, -windowDays);
  let used = 0, events = 0;
  live('movements').forEach(m => {
    if (m.productId !== productId || m.type !== 'consume' || m.reason === 'rule') return;
    if (m.at.slice(0, 10) < since) return;
    used += -m.qty; events++;
  });
  const known = tracked >= R.minHistoryDays;
  return { rate: used / windowDays, known, events, windowDays, used, source: 'observed' };
}
function describeRate(r, unit) {
  if (r.source === 'rule') return 'fixed feeding rule';
  if (!r.known) return 'not enough history yet';
  if (r.rate <= 0) return 'none used in the last ' + r.windowDays + ' days';
  const perWeek = r.rate * 7;
  if (perWeek >= 1) return 'about ' + fmtNum(perWeek, perWeek < 3 ? 1 : 0) + ' ' + unitLabel(unit, 2) + ' a week';
  const perMonth = r.rate * 30;
  return perMonth >= 1 ? 'about ' + fmtNum(perMonth, 1) + ' ' + unitLabel(unit, perMonth) + ' a month' : 'very low (under 1 a month)';
}

// ══════════════════════════════════════════════════════════════════
// ROTATION ENGINE — one question: will this be used before its date?
// ══════════════════════════════════════════════════════════════════
const STATUS_ORDER = { expired: 0, usefirst: 1, risk: 2, maintain: 3 };
const STATUS_LABEL = { expired: 'Expired', usefirst: 'Use First', risk: 'Rotation Risk', maintain: 'Maintain' };

function rotationFor(s) {
  const p = product(s.productId); if (!p) return null;
  const R = settings().rotation, today = todayISO();
  const q = s._qty != null ? s._qty : qtyOf(s.id);
  const unit = p.unit;
  const out = { stock: s, product: p, qty: q, status: 'maintain', reasons: [], action: '', daysLeft: null };
  if (!s.date) {
    out.reasons.push('No date recorded');
    if (s.opened) { out.status = 'usefirst'; out.reasons = ['Opened — use promptly']; out.action = 'Use this before opening another'; }
    return out;
  }
  const dl = daysBetween(today, s.date);
  out.daysLeft = dl;
  const dateWord = s.dateType === 'use_by' ? 'use-by' : 'best-before';
  const when = fmtDate(s.date, s.datePrecision);
  if (dl < 0) {
    out.status = 'expired';
    if (s.dateType === 'use_by') {
      out.reasons.push('Use-by date passed (' + when + ')');
      out.action = 'Do not eat — remove from stock';
    } else {
      out.bbPast = true;
      out.reasons.push('Past best-before (' + when + ') — quality may have dropped, not a safety date');
      out.action = 'Check it and use soon, or remove';
    }
    return out;
  }
  const inDays = dl === 0 ? 'today' : dl === 1 ? 'tomorrow' : 'in ' + dl + ' days';
  if (s.dateType === 'use_by' && dl <= R.useByDays) {
    out.status = 'usefirst'; out.reasons.push('Use-by ' + inDays); out.action = 'Use ' + (dl === 0 ? 'today' : 'in the next ' + (dl + 1) + ' days') + ' or freeze if suitable';
    return out;
  }
  if (s.dateType !== 'use_by' && dl <= R.bestBeforeDays) {
    out.status = 'usefirst'; out.reasons.push('Best-before ' + inDays + ' (' + when + ')'); out.action = 'Plan it into meals soon';
    return out;
  }
  if (s.opened) { out.status = 'usefirst'; out.reasons.push('Opened — use promptly'); out.action = 'Use this before opening another'; return out; }

  // Projection: FIFO means earlier-dated batches of the same product get
  // eaten first, so they count against the household's pace too.
  const r = consumptionRate(p.id);
  const ahead = batchesOf(p.id).filter(o => o.id !== s.id && (o.opened || (o.date && (o.date < s.date || (o.date === s.date && o.createdAt < s.createdAt)))))
    .reduce((a, o) => a + o._qty, 0);
  const need = ahead + q;
  // v1.3 (FS-053): under the Phase 1 workflow (periodic stock checks, not
  // meal-by-meal logging) there is normally NO logged consumption at all —
  // r.events stays 0 forever, not just "not enough yet". The old fallback
  // for that case was Rotation Risk, which meant every batch beyond the
  // Use First window ended up flagged, for every household running this
  // workflow — the exact opposite of a useful signal. Rotation now needs
  // real, observed evidence of slow use (r.events > 0) before it will
  // demote a distant-dated batch to Rotation Risk; with none, it reports
  // Maintain from date/quantity alone. Real usage logging (Phase 2+,
  // dormant unless re-enabled) re-activates the pace-based check exactly
  // as before — nothing below this comment changed for that case, and dog
  // food (source 'rule', driven by the daily feeding rule rather than
  // logged events) is unaffected either way.
  const hasEvidence = r.source !== 'observed' || r.events > 0;
  const horizon = (hasEvidence && r.known) ? R.horizonDays : Math.round(R.horizonDays / 2);
  if (dl > horizon) { out.reasons.push(dateWord[0].toUpperCase() + dateWord.slice(1) + ' ' + when + ' — well ahead'); return out; }
  if (!hasEvidence) {
    out.reasons.push(dateWord[0].toUpperCase() + dateWord.slice(1) + ' ' + when + ' — plenty of time, no usage history logged');
    return out;
  }
  if (!r.known) {
    out.status = 'risk';
    out.reasons.push(fmtQty(q, unit) + ' with ' + dateWord + ' ' + when);
    out.reasons.push('Not enough consumption history yet to know if it will be used in time');
    out.action = 'Check you expect to use ' + (q === 1 ? 'it' : 'these') + ' within ' + Math.max(1, Math.round(dl / 30)) + ' month' + (dl >= 45 ? 's' : '');
    return out;
  }
  const projected = r.rate * dl;
  if (projected + 1e-9 < need) {
    const surplus = Math.min(q, need - projected);
    out.status = 'risk';
    out.reasons.push(fmtQty(q, unit) + ' remaining, ' + dateWord + ' ' + when);
    out.reasons.push('Usual use: ' + describeRate(r, unit) + (ahead > 0 ? ' (and ' + fmtNum(ahead) + ' earlier-dated first)' : ''));
    out.reasons.push(surplus >= q - 1e-9 ? 'At that pace none of this batch is likely to be used in time'
      : 'At that pace roughly ' + fmtNum(Math.ceil(surplus), 0) + ' won\'t be used in time');
    out.action = 'Use some extra over the next ' + (dl > 60 ? Math.round(dl / 30) + ' months' : Math.max(1, Math.round(dl / 7)) + ' weeks') + '; replace afterwards if you want the stock level kept';
    out.surplus = surplus;
    return out;
  }
  out.reasons.push('On track to be used before ' + dateWord + ' (' + describeRate(r, unit) + ')');
  return out;
}

function rotationAll() {
  ix();
  return live('stock').filter(s => s._qty > 1e-9 && product(s.productId)).map(rotationFor).filter(Boolean)
    .sort((a, b) => (STATUS_ORDER[a.status] - STATUS_ORDER[b.status]) || ((a.daysLeft == null ? 1e9 : a.daysLeft) - (b.daysLeft == null ? 1e9 : b.daysLeft)));
}

// ══════════════════════════════════════════════════════════════════
// RESILIENCE ENGINE (human). Transparent approximation:
//  • Usable stock: human food, quantity > 0, not past use-by. Past
//    best-before is excluded by default (conservative), shown separately.
//  • Perishables (use-by): can only count up to what the household
//    could eat before the date → capped at (days left + 1) days of need.
//  • Calorie days = usable kcal ÷ daily kcal; protein days likewise.
//  • Practical days = the most days D for which, if no category is
//    allowed to supply more than its share of each day's energy, the
//    stock still covers D full days. Stops "10 jars of pesto = 3 weeks".
//  • Estimated resilience = the lowest of the three.
// ══════════════════════════════════════════════════════════════════
function resilience(opts) {
  opts = opts || {};
  ix();
  const S = settings(), H = S.household, today = todayISO();
  const dailyK = num(H.kcal) || 0, dailyP = num(H.protein) || 0;
  let kcal = 0, prot = 0;
  const cats = {}; const unknown = [], excluded = [], capped = [];
  live('stock').forEach(s => {
    if (s._qty <= 1e-9) return;
    if (opts.exclude && opts.exclude.has(s.id)) return;
    const p = product(s.productId); if (!p || p.foodType === 'dog') return;
    const dl = s.date ? daysBetween(today, s.date) : null;
    if (dl != null && dl < 0 && (s.dateType === 'use_by' || !S.countPastBestBefore)) { excluded.push(s); return; }
    const ku = kcalPerUnit(p, s), pu = proteinPerUnit(p, s);
    if (ku == null) { unknown.push(s); return; }
    let k = ku * s._qty, pr = (pu || 0) * s._qty, f = 1;
    if (s.dateType === 'use_by' && dl != null && dailyK > 0) {
      const cap = (dl + 1) * dailyK;
      if (k > cap) { f = cap / k; capped.push(s); }
    }
    k *= f; pr *= f;
    kcal += k; prot += pr;
    const cid = category(p.categoryId) ? p.categoryId : '_none';
    cats[cid] = (cats[cid] || 0) + k;
  });
  const calDays = dailyK > 0 ? kcal / dailyK : 0;
  const protDays = dailyP > 0 ? prot / dailyP : 0;
  // Uncategorised stock can't be balance-checked, so it is left uncapped
  // (and flagged in the UI) rather than silently forcing practical days to ~0.
  const shareOf = cid => cid === '_none' ? 1 : (num(category(cid).share) != null ? num(category(cid).share) : 0.25);
  const feasible = Dd => Object.keys(cats).reduce((a, cid) => a + Math.min(cats[cid], Dd * dailyK * shareOf(cid)), 0) >= Dd * dailyK - 1e-6;
  let lo = 0, hi = calDays;
  for (let i = 0; i < 50 && dailyK > 0; i++) { const mid = (lo + hi) / 2; if (feasible(mid)) lo = mid; else hi = mid; }
  // All-uncapped stock (e.g. nothing categorised yet): practical = calories exactly, so the binary-search tolerance never mislabels it as the limiting measure.
  const practDays = dailyK > 0 ? (feasible(calDays) ? calDays : lo) : 0;
  const measures = [ { key: 'calories', label: 'Calories', days: calDays }, { key: 'protein', label: 'Protein', days: protDays }, { key: 'practical', label: 'Practical food', days: practDays } ];
  const limit = measures.reduce((m, x) => x.days < m.days ? x : m, measures[0]);
  return { kcal, prot, dailyK, dailyP, calDays, protDays, practDays, days: limit.days, limiting: limit, measures, cats, unknown, excluded, capped };
}
// "At risk": days of apparent resilience that depend on stock currently
// flagged Use First / Rotation Risk.
function resilienceAtRisk(base) {
  const risky = new Set(rotationAll().filter(r => r.status === 'usefirst' || r.status === 'risk').map(r => r.stock.id));
  if (!risky.size) return { days: 0, count: 0 };
  const without = resilience({ exclude: risky });
  return { days: Math.max(0, base.days - without.days), count: risky.size };
}
// No false precision: whole days, floored.
function fmtDays(d) { if (d == null || isNaN(d)) return '—'; if (d > 0 && d < 1) return '<1'; return String(Math.floor(d)); }

// ══════════════════════════════════════════════════════════════════
// DOG FOOD — same inventory, predictable consumption rule
// ══════════════════════════════════════════════════════════════════
function dogStatus() {
  const S = settings();
  const daily = dogDailyGrams();
  const p = product(S.dogProductId);
  let grams = 0, unknownWeight = 0;
  ix();
  live('stock').forEach(s => {
    const sp = product(s.productId);
    if (!sp || sp.foodType !== 'dog' || s._qty <= 1e-9) return;
    const w = weightPerUnit(sp, s);
    if (w) grams += s._qty * w; else unknownWeight++;
  });
  const days = daily > 0 ? grams / daily : null;
  const target = num(S.dogTargetDays) || 0;
  const targetG = target * daily;
  const shortfallG = Math.max(0, targetG - grams);
  const packG = p ? weightPerUnit(p) : null;
  const buyPacks = shortfallG > 0 && packG ? Math.ceil(shortfallG / packG) : 0;
  const depletion = days != null ? addDays(todayISO(), Math.floor(days)) : null;
  return { daily, grams, days, target, targetG, shortfallG, packG, buyPacks, depletion, product: p, unknownWeight, replenish: daily > 0 && grams < targetG };
}

// Applies the daily feeding rule as ledger movements, one per completed
// day since dogRuleStart. Ids are deterministic (per product per day),
// so two devices catching up the same days produce the SAME records and
// merge to one on sync instead of double-deducting. A day with no stock
// still gets a zero marker so a later purchase is never back-charged.
function applyDogRule() {
  const S = settings();
  const p = product(S.dogProductId);
  const daily = dogDailyGrams();
  const w = p ? weightPerUnit(p) : null;
  if (!p || !w || daily <= 0 || !S.dogRuleStart) return 0;
  const today = todayISO();
  let day = S.dogRuleStart, made = 0, guard = 0;
  while (day < today && guard++ < 1500) {
    const baseId = 'mov_dogrule_' + p.id + '_' + day;
    if (!D.movements[baseId]) {
      invalidate();
      let need = daily / w, part = 0;
      const at = day + 'T20:00:00.000Z';
      for (const s of fifo(p.id)) {
        if (need <= 1e-9) break;
        const take = Math.min(need, qtyOf(s.id));
        if (take <= 0) continue;
        const id = part === 0 ? baseId : baseId + '_' + (part + 1);
        put('movements', { id, type: 'consume', reason: 'rule', stockId: s.id, productId: p.id, qty: -round(take, 9), at, note: 'Daily feeding rule (' + daily + 'g)' });
        invalidate();
        need = round(need - take, 9); part++; made++;
      }
      if (part === 0) {
        put('movements', { id: baseId, type: 'consume', reason: 'rule', stockId: null, productId: p.id, qty: 0, at, note: 'Feeding rule: no dog food in stock' });
        made++;
      } else if (need > 1e-6) {
        D.movements[baseId].note += ' — stock ran out (' + fmtNum(need * w, 0) + 'g short)';
      }
    }
    day = addDays(day, 1);
  }
  if (made) invalidate();
  return made;
}

// ══════════════════════════════════════════════════════════════════
// SHOPPING RECOMMENDATIONS (computed live, never stored until the user
// adds one to the list or buys it)
// ══════════════════════════════════════════════════════════════════
function recommendations() {
  const out = [];
  const onList = new Set(live('shopping').filter(i => i.status === 'open' && i.productId).map(i => i.productId));
  const dog = dogStatus();
  if (dog.replenish && dog.product) {
    out.push({ key: 'dog', productId: dog.product.id, qty: Math.max(1, dog.buyPacks), unit: dog.product.unit, source: 'dog',
      why: 'Dog food covers ' + fmtNum(dog.days, 1) + ' days — target ' + dog.target + ' days' });
  }
  const R = settings();
  live('products').forEach(p => {
    if (p.foodType === 'dog' && isDogRuleProduct(p.id)) return;
    const have = productQty(p.id);
    const min = num(p.minQty), tgt = num(p.targetQty);
    if (min != null && have < min) {
      const want = Math.ceil((tgt != null && tgt > min ? tgt : min) - have);
      out.push({ key: 'min_' + p.id, productId: p.id, qty: Math.max(1, want), unit: p.unit, source: 'min', why: fmtNum(have) + ' in stock, minimum ' + fmtNum(min) + (tgt != null && tgt > min ? ', target ' + fmtNum(tgt) : '') });
      return;
    }
    // Rotation replacement: consumed "to rotate" since the last time
    // this product was added/bought, and not already back at target.
    const movs = live('movements').filter(m => m.productId === p.id);
    const lastIn = movs.filter(m => m.type === 'purchase' || m.type === 'add').reduce((a, m) => m.at > a ? m.at : a, '');
    const rotUsed = movs.filter(m => m.type === 'consume' && m.reason === 'rotation' && m.at > lastIn).reduce((a, m) => a - m.qty, 0);
    if (rotUsed > 1e-9 && !(tgt != null && have >= tgt)) {
      out.push({ key: 'rot_' + p.id, productId: p.id, qty: Math.ceil(rotUsed), unit: p.unit, source: 'rotation', why: fmtNum(rotUsed) + ' used to rotate stock — replace to keep the level' });
      return;
    }
    if (min == null) {
      const r = consumptionRate(p.id);
      if (r.known && r.rate > 0 && r.events >= 2) {
        const cover = have / r.rate;
        if (cover < R.forecastDays) {
          out.push({ key: 'fc_' + p.id, productId: p.id, qty: Math.max(1, Math.ceil(r.rate * R.forecastDays - have)), unit: p.unit, source: 'forecast',
            why: 'Used ' + describeRate(r, p.unit) + '; about ' + fmtNum(cover, 0) + ' days left' });
        }
      }
    }
  });
  out.forEach(r => r.onList = onList.has(r.productId));
  return out;
}

// ══════════════════════════════════════════════════════════════════
// SUMMARY — written into the envelope for the launcher card
// ══════════════════════════════════════════════════════════════════
function buildSummary() {
  try {
    invalidate();
    const res = resilience(), dog = dogStatus(), rot = rotationAll();
    const recs = recommendations().filter(r => !r.onList).length;
    return {
      humanDays: res.days, limiting: res.limiting.label, dogDays: dog.days, dogTargetDays: dog.target, dogDailyG: dog.daily, dogGrams: dog.grams,
      useFirst: rot.filter(r => r.status === 'usefirst').length, risk: rot.filter(r => r.status === 'risk').length,
      expired: rot.filter(r => r.status === 'expired').length,
      shopping: live('shopping').filter(i => i.status === 'open').length + recs,
      computedAt: nowISO(), computedDate: todayISO()
    };
  } catch (e) { console.error('summary', e); return null; }
}

// ══════════════════════════════════════════════════════════════════
// SERIALISATION — derived fields (_qty) never leave the device
// ══════════════════════════════════════════════════════════════════
function replacer(k, v) { return k === '_qty' ? undefined : v; }
function clean(rec) { return JSON.parse(JSON.stringify(rec, replacer)); }

// ══════════════════════════════════════════════════════════════════
// SUPABASE SYNC (via the suite's shared pal-sync.js — FS-052 review)
// ALL cloud traffic goes through pal-sync.js; this app never calls
// Supabase directly. Used from the library:
//   initSession()      — launcher PAL_SESSION handshake, origin guard
//   table(fs_records, {prefix}).upsert() — PATCH-then-POST per record,
//                        automatic 401 retry queue (pal_retry_queue_v1)
//   fetchTableRows()   — one paginated fetch for all 8 record kinds
//   hasSession(), errorHint(), retryQueueLength()
// NOT used: table().pull(). Deliberate, reviewed against pal-sync v1.11:
//   • pull() drops a record locally once the cloud confirms its
//     tombstone. This app keeps tombstones on purpose — voided
//     movements stay visible in batch history ("— voided"), and the
//     reference seed (locations, categories, Chappie, settings) is only
//     re-created when its id is absent, so dropping a deleted seed
//     record would let the next boot resurrect it.
//   • pull() only pushes ids the cloud has never seen (plus tombstones).
//     An offline edit to an EXISTING record is only sent by the app's
//     own edit-time upsert; if that fails for a non-401 reason
//     (offline, network) pal-sync drops it. This app keeps its own
//     `pending` set so such edits are always pushed on the next sync.
// Merge here (record-level last-write-wins on data.updatedAt):
//   1. fetch all rows once (fetchTableRows)
//   2. adopt any cloud record newer than local; mark local records
//      newer than, or missing from, the cloud as pending
//   3. push pending via table().upsert()

function parseSheet(text) {

  live('stock').forEach(s => {
    if (!D.products[s.productId]) issues.push('Batch ' + s.id + ' refers to missing product ' + s.productId);
    if (s.locationId && !D.locations[s.locationId]) issues.push('Batch ' + s.id + ' refers to missing location');
    const raw = ix().rawQty[s.id] || 0;
    if (raw < -1e-9) notes.push((product(s.productId) || { name: s.productId }).name + ': two devices drew on the same batch offline (' + fmtNum(raw) + ' in the ledger). Totals are correct — the shortfall is offset against the other batch(es). A stocktake (Edit → counted quantity) tidies it.');
  });
  live('movements').forEach(m => {
    if (m.stockId && !D.stock[m.stockId]) issues.push('Movement ' + m.id + ' refers to missing batch');
    if (!D.products[m.productId]) issues.push('Movement ' + m.id + ' refers to missing product');
  });
  const addsWithout = live('stock').filter(s => !live('movements').some(m => m.stockId === s.id));
  addsWithout.forEach(s => issues.push('Batch ' + s.id + ' has no movements (quantity 0)'));

// ══════════════════════════════════════════════════════════════════
// STOCK CHECK (v1.3, FS-053) — the primary Phase 1 workflow for
// correcting quantities: periodically compare system vs physical stock
// and apply the differences in one go, instead of logging consumption
// as it happens. Reuses the existing per-batch adjustTo() ledger op
// (the same one openStock()'s "Counted quantity" field already calls) —
// no new movement type, no new data model.
// ══════════════════════════════════════════════════════════════════
let _sc = { q: '' };
let _scRows = null;
function scRows() {
  return live('stock').filter(s => s._qty > 1e-9)
    .map(s => ({ s, p: product(s.productId) })).filter(x => x.p)
    .sort((a, b) => a.p.name.localeCompare(b.p.name) || ((a.s.date || '9') < (b.s.date || '9') ? -1 : 1));
}
function renderStockCheck() {
  const q = norm(_sc.q);
  let rows = scRows();
  if (q) rows = rows.filter(({ p, s }) => (norm(p.name) + ' ' + norm(p.brand) + ' ' + norm(locationName(s))).indexOf(q) !== -1);
  _scRows = rows;
  let h = '<h2>Stock Check</h2><p class="small muted" style="margin-bottom:6px">Compare what the system thinks you have against what\'s actually on the shelf, correct any differences, then apply them together.</p>';
  h += '<div class="toolbar"><input class="inp search" id="scSearch" placeholder="Search name, brand, location…" value="' + esc(_sc.q) + '" oninput="_sc.q=this.value;renderStockCheck()"></div>';
  if (!rows.length) {
    h += '<div class="panel empty">' + (scRows().length ? 'No batches match “' + esc(_sc.q) + '”.' : 'Nothing in stock to check yet.') + '</div>';
  } else {
    h += '<div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Product</th><th>Where / date</th><th class="num">System</th><th class="num">Actual</th><th class="num">Diff</th></tr></thead><tbody>';
    rows.forEach(({ s, p }, i) => {
      h += '<tr id="sc-row-' + i + '"><td class="lead" data-l="Product">' + productLabel(p) + (p.foodType === 'dog' ? ' <span class="tiny muted">dog</span>' : '') + '</td>' +
        '<td data-l="Where" class="hide-m">' + esc(locationName(s)) + (s.date ? ' · ' + dateCell(s) : '') + '</td>' +
        '<td class="num" data-l="System">' + fmtQty(s._qty, p.unit) + '</td>' +
        '<td class="num" data-l="Actual"><input class="inp sc-actual" inputmode="decimal" data-i="' + i + '" value="' + round(s._qty, 3) + '" oninput="scOnInput(' + i + ')"></td>' +
        '<td class="num sc-diff" data-l="Diff" id="sc-diff-' + i + '">—</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="row" style="margin-top:14px;gap:10px"><span class="small muted grow" id="scChangedCount">No changes yet</span><button class="btn" onclick="scMarkChecked()">Mark checked, no changes</button><button class="btn primary" onclick="scApply()">Apply stock check</button></div>';
  }
  const sc = stockCheckStatus();
  h += '<div class="note" style="margin-top:14px">' + (sc.last ? 'Last checked ' + (sc.days === 0 ? 'today' : sc.days + ' day' + (sc.days === 1 ? '' : 's') + ' ago') : 'Never checked yet') +
    (sc.overdue ? ' — <b>due for a check</b> (every ' + sc.remind + ' days, set in Settings)' : '') + '</div>';
  document.getElementById('view-stockcheck').innerHTML = h;
}
// Rows display quantity rounded to 3dp (fmtQty/round(...,3) — see renderStockCheck),
// so a batch with a repeating decimal (e.g. 11000g of a 15000g dog bag = 0.7333...
// bags) never round-trips exactly through the input. Comparing the typed value
// against that SAME 3dp baseline — not the raw full-precision quantity — is what
// makes "untouched" mean "no change": comparing against the raw value instead
// (an earlier bug) treated ordinary display rounding as a real edit and applied a
// spurious sub-gram correction to every such row, even ones the user never touched.
function scBaseline(row) { return round(row.s._qty, 3); }
function scOnInput(i) {
  const row = _scRows && _scRows[i]; if (!row) return;
  const input = document.querySelector('.sc-actual[data-i="' + i + '"]');
  const diffEl = document.getElementById('sc-diff-' + i);

  const v = num(input.value);

  else {

    diffEl.textContent = diff === 0 ? '—' : (diff > 0 ? '+' : '') + fmtNum(diff, 2);
    diffEl.className = 'num sc-diff' + (diff > 0 ? ' sc-up' : diff < 0 ? ' sc-down' : '');

}
function scUpdateSummary() {

    const v = num(el.value); if (v != null && round(v - scBaseline(row), 3) !== 0) changed++;

}
function scApply() {

    const el = document.querySelector('.sc-actual[data-i="' + i + '"]'); if (!el) return;
    const v = num(el.value);
    if (v == null || v < 0) { if (el.value.trim() !== '') skipped++; return; }

  go('home');
}

// Optional enrichment from Open Food Facts. Never blocks entry: 6s
// timeout, fills only blank fields, failure just shows a message.
async function barcodeLookup(pre) {
  const code = $v(pre + 'Barcode').replace(/\D/g, '');
  const msg = document.getElementById(pre + 'BcMsg');
  if (!code) { msg.textContent = 'Enter a barcode first'; return; }
  msg.textContent = 'Looking up…';
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + code + '.json?fields=product_name,brands,quantity,nutriments', { signal: ctl.signal });
    clearTimeout(t);
    const j = await r.json();
    if (!j || j.status !== 1 || !j.product) { msg.textContent = 'Not found — enter details manually'; return; }
    const pr = j.product, n = pr.nutriments || {};
    const fill = (fid, val) => { const e = document.getElementById(fid); if (e && !e.value && val != null && val !== '') e.value = val; };
    if (pre === 'p') { fill('pName', pr.product_name); fill('pBrand', (pr.brands || '').split(',')[0]); fill('pPack', pr.quantity); fill('pK100', n['energy-kcal_100g']); fill('pP100', n.proteins_100g); }
    else { fill('npBrand', (pr.brands || '').split(',')[0]); fill('npPack', pr.quantity); fill('npKcal', n['energy-kcal_100g']); fill('npProt', n.proteins_100g); }
    msg.textContent = 'Filled blank fields from Open Food Facts — check before saving';
  } catch (e) { msg.textContent = 'Lookup unavailable (' + (e.name === 'AbortError' ? 'timed out' : 'offline?') + ') — enter manually'; }
}

  h += '</div>';
  const recent = live('movements').filter(m => m.type === 'consume' && m.reason !== 'rule' && !m.mealId).sort((a, b) => a.at < b.at ? 1 : -1).slice(0, 15);
  if (recent.length) h += '<div class="panel"><h3 style="margin-top:0">Recent quick uses</h3>' + recent.map(m => { const p = D.products[m.productId]; return '<div class="kv"><span>' + fmtDateTime(m.at) + ' · ' + esc(p ? p.name : '?') + (m.reason === 'rotation' ? ' <span class="tiny muted">rotation</span>' : '') + '</span><b>' + fmtNum(-m.qty, 3) + ' ' + esc(p ? unitLabel(p.unit, -m.qty) : '') + '</b></div>'; }).join('') + '</div>';
  document.getElementById('view-consume').innerHTML = h;
}

// ══════════════════════════════════════════════════════════════════
// SHOPPING
// ══════════════════════════════════════════════════════════════════
const SRC_LABEL = { dog: 'Dog food target', min: 'Below minimum', rotation: 'Rotation replacement', forecast: 'Running low', manual: 'Added by you' };
function shopName(i) { const p = i.productId ? product(i.productId) : null; return p ? p.name : i.name; }
function renderShopping() {
  const recs = recommendations();
  const open = live('shopping').filter(i => i.status === 'open').sort((a, b) => a.createdAt < b.createdAt ? -1 : 1);
  const bought = live('shopping').filter(i => i.status === 'bought').sort((a, b) => a.boughtAt < b.boughtAt ? 1 : -1).slice(0, 20);
  let h = '<h2>Shopping</h2>';
  h += '<div class="panel"><div class="row">' + typeahead('shopAdd', 'Add anything… e.g. bread') + '<input class="inp" id="shopQty" placeholder="Qty" inputmode="decimal" style="width:80px"><button class="btn primary" onclick="addShopManual()">Add</button></div></div>';
  _ta.shopAdd = { allowNew: true, onPick: () => {} };
  const newRecs = recs.filter(r => !r.onList);
  h += '<div class="group-head"><h3>Recommended</h3><span class="chip usefirst">' + newRecs.length + '</span></div><div class="panel">';
  h += newRecs.length ? newRecs.map(r => { const p = product(r.productId); return '<div class="item"><div class="body"><div class="name">' + productLabel(p) + ' — ' + fmtQty(r.qty, r.unit) + (r.source === 'dog' && p.packSize ? ' <span class="muted">(' + esc(p.packSize) + ' each)</span>' : '') + '</div><div class="why">' + SRC_LABEL[r.source] + ': ' + esc(r.why) + '</div></div>' +
    '<div class="act"><button class="btn sm" onclick="recToList(\'' + r.key + '\')">Add to list</button><button class="btn sm primary" onclick="recBought(\'' + r.key + '\')">Bought</button></div></div>'; }).join('')
    : '<div class="empty">Nothing recommended. Set a minimum on products you always want in (Inventory → Products) and recommendations will appear when stock drops below it.</div>';
  h += '</div>';
  h += '<div class="group-head"><h3>List</h3><span class="chip maintain">' + open.length + '</span></div><div class="panel">';
  h += open.length ? open.map(i => '<div class="item"><div class="body"><div class="name">' + esc(shopName(i)) + (i.qty ? ' — ' + fmtQty(i.qty, i.unit || (i.productId && product(i.productId) ? product(i.productId).unit : '')) : '') + '</div><div class="why">' + SRC_LABEL[i.source || 'manual'] + (i.note ? ' · ' + esc(i.note) : '') + '</div></div>' +
    '<div class="act"><button class="btn sm ghost" onclick="softDelete(\'shopping\',\'' + i.id + '\');commit()">×</button><button class="btn sm primary" onclick="shopBought(\'' + i.id + '\')">Bought</button></div></div>').join('')
    : '<div class="empty">List is empty.</div>';
  h += '</div>';
  if (bought.length) h += '<div class="group-head"><h3>Bought</h3></div><div class="panel">' + bought.map(i => '<div class="kv"><span class="muted">' + esc(shopName(i)) + (i.qty ? ' — ' + fmtNum(i.qty) : '') + '</span><span class="small muted">' + fmtDateTime(i.boughtAt) + '</span></div>').join('') + '</div>';
  document.getElementById('view-shopping').innerHTML = h;
}
function addShopManual() {
  const text = $v('shopAdd').trim(); if (!text) return;
  const p = live('products').find(x => norm(productText(x)) === norm(text) || norm(x.name) === norm(text));
  put('shopping', { id: uid('shop_'), name: p ? p.name : text, productId: p ? p.id : null, qty: num($v('shopQty')), unit: p ? p.unit : '', source: 'manual', status: 'open' });
  commit(); toast('Added to list');
}
function recToList(key) {
  const r = recommendations().find(x => x.key === key); if (!r) return;
  put('shopping', { id: uid('shop_'), name: product(r.productId).name, productId: r.productId, qty: r.qty, unit: r.unit, source: r.source, note: r.why, status: 'open' });
  commit();
}
function recBought(key) {
  const r = recommendations().find(x => x.key === key); if (!r) return;
  const it = put('shopping', { id: uid('shop_'), name: product(r.productId).name, productId: r.productId, qty: r.qty, unit: r.unit, source: r.source, note: r.why, status: 'open' });
  invalidate(); persist();
  shopBought(it.id);
}
// Purchase flow: product known → straight to the add-stock sheet with
// qty prefilled; the new batch is recorded as a 'purchase' movement.
function shopBought(id) {
  const it = D.shopping[id];
  if (it.productId && product(it.productId)) { openAddFood({ productId: it.productId, qty: it.qty || '', shopId: id, purchase: true }); return; }
  openModal('Bought: ' + it.name, '<div class="small">Add it to the inventory now, or just tick it off (e.g. fresh food you won\'t track).</div>',
    '<button class="btn" onclick="tickOff(\'' + id + '\')">Just tick off</button><button class="btn primary" onclick="closeModal();openAddFood({newName:D.shopping[\'' + id + '\'].name,qty:D.shopping[\'' + id + '\'].qty||\'\',shopId:\'' + id + '\',purchase:true})">Add to inventory</button>');
}
function tickOff(id) { const it = D.shopping[id]; it.status = 'bought'; it.boughtAt = nowISO(); put('shopping', it); closeModal(); commit(); }

// ══════════════════════════════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════════════════════════════
function renderSettings() {
  const S = settings(), R = S.rotation;
  const dogProducts = live('products').filter(p => p.foodType === 'dog');
  let h = '<h2>Settings</h2>';
  h += '<div class="panel"><h3 style="margin-top:0">Household requirement</h3><div class="grid3">' +
    '<label class="f">Adults<input class="inp" id="sAdults" inputmode="numeric" value="' + esc(S.household.adults) + '"></label>' +
    '<label class="f">kcal per day (household)<input class="inp" id="sKcal" inputmode="numeric" value="' + esc(S.household.kcal) + '"></label>' +
    '<label class="f">Protein g per day (household)<input class="inp" id="sProt" inputmode="numeric" value="' + esc(S.household.protein) + '"></label></div>' +
    '<div class="row" style="margin-top:8px"><button class="btn sm" onclick="document.getElementById(\'sKcal\').value=2000*num($v(\'sAdults\'));document.getElementById(\'sProt\').value=50*num($v(\'sAdults\'))">Use UK reference intakes</button><span class="small muted">2000 kcal and 50g protein per adult</span></div>' +
    '<div class="grid2" style="margin-top:10px"><label class="f">Human resilience target (days)<input class="inp" id="sHumanTarget" inputmode="numeric" value="' + esc(S.humanTargetDays) + '"></label>' +
    '<label class="row small" style="align-self:end;padding-bottom:10px"><input type="checkbox" id="sPastBB"' + (S.countPastBestBefore ? ' checked' : '') + '> Count past-best-before stock</label></div></div>';
  h += '<div class="panel"><h3 style="margin-top:0">Dogs & feeding rule</h3><div id="dogRows">' + (S.dogs || []).map((d, i) => dogRow(d, i)).join('') + '</div>' +
    '<button class="btn sm" onclick="addDogRow()">+ Dog</button>' +
    '<div class="grid2" style="margin-top:10px"><label class="f">Food the rule uses<select class="inp" id="sDogProd">' + dogProducts.map(p => '<option value="' + p.id + '"' + (p.id === S.dogProductId ? ' selected' : '') + '>' + esc(productText(p)) + '</option>').join('') + '</select></label>' +
    '<label class="f">Dog food target (days)<input class="inp" id="sDogTarget" inputmode="numeric" value="' + esc(S.dogTargetDays) + '"></label></div>' +
    '<div class="note">Feeding is deducted automatically once a day from ' + fmtDate(S.dogRuleStart) + '. Current rule: <b>' + fmtNum(dogDailyGrams(), 0) + 'g/day</b>.</div></div>';
  h += '<div class="panel"><h3 style="margin-top:0">Rotation thresholds</h3><div class="grid2">' +
    '<label class="f">Use First: use-by within (days)<input class="inp" id="rUB" inputmode="numeric" value="' + R.useByDays + '"></label>' +
    '<label class="f">Use First: best-before within (days)<input class="inp" id="rBB" inputmode="numeric" value="' + R.bestBeforeDays + '"></label>' +
    '<label class="f">Check rotation risk up to (days ahead)<input class="inp" id="rHz" inputmode="numeric" value="' + R.horizonDays + '"></label>' +
    '<label class="f">History needed before trusting pace (days)<input class="inp" id="rMin" inputmode="numeric" value="' + R.minHistoryDays + '"></label>' +
    '<label class="f">Shopping: warn when fewer than (days) left<input class="inp" id="sFc" inputmode="numeric" value="' + S.forecastDays + '"></label>' +
    '<label class="f">Remind me to do a stock check every (days)<input class="inp" id="sScRemind" inputmode="numeric" value="' + (S.stockCheckReminderDays == null ? 30 : S.stockCheckReminderDays) + '"></label></div>' +
    '<div class="row" style="margin-top:12px"><span class="grow"></span><button class="btn primary" onclick="saveSettings()">Save settings</button></div></div>';
  h += '<div class="panel"><h3 style="margin-top:0">Storage locations</h3>' + live('locations').sort((a, b) => (a.order || 0) - (b.order || 0)).map(l => '<div class="row" style="padding:3px 0"><input class="inp grow" style="width:auto" value="' + esc(l.name) + '" onchange="renameRec(\'locations\',\'' + l.id + '\',this.value)"><label class="small row"><input type="checkbox"' + (l.archived ? ' checked' : '') + ' onchange="archiveRec(\'locations\',\'' + l.id + '\',this.checked)"> hidden</label></div>').join('') +
    '<div class="row" style="margin-top:6px"><input class="inp grow" id="newLoc" placeholder="New location" style="width:auto"><button class="btn" onclick="addNamed(\'locations\',\'newLoc\')">Add</button></div></div>';
  h += '<div class="panel"><h3 style="margin-top:0">Categories</h3><div class="small muted" style="margin-bottom:6px">Max share = most of a day\'s energy this category can supply in the practical-food measure.</div>' + live('categories').sort((a, b) => (a.order || 0) - (b.order || 0)).map(c => '<div class="row" style="padding:3px 0"><input class="inp grow" style="width:auto" value="' + esc(c.name) + '" onchange="renameRec(\'categories\',\'' + c.id + '\',this.value)"><input class="inp" style="width:70px" inputmode="numeric" value="' + Math.round((num(c.share) || 0) * 100) + '" onchange="setShare(\'' + c.id + '\',this.value)"><span class="small">%</span></div>').join('') +
    '<div class="row" style="margin-top:6px"><input class="inp grow" id="newCat" placeholder="New category" style="width:auto"><button class="btn" onclick="addNamed(\'categories\',\'newCat\')">Add</button></div></div>';
  h += '<div class="panel" id="sec-backup"><h3 style="margin-top:0">Backup & import</h3>' +
    '<div class="small muted">Last exported: <b>' + (W.lastExported ? fmtDateTime(W.lastExported) : 'never') + '</b>. The JSON backup is complete and portable — it does not depend on Supabase.</div>' +
    '<div class="row" style="margin-top:8px"><button class="btn primary" onclick="exportJSON()">Download JSON backup</button><button class="btn" onclick="document.getElementById(\'importFile\').click()">Restore from JSON…</button><input type="file" id="importFile" accept=".json,application/json" hidden onchange="importFile(this)"><button class="btn" onclick="openBulk()">Import spreadsheet…</button></div></div>';
  h += '<div class="panel" id="sec-sync"><h3 style="margin-top:0">Sync</h3>' +
    '<div class="kv"><span>Status</span><b>' + esc(document.getElementById('syncLabel').textContent) + '</b></div>' +
    '<div class="kv"><span>Cloud session</span><b>' + (palReady() ? 'Connected via launcher' : window.PalSync ? 'Not connected — open via the launcher' : 'pal-sync.js not loaded (local only)') + '</b></div>' +
    '<div class="kv"><span>Changes waiting to sync</span><b>' + pendingCount() + '</b></div>' +
    '<div class="kv"><span>Last successful sync</span><b>' + (_sync.lastOk ? fmtDateTime(_sync.lastOk) : '—') + '</b></div>' +
    '<div class="row" style="margin:8px 0"><button class="btn" onclick="syncNow()"' + (palReady() ? '' : ' disabled') + '>Sync now</button><button class="btn" onclick="showIntegrity()">Check ledger integrity</button></div>' +
    '<div class="log" id="syncLog"></div></div>';
  h += '<div class="panel"><details><summary style="cursor:pointer"><b>Deferred features (Phase 2+)</b></summary>' +
    '<div class="small muted" style="margin-top:8px">Not part of the Phase 1 workflow — inventory and resilience never depend on these. Kept working underneath in case you want them:</div>' +
    '<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="go(\'consume\')">Consume / quick use</button><button class="btn sm" onclick="openMeal()">Log a meal</button><button class="btn sm" onclick="go(\'shopping\')">Shopping list</button></div></details></div>';
  h += '<div class="panel"><h3 style="margin-top:0">About</h3><div class="small muted">Food System Tracker v' + APP_VERSION + ' — household food resilience & rotation. Data key <code>' + STORAGE_KEY + '</code> · cloud table <code>' + SB_TABLE + '</code> · sync via shared <code>pal-sync.js</code>' + (window.PalSync ? '' : ' <b>(not loaded)</b>') + '</div></div>';
  document.getElementById('view-settings').innerHTML = h;
  renderSyncLog();
}
function renderSyncLog() { const el = document.getElementById('syncLog'); if (!el) return; el.innerHTML = _sync.log.map(l => '<div class="' + l.type + '">' + fmtDateTime(l.ts) + ' ' + esc(l.msg) + '</div>').join('') || '<div>No sync activity yet.</div>'; }
function dogRow(d, i) {
  return '<div class="grid3" style="margin-bottom:6px" data-dog="' + i + '"><label class="f">Name<input class="inp" data-k="name" value="' + esc(d.name) + '"></label><label class="f">g per meal<input class="inp" data-k="gramsPerMeal" inputmode="decimal" value="' + esc(d.gramsPerMeal) + '"></label><label class="f">Meals/day<input class="inp" data-k="mealsPerDay" inputmode="decimal" value="' + esc(d.mealsPerDay) + '"></label></div>';
}
function addDogRow() { const wrap = document.getElementById('dogRows'); wrap.insertAdjacentHTML('beforeend', dogRow({ name: '', gramsPerMeal: '', mealsPerDay: 2 }, wrap.children.length)); }
function saveSettings() {
  const S = settings();
  const dogs = [...document.querySelectorAll('[data-dog]')].map((row, i) => {
    const g = k => row.querySelector('[data-k="' + k + '"]').value;
    return { id: (S.dogs[i] && S.dogs[i].id) || uid('dog_'), name: g('name').trim(), gramsPerMeal: num(g('gramsPerMeal')), mealsPerDay: num(g('mealsPerDay')) };
  }).filter(d => d.name && d.gramsPerMeal);
  const kcal = num($v('sKcal')), prot = num($v('sProt'));
  if (!(kcal > 0) || !(prot > 0)) { toast('Daily kcal and protein must be above zero'); return; }
  const newDogProd = $v('sDogProd');
  // Rule changes apply from today: past days already in the ledger stay as recorded
  applyDogRule();
  if (newDogProd && newDogProd !== S.dogProductId) S.dogRuleStart = todayISO();
  Object.assign(S, {
    household: { adults: num($v('sAdults')) || 0, kcal, protein: prot },
    humanTargetDays: num($v('sHumanTarget')) || 0, countPastBestBefore: document.getElementById('sPastBB').checked,
    dogs, dogProductId: newDogProd || S.dogProductId, dogTargetDays: num($v('sDogTarget')) || 0, forecastDays: num($v('sFc')) || 14,
    stockCheckReminderDays: num($v('sScRemind')) || 30,
    rotation: Object.assign({}, S.rotation, { useByDays: num($v('rUB')) || 0, bestBeforeDays: num($v('rBB')) || 0, horizonDays: num($v('rHz')) || 180, minHistoryDays: num($v('rMin')) || 0 })
  });
  put('settings', S); commit(); toast('Settings saved');
}
function renameRec(kind, id, name) { if (!name.trim()) return; const r = D[kind][id]; r.name = name.trim(); put(kind, r); commit(); }
function archiveRec(kind, id, on) { const r = D[kind][id]; r.archived = on; put(kind, r); commit(); }
function setShare(id, pct) { const c = D.categories[id]; const v = num(pct); if (v == null || v < 0 || v > 100) { toast('Share must be 0–100'); return; } c.share = v / 100; put('categories', c); commit(); }
function addNamed(kind, inputId) {
  const name = $v(inputId).trim(); if (!name) return;
  const rec = { id: uid(KINDS[kind]), name, order: 100 + live(kind).length };
  if (kind === 'categories') rec.share = 0.25;
  put(kind, rec); commit();
}
function importFile(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      const v = validateBackup(obj);
      openModal('Restore backup?', '<div class="small">From <b>' + esc(f.name) + '</b>' + (obj.exportedAt ? ', exported ' + fmtDateTime(obj.exportedAt) : '') + ':</div>' +
        Object.keys(v.counts).map(k => '<div class="kv"><span>' + k + '</span><b>' + v.counts[k] + '</b></div>').join('') +
        (v.problems.length ? '<div class="warnbox">' + v.problems.length + ' reference problem(s) in the file — it will still import.</div>' : '') +
        '<div class="note">Records in the backup replace the same records here and become the newest version (they will win on the next sync). Anything here that is not in the backup is kept. Your current data is snapshotted first (<code>' + STORAGE_KEY + '_preimport</code>).</div>',
        '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="doRestore">Restore</button>');
      document.getElementById('doRestore').onclick = () => { applyBackup(obj); closeModal(); commit(); toast('Backup restored'); };
    } catch (e) { toast('Import failed: ' + e.message); }
    input.value = '';
  };
  rd.readAsText(f);
}

// ══════════════════════════════════════════════════════════════════
// THEME (launcher PAL_THEME broadcast)
// ══════════════════════════════════════════════════════════════════
function applyTheme(theme) {
  if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light'); else document.documentElement.removeAttribute('data-theme');
  const m = document.getElementById('metaThemeColor'); if (m) m.setAttribute('content', theme === 'light' ? '#f4f6f8' : '#0d1117');
}
window.addEventListener('message', e => {
  if (e.origin !== window.location.origin || !e.data) return;
  if (e.data.type === 'PAL_THEME' && e.data.theme) applyTheme(e.data.theme);
});

// ══════════════════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════════════════
let _bootDay = null;
function dayRollover() {
  if (todayISO() === _bootDay) return;
  _bootDay = todayISO();
  if (applyDogRule()) { persist(); scheduleSync(); }
  renderAll();
}
function boot() {
  W = loadWrapper() || emptyWrapper();
  D = W.data;
  const seeded = seedIfNeeded();
  seedInventoryIfNeeded();
  if (seeded) Object.keys(KINDS).forEach(k => Object.keys(D[k]).forEach(id => { W.sync.pending[k + ':' + id] = true; }));
  _bootDay = todayISO();
  applyDogRule();
  invalidate(); persist();
  renderAll();
  initSync();
  setInterval(dayRollover, 60000);
}
boot();
</script>
